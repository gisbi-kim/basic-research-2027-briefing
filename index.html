 추진합니다.", "source_blocks": [8, 9, 10], "bullets": ["첫 번째 과학기술정보통신부 기초연구 사업 추진 방향입니다. 2027년도 중점 추진 방향에 대해서 설명드리겠습니다.", "2027년 기초연구는 투자 회복을 넘어, AI와 과학기술의 대도약을 준비하는 대한민국 기초연구 생태계 혁신에 중점을 두고 있습니다.", "기본 방향은 장기적이고 안정적인 지원, 창의적이고 도전적인 연구 투자 강화, 연구 성과의 책임성을 높이는 지원 시스템 혁신입니다.", "중점 추진 과제는 기초연구 저변 확대와 견고한 연구 안전망 구축, 청년 연구자 성장 지원, 지역 연구 역량 강화, 세계 최상위 리더급 연구자와 연구 그룹 육성, 집단 연구의 혁신성과 도전성 강화, AI를 활용한 과학 난제 해결 지원입니다.", "아울러 질적 성과 중심의 관리, 지원 체계의 전주기 글로벌화, AI 시대의 연구 관리 혁신과 책임성 강화, 평가제도 개선을 추진합니다."]}, {"id": "Z02-P02", "title": "장기·안정적 지원과 청년 연구자 성장", "start": 189, "end": 310, "text": "첫 번째 장기 안정적 연구 지원의 기초연구 저변 확대 및 견고한 연구 안전망 구축입니다. 내년도에는 역대 최대 규모의 기초연구 예산을 투자할 계획입니다. 기초연구 예산은 2.91조 원 규모이며, 약 1.8만 개 과제를 지원할 예정입니다. 이를 바탕으로 지원받는 연구자 수를 지속적으로 확대하고자 합니다. 또한 2026년에 복원된 기본 연구의 신규 과제 규모를 유지하고, 연구 기반이 취약한 연구자에 대한 우대를 지속하여 견고한 연구 안전망을 구축하겠습니다. 두 번째 청년 연구자 성장 지원입니다. 먼저 박사후 연구원에 대해서는 세종과학 펠로우십을 국내 및 복귀 유치 지원 중심으로 개편하여 성장 잠재력이 큰 박사후 연구원의 연구 기회를 지속 지원하고자 합니다. 또한 신진 연구자 지원 규모를 지속적으로 확대해 나갈 계획입니다. 그리고 올해 신진 연구자 인프라 지원 사업에서는 평가및 성과 활용 보를 축소하고 행정부담을 낮추며 수행보기 정당 사유를 추하여 제재해서 구제하고자 합니다. 구체적으로는 현재 구매 예정 장비가 대회적 여건으로 20% 이상 증가할 경우에이 부분을 수행기에 정당 사유로 명시하여 제재해서 구제하하고자 제도 개선을 하였습니다. 단기 연구 지원에 대해서는 우수한 연구가 단절없이 지원 지속되도록 한우물 파기 과제를 현재 31개에서 내년도 40개로 확대하고 우수 성과자가 최대 11년까지 연구를 지속할 수 있도록 후속 과제의 도약형 과제 지원 기준도 정비를 하였습니다.", "source_blocks": [11, 12, 13, 14, 15, 16, 17], "bullets": ["첫 번째 장기 안정적 연구 지원의 기초연구 저변 확대 및 견고한 연구 안전망 구축입니다.", "내년도에는 역대 최대 규모의 기초연구 예산을 투자할 계획입니다. 기초연구 예산은 2.91조 원 규모이며, 약 1.8만 개 과제를 지원할 예정입니다. 이를 바탕으로 지원받는 연구자 수를 지속적으로 확대하고자 합니다.", "또한 2026년에 복원된 기본 연구의 신규 과제 규모를 유지하고, 연구 기반이 취약한 연구자에 대한 우대를 지속하여 견고한 연구 안전망을 구축하겠습니다.", "두 번째 청년 연구자 성장 지원입니다. 먼저 박사후 연구원에 대해서는 세종과학 펠로우십을 국내 및 복귀 유치 지원 중심으로 개편하여 성장 잠재력이 큰 박사후 연구원의 연구 기회를 지속 지원하고자 합니다. 또한 신진 연구자 지원 규모를 지속적으로 확대해 나갈 계획입니다.", "그리고 올해 신진 연구자 인프라 지원 사업에서는 평가및 성과 활용 보를 축소하고 행정부담을 낮추며 수행보기 정당 사유를 추하여 제재해서 구제하고자 합니다. 구체적으로는 현재 구매 예정 장비가 대회적 여건으로 20% 이상 증가할 경우에이 부분을 수행기에 정당 사유로 명시하여 제재해서 구제하하고자 제도 개선을 하였습니다.", "단기 연구 지원에 대해서는 우수한 연구가 단절없이 지원 지속되도록 한우물 파기 과제를 현재 31개에서 내년도 40개로 확대하고 우수 성과자가 최대 11년까지 연구를 지속할 수 있도록 후속 과제의 도약형 과제 지원 기준도 정비를 하였습니다."]}, {"id": "Z02-P03", "title": "지역 연구 역량과 연구거점 강화", "start": 310, "end": 371, "text": "지역 연구 역량 강화입니다. 올해 신설되는 사업으로 젊은 유망한 연구자가 지역에 유입 정착하여 지역 혁식 혁신 영향의 중추로 성장할 수 있도록 장기 지원하는 지역 장기 연구 과제를 신설할 계획입니다. 초기에는 총 10년간 지원이 되는데 초기에는 연구에 필요한 장비 구축을 연하고 이후 9년 동안은 장비를 활용한 장기 연구를 이어갈 수 있도록 연일자 5억 원씩 지원할 계획이며 총 100개의 과제가 선정이 됩니다. 지역 장기 연구에 위선정되신 분들은 신진 인프라 지원 사업에 도전을 하실 수 있도록 신진 인프라 사지 사업 지원 시기를 현재 상반기에서 내년도부터는 하반기로 조정할 계획입니다. 지역 연구거점 육성입니다. 지역 혁신 미래 연구 센터를 다섯 개를 신규 선정할 계획입니다.", "source_blocks": [18, 19, 20, 21], "bullets": ["지역 연구 역량 강화입니다. 올해 신설되는 사업으로 젊은 유망한 연구자가 지역에 유입 정착하여 지역 혁식 혁신 영향의 중추로 성장할 수 있도록 장기 지원하는 지역 장기 연구 과제를 신설할 계획입니다.", "초기에는 총 10년간 지원이 되는데 초기에는 연구에 필요한 장비 구축을 연하고 이후 9년 동안은 장비를 활용한 장기 연구를 이어갈 수 있도록 연일자 5억 원씩 지원할 계획이며 총 100개의 과제가 선정이 됩니다.", "지역 장기 연구에 위선정되신 분들은 신진 인프라 지원 사업에 도전을 하실 수 있도록 신진 인프라 사지 사업 지원 시기를 현재 상반기에서 내년도부터는 하반기로 조정할 계획입니다.", "지역 연구거점 육성입니다. 지역 혁신 미래 연구 센터를 다섯 개를 신규 선정할 계획입니다."]}, {"id": "Z02-P04", "title": "리더급 연구자·국가연구소 육성", "start": 372, "end": 423, "text": "다음으로는 창의적인도 창의적이고 도전적인 기초연구 지원 체계 최상위 리더급 연구자 연구 그룹 육성입니다. 먼저 리더 연구자 육성에 대해서는 세계적 수준의 연구 성과를 창출하고 세계 선도 연구자를 육성하기 위해 리더 연구 과제를 지속 지원할 예정입니다. 올해 처음 신설된 탑티어급 연구 과제는 세 개를 내년도에 선정을 하고 유형 A의 경우에는 열개를 선정할 계획입니다. 국가 연구소 같은 경우는 세계 최고 최초 세계 최고 수준의 연구소 육성을 위해 집단 기초연구에서 가장 큰 규모로 지원하는 사업으로 내년도부터 국가 연구소의 효과적 운영을 위해 현장 컨설팅의 실효성을 높여 추진하고 신규 연구소를 지속할 확대할 계획입니다.", "source_blocks": [22, 23], "bullets": ["다음으로는 창의적인도 창의적이고 도전적인 기초연구 지원 체계 최상위 리더급 연구자 연구 그룹 육성입니다. 먼저 리더 연구자 육성에 대해서는 세계적 수준의 연구 성과를 창출하고 세계 선도 연구자를 육성하기 위해 리더 연구 과제를 지속 지원할 예정입니다. 올해 처음 신설된 탑티어급 연구 과제는 세 개를 내년도에 선정을 하고 유형 A의 경우에는 열개를 선정할 계획입니다.", "국가 연구소 같은 경우는 세계 최고 최초 세계 최고 수준의 연구소 육성을 위해 집단 기초연구에서 가장 큰 규모로 지원하는 사업으로 내년도부터 국가 연구소의 효과적 운영을 위해 현장 컨설팅의 실효성을 높여 추진하고 신규 연구소를 지속할 확대할 계획입니다."]}, {"id": "Z02-P05", "title": "집단 연구 개편과 AI 활용 연구", "start": 423, "end": 527, "text": "다음으로는 집단 연구 혁신성 강화 및 다양성 제고입니다. 집단 연구 집단 기초연구 주제의 혁신성을 제고하고 국가 사회적 아젠다와 연계성을 강화할 수 있는 미래 연구센터 체계를 구축하고자 합니다. 구체적으로는 그림에서 보실 수 있듯이 SRC 2학 연구센터, 공항 연구센터, MRC, 지역 그리고 지역 혁신 연구센터, RLRC는 현재 미래 연구 센터 트랙 아래 FRCS, FRC, FRCM, FRCR 이렇게 유지가 될 계획입니다. 그리고 새롭게 FRCX라는 트랙이 신설될 계획입니다. FRCX에 대해서는 학문 분야를 벗어나 연구 주제의 도전성, 국가 사회적 난제와의 연관성 등을 중심으로 기초연구 팀을 선발하는 트랙이고 내년도에네 개를 선정할 계획입니다. 집단 연구에 대해서는 추가적으로 의견 수렴을 거쳐 다음 달에 다시 공부할 계획입니다. 다음으로는 AI 활용 과학 난제 해결 지원입니다. AI를 활용해 새로운 연구 영역 방론을 개척할 수 있도록 과학적 난제를 AI를 활용하여 해결하는 도전적 연구를 지원할 계획입니다. 현재 핵심 연구의 전략형 트랙과 기초연구실 사업 내에서 AI를 활용한 기초연구, AI가 제시한 가설 데이터 증명 등의 검증, AI 발견 결과를 과학적 원리와 이론으로 발전하는 발전시키는 등의 과제를 선정할 계획입니다. 구체적인 선정 규모는 추후 공고할 예정입니다.", "source_blocks": [24, 25, 26, 27, 28], "bullets": ["다음으로는 집단 연구 혁신성 강화 및 다양성 제고입니다. 집단 연구 집단 기초연구 주제의 혁신성을 제고하고 국가 사회적 아젠다와 연계성을 강화할 수 있는 미래 연구센터 체계를 구축하고자 합니다. 구체적으로는 그림에서 보실 수 있듯이 SRC 2학 연구센터, 공항 연구센터, MRC, 지역 그리고 지역 혁신 연구센터, RLRC는 현재 미래 연구 센터 트랙 아래 FRCS, FRC, FRCM, FRCR 이렇게 유지가 될 계획입니다. 그리고 새롭게 FRCX라는 트랙이 신설될 계획입니다.", "FRCX에 대해서는 학문 분야를 벗어나 연구 주제의 도전성, 국가 사회적 난제와의 연관성 등을 중심으로 기초연구 팀을 선발하는 트랙이고 내년도에네 개를 선정할 계획입니다.", "집단 연구에 대해서는 추가적으로 의견 수렴을 거쳐 다음 달에 다시 공부할 계획입니다.", "다음으로는 AI 활용 과학 난제 해결 지원입니다. AI를 활용해 새로운 연구 영역 방론을 개척할 수 있도록 과학적 난제를 AI를 활용하여 해결하는 도전적 연구를 지원할 계획입니다. 현재 핵심 연구의 전략형 트랙과 기초연구실 사업 내에서 AI를 활용한 기초연구, AI가 제시한 가설 데이터 증명 등의 검증, AI 발견 결과를 과학적 원리와 이론으로 발전하는 발전시키는 등의 과제를 선정할 계획입니다. 구체적인 선정 규모는 추후 공고할 예정입니다."]}, {"id": "Z02-P06", "title": "성과 관리·글로벌화·AI 활용 책임성", "start": 528, "end": 632, "text": "연구지원 시스템 혁신입니다. 질적 성과 중심의 관리를 강화합니다. 단계, 최종 보고서 등에서 논문 특허 등 양적 실적 제출을 전면 금지하여 질적 성과 중심으로 평가를 강화할 계획입니다. 또한 집단 연구 등의 연구팀의 자율성 기반 성과 관리를 강화하고 단계 최종 평가, 컨설팅, 성과 분석 등에서 자립 역량이나 지속 가능성 등의 중점을 두는 방향으로 성과 관리 체계를 개선해 나갈 계획입니다. 연구과제 지원의 전과 글로벌 화입니다. 우리나라 연구 생태계에 편입된 해외 학위 취득자나 우수 외국인 연구자들의 편의성을 높 편의성을 높이고 연구 참여 기회를 확대하기 위해 영문 과제 공금은 그리고 각종 양식의 글로벌 표준 양식화 등을 추진할 계획입니다. 또한 외국인 지원자수가 많거나 선정 평가 시 해외 평가 위원회 참여 필요성이 높은 트랙 사업들을 대상으로 영문 계획서와 같은 영문 양식 도입을 확대해 나갈 계획입니다. AI 시대 연구 관리 혁신 및 책임성 강화에 대해서 말씀드리겠습니다. 연구지원 방식 자체를 과학적으로 분석 검증하여 기초연구 지원 체계를 지속적으로 고도화해 나가고자 합니다. 또한 연구현장에서 최근 생성형 AI 활용이 확산됨에 따라 연구자가 책임성 투명성 기반 하에서 AI를 효과적으로 활용할 수 있는 연구 문화를 조성하기 위해 연구 계획서 등의 AI 활용 경향을 시범적으로 파악해 나가고자 합니다.", "source_blocks": [29, 30, 31, 32, 33, 34, 35], "bullets": ["연구지원 시스템 혁신입니다. 질적 성과 중심의 관리를 강화합니다. 단계, 최종 보고서 등에서 논문 특허 등 양적 실적 제출을 전면 금지하여 질적 성과 중심으로 평가를 강화할 계획입니다. 또한 집단 연구 등의 연구팀의 자율성 기반 성과 관리를 강화하고 단계 최종 평가, 컨설팅, 성과 분석 등에서 자립 역량이나 지속 가능성 등의 중점을 두는 방향으로 성과 관리 체계를 개선해 나갈 계획입니다.", "연구과제 지원의 전과 글로벌 화입니다. 우리나라 연구 생태계에 편입된 해외 학위 취득자나 우수 외국인 연구자들의 편의성을 높 편의성을 높이고 연구 참여 기회를 확대하기 위해 영문 과제 공금은 그리고 각종 양식의 글로벌 표준 양식화 등을 추진할 계획입니다. 또한 외국인 지원자수가 많거나 선정 평가 시 해외 평가 위원회 참여 필요성이 높은 트랙 사업들을 대상으로 영문 계획서와 같은 영문 양식 도입을 확대해 나갈 계획입니다.", "AI 시대 연구 관리 혁신 및 책임성 강화에 대해서 말씀드리겠습니다. 연구지원 방식 자체를 과학적으로 분석 검증하여 기초연구 지원 체계를 지속적으로 고도화해 나가고자 합니다. 또한 연구현장에서 최근 생성형 AI 활용이 확산됨에 따라 연구자가 책임성 투명성 기반 하에서 AI를 효과적으로 활용할 수 있는 연구 문화를 조성하기 위해 연구 계획서 등의 AI 활용 경향을 시범적으로 파악해 나가고자 합니다."], "bullet_labels": ["질적 성과 중심 관리", "연구지원의 글로벌화", "AI 시대 연구 관리와 책임성"]}, {"id": "Z02-P07", "title": "평가 개선과 성과 홍보", "start": 632, "end": 686, "text": "평가 제도 개선 및 홍보 강화입니다. 기초연구실 선정 평가와 리더 선도 센터 최종 평가를 발표 평가로 운영할 계획입니다. 또한 연구자가 실패 부담없이 도전할 수 있도록 단계 최종 평가 등급을 폐지하고 성실한 수행에 따른 연구 완료 여부만 평가할 계획입니다. 그리고 출연연 PBS 폐지에 따라서 출연연 소송 연구자들이 기초연구 과제에 신청하는 것을 제한하여 대학 교원 중심으로 과제 수혜가 확대되도록 할 계획입니다. 마지막으로 과제 협약 시점부터 우수성과 대국민 홍보 관리를 하고 주요 제 전널 개제 성과는 과기부 브리핑 언론사 인터뷰 등과 연계하여 홍보 효과를 제고하고자 합니다.", "source_blocks": [36, 37, 38, 39], "bullets": ["평가 제도 개선 및 홍보 강화입니다. 기초연구실 선정 평가와 리더 선도 센터 최종 평가를 발표 평가로 운영할 계획입니다.", "또한 연구자가 실패 부담없이 도전할 수 있도록 단계 최종 평가 등급을 폐지하고 성실한 수행에 따른 연구 완료 여부만 평가할 계획입니다.", "그리고 출연연 PBS 폐지에 따라서 출연연 소송 연구자들이 기초연구 과제에 신청하는 것을 제한하여 대학 교원 중심으로 과제 수혜가 확대되도록 할 계획입니다.", "마지막으로 과제 협약 시점부터 우수성과 대국민 홍보 관리를 하고 주요 제 전널 개제 성과는 과기부 브리핑 언론사 인터뷰 등과 연계하여 홍보 효과를 제고하고자 합니다."]}, {"id": "Z02-P08", "title": "예산과 지원 규모", "start": 692, "end": 798, "text": "다음으로는 2027년도 예산 및 지원 계획에 대해서 말씀드리겠습니다. 2027년도 기초연구사업 예산은 과학기술정보통신부 2조 9,102억 원과 교육부 6,469억 원을 합쳐 총 3조 5,571억 원입니다. 과학기술정보통신부 예산은 2026년 2조 7,362억 원 대비 약 1,739억 원 증가했습니다. 다만 현재 국회 심의 중이므로 최종 규모는 변동될 수 있습니다. 기초 2027년도 기초연구 사업 지원 예산은 상세히 말씀드리겠습니다. 개인 연구에서는 개인 연구 예산 총액은 2조 4,421억 원이고 총 지원 과제 수는 18,11개 과제입니다. 과학 리더 핵심 신진 그리고 세종 과학 펠로우십 지원 규모 및 과제 수는 표를 참고해 주시기 바랍니다. 집단 연구에 같은 경우는 예산이 4,681억 원 총 505 과제가 지원됩니다. 세부 예상 규모 및 과제 수는 표를 참고해 주시기 바랍니다. 27년도 기초연구 사업 선정 계획에서입니다. 각 트랙별로 구체적인 선정 과제 수들이 나와 있습니다. 부분은 이후 사업 설명에서 자세히 설명드리겠습니다. 이상으로 저희 발표는 마치겠습니다.", "source_blocks": [40, 41, 42, 43, 44, 45, 46, 47], "bullets": ["다음으로는 2027년도 예산 및 지원 계획에 대해서 말씀드리겠습니다.", "2027년도 기초연구사업 예산은 과학기술정보통신부 2조 9,102억 원과 교육부 6,469억 원을 합쳐 총 3조 5,571억 원입니다.", "과학기술정보통신부 예산은 2026년 2조 7,362억 원 대비 약 1,739억 원 증가했습니다. 다만 현재 국회 심의 중이므로 최종 규모는 변동될 수 있습니다.", "기초 2027년도 기초연구 사업 지원 예산은 상세히 말씀드리겠습니다. 개인 연구에서는 개인 연구 예산 총액은 2조 4,421억 원이고 총 지원 과제 수는 18,11개 과제입니다. 과학 리더 핵심 신진 그리고 세종 과학 펠로우십 지원 규모 및 과제 수는 표를 참고해 주시기 바랍니다.", "집단 연구에 같은 경우는 예산이 4,681억 원 총 505 과제가 지원됩니다. 세부 예상 규모 및 과제 수는 표를 참고해 주시기 바랍니다.", "27년도 기초연구 사업 선정 계획에서입니다. 각 트랙별로 구체적인 선정 과제 수들이 나와 있습니다. 부분은 이후 사업 설명에서 자세히 설명드리겠습니다. 이상으로 저희 발표는 마치겠습니다."]}], "summary": ["장기적·안정적 지원, 창의적·도전적 연구, 성과 책임성 강화를 중심으로 2027년 정책 방향을 설명합니다.", "청년·지역 연구자 지원, 리더급 연구와 집단 연구 육성, AI를 활용한 과학 난제 해결이 주요 과제입니다.", "질적 성과 중심의 관리와 평가 개선을 추진합니다. 제시된 예산과 지원 규모는 국회 심의에 따라 달라질 수 있습니다."]}, {"id": "Z03", "title": "개인 연구 사업별 지원 내용", "start": 799, "end": 1628, "paragraphs": [{"id": "Z03-P01", "title": "리더 연구", "start": 799, "end": 888, "text": "다음은 과학기술정보통신부 기초연구 사업, 개인 연구 사업 안내 및 신규과제 신청 유의 사항을 한국연구재단 개인구지원 팀 임무군 팀장이 발표하겠습니다. 안녕하세요. 연구재단 개인 연구지원 팀장 임무군입니다. 지금부터는 2027년도 개인 연구지원 사업 각 세부 사업별로 설명을 드리도록 하겠습니다. 보시는 슬라이드는 먼저 리더 연구입니다. 리더 연구의 연구 기간은 유형 A, B 모두 9년 5+ 4이고 연구비는 유형 B는 연회, 유형 A는 8억 원 내외가 입니다. 선정 규모는 유형 B 같은 경우는 세 개 내외이고 A는 후속 두 개의 내외를 포함해서 전체적으로 열개 내외가 입니다. 지원 대상은 대학 이공분야 전임·비전임 포함한 이공분야 교원하고 국공립 민간 연구소의 연구원이 입니다. 단 PBS 폐지된 출연연 소속 연구자는 신청이 불가하다는 점이 올해 바뀐 점이 입니다. 유형비의 경우에는 27년 3단계 진입 예정인 기존 리더 연구자도 신청이 가능합니다. 참고로 리더 연구는 이번 1차 공고에 같이 공고는 하지만 6월 개시이고 1차년도 연구 기간은 9개월이 입니다.", "source_blocks": [48, 49, 50, 51, 52, 53], "bullets": ["다음은 과학기술정보통신부 기초연구 사업, 개인 연구 사업 안내 및 신규과제 신청 유의 사항을 한국연구재단 개인구지원 팀 임무군 팀장이 발표하겠습니다. 안녕하세요. 연구재단 개인 연구지원 팀장 임무군입니다. 지금부터는 2027년도 개인 연구지원 사업 각 세부 사업별로 설명을 드리도록 하겠습니다. 보시는 슬라이드는 먼저 리더 연구입니다.", "리더 연구의 연구 기간은 유형 A, B 모두 9년 5+ 4이고 연구비는 유형 B는 연회, 유형 A는 8억 원 내외가 입니다. 선정 규모는 유형 B 같은 경우는 세 개 내외이고 A는 후속 두 개의 내외를 포함해서 전체적으로 열개 내외가 입니다.", "지원 대상은 대학 이공분야 전임·비전임 포함한 이공분야 교원하고 국공립 민간 연구소의 연구원이 입니다. 단 PBS 폐지된 출연연 소속 연구자는 신청이 불가하다는 점이 올해 바뀐 점이 입니다. 유형비의 경우에는 27년 3단계 진입 예정인 기존 리더 연구자도 신청이 가능합니다.", "참고로 리더 연구는 이번 1차 공고에 같이 공고는 하지만 6월 개시이고 1차년도 연구 기간은 9개월이 입니다."]}, {"id": "Z03-P02", "title": "핵심 연구 유형 C·B·A", "start": 888, "end": 960, "text": "다음은 핵심 연구 유형 CBA 그리고 도약형 한우물 파기 기초연구에 대해 말씀드리겠습니다. 우선 핵심 연구 유형 CBA는 모두 3월 1일 개시이고 연구 기간은 1일 내지 5년으로 연구자가 자율 설정 가능하고 연구비는 각각 3억 원, 2억 원, 1억 원 내가 입니다. 선정 규모는 유형 C가 100개 내외, B가 60, 670개 내외, 그리고 A가 825개 내외가 될 예정이고 지원 대상은 보시면 알겠지만 리더 연구와 동일하게 이렇게 지원 대상이 돼 있습니다. 참고로 저희가 슬라이드에서 지원 대상의 파란색 부분은 교원 예를 들어서 교원 전임 비전임 이거는 정규직 교원이나 비전임 교원도 모두 신청 가능하다는 의미이고 연구원이 민간 연구사 연구원이라고 이렇게 연구원에 파란색 돼 있는 거는 앞에 별다른 설명이 없으면 정규직 비정규직 연구원 모두 신청이 가능하다는 의미가 입니다.", "source_blocks": [54, 55], "bullets": ["다음은 핵심 연구 유형 CBA 그리고 도약형 한우물 파기 기초연구에 대해 말씀드리겠습니다. 우선 핵심 연구 유형 CBA는 모두 3월 1일 개시이고 연구 기간은 1일 내지 5년으로 연구자가 자율 설정 가능하고 연구비는 각각 3억 원, 2억 원, 1억 원 내가 입니다. 선정 규모는 유형 C가 100개 내외, B가 60, 670개 내외, 그리고 A가 825개 내외가 될 예정이고 지원 대상은 보시면 알겠지만 리더 연구와 동일하게 이렇게 지원 대상이 돼 있습니다.", "참고로 저희가 슬라이드에서 지원 대상의 파란색 부분은 교원 예를 들어서 교원 전임 비전임 이거는 정규직 교원이나 비전임 교원도 모두 신청 가능하다는 의미이고 연구원이 민간 연구사 연구원이라고 이렇게 연구원에 파란색 돼 있는 거는 앞에 별다른 설명이 없으면 정규직 비정규직 연구원 모두 신청이 가능하다는 의미가 입니다."]}, {"id": "Z03-P03", "title": "도약형과 한우물 파기", "start": 960, "end": 1048, "text": "다음은 도약형에 대해 말씀드리겠습니다. 도약형의 연구 기간은 3년, 연구비는 2.5억 원 내외입니다. 지원 대상은 도약형 연구 같은 경우에 후속 연구 개념이라 핵심 연구 유형 BC 그리고 신진 연구 유형 B 및 구중견 후속 그리고 중견 연계 신진 후속 연구 책임자 등 2027년 종료 예정 연구자를 대상으로 하고 있습니다. 단 도약형도 마찬가지로 PBS 폐지된 출연연 소은 신청이 불가합니다. 다음은 한우물 파기 기초연구입니다. 연구 기간은 10년 5플러스 5이고 연구비는 연간 2억 원 내외 그리고 선정 규모는 올해 앞서 말씀드렸듯이 40개 내외가 입니다. 지원 대상은 개인기초 타 위화하고는 다른데 박사학위 취득 후 15년 이내인 대학 이공분학 교원 전임 비전임 상관없이 교원 및 국공립 민간 연구소 연구원이고 한우물 파기 기초연구도 마찬가지로 PBS 폐지된 출연연 소속 연구자는 신청이 불가합니다. 다음은 핵심 연구의 글로벌 매칭형, 전략형, 그다음에 기본 연구 B, 기본 연구 A에 대해 말씀드리겠습니다.", "source_blocks": [56, 57, 58, 59], "bullets": ["다음은 도약형에 대해 말씀드리겠습니다. 도약형의 연구 기간은 3년, 연구비는 2.5억 원 내외입니다. 지원 대상은 도약형 연구 같은 경우에 후속 연구 개념이라 핵심 연구 유형 BC 그리고 신진 연구 유형 B 및 구중견 후속 그리고 중견 연계 신진 후속 연구 책임자 등 2027년 종료 예정 연구자를 대상으로 하고 있습니다. 단 도약형도 마찬가지로 PBS 폐지된 출연연 소은 신청이 불가합니다.", "다음은 한우물 파기 기초연구입니다. 연구 기간은 10년 5플러스 5이고 연구비는 연간 2억 원 내외 그리고 선정 규모는 올해 앞서 말씀드렸듯이 40개 내외가 입니다.", "지원 대상은 개인기초 타 위화하고는 다른데 박사학위 취득 후 15년 이내인 대학 이공분학 교원 전임 비전임 상관없이 교원 및 국공립 민간 연구소 연구원이고 한우물 파기 기초연구도 마찬가지로 PBS 폐지된 출연연 소속 연구자는 신청이 불가합니다.", "다음은 핵심 연구의 글로벌 매칭형, 전략형, 그다음에 기본 연구 B, 기본 연구 A에 대해 말씀드리겠습니다."]}, {"id": "Z03-P04", "title": "글로벌 매칭형·전략형·기본 연구", "start": 1048, "end": 1121, "text": "참고로 여기이 장표에 있는 사업들은 3월 1일 개시 사업은 아닙니다. 먼저 글로벌 매칭형은 12월 개시이고 3년간 연 1.5억 원 내외 지원 예정이고 한 20개 내외 정도 선정 예정에 있습니다. 전략형은 9월 1일 개시이고 연구 기간은 1에서 3년이고 연구비는 연 2억 원 내외입니다. 선정 규모는 50개 내외이고 지원 대상은 다른 유형과는 다르게 전략에는 PBS 폐지된 출연연 소속도 신청이 가능합니다. 다음으로 기본 연구 BA에 대해 말씀드리겠습니다. 지원 기간은 두 유형 모두 1에서 5년이고 연구비는 기본 유형 B는 연천만 원 내외, A는 5천만 원 내외가 입니다. 선정 규모는 기본 B는제 내외, A는 750과제 내외이고 지원 대상은 다른 유형과는 다르게 대학 교원인 경우에는 기본 연구 A B하고 A에는 모두 전임 교원만 대상으로 하고 있습니다.", "source_blocks": [60, 61, 62], "bullets": ["참고로 여기이 장표에 있는 사업들은 3월 1일 개시 사업은 아닙니다.", "먼저 글로벌 매칭형은 12월 개시이고 3년간 연 1.5억 원 내외 지원 예정이고 한 20개 내외 정도 선정 예정에 있습니다.", "전략형은 9월 1일 개시이고 연구 기간은 1에서 3년이고 연구비는 연 2억 원 내외입니다. 선정 규모는 50개 내외이고 지원 대상은 다른 유형과는 다르게 전략에는 PBS 폐지된 출연연 소속도 신청이 가능합니다.", "다음으로 기본 연구 BA에 대해 말씀드리겠습니다. 지원 기간은 두 유형 모두 1에서 5년이고 연구비는 기본 유형 B는 연천만 원 내외, A는 5천만 원 내외가 입니다.", "선정 규모는 기본 B는제 내외, A는 750과제 내외이고 지원 대상은 다른 유형과는 다르게 대학 교원인 경우에는 기본 연구 A B하고 A에는 모두 전임 교원만 대상으로 하고 있습니다."]}, {"id": "Z03-P05", "title": "신진 연구와 인프라 지원", "start": 1123, "end": 1214, "text": "다음은 신진 연구 그룹에 대해서 말씀드리겠습니다. 연구 개시는 3월이고 우선 신진 연구 유형 B의 경우 연구 기간은 보시는 것처럼 1에서 5년 연구비는 연 1.5억 원 내외이고 선정 규모는 27년에 460개 내외입니다. 유형 A는 연구 기간은 1에서 3년이고 연구비는 1억 원 내외 선정 규모는 600개 내외가 입니다. 지원 대상은 두영 모두 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내대학 이공분야 전임 교원 및 국공립 민간 연구소의 정규직 연구원이 입니다. 신진 연구는 앞서 설명드렸던 요과는 다르게 모두 교원도 전임 교원 국공립 민간 연구소도 정규직 연구원 분들이 신청이 가능합니다. 다음은 엠팩에서 수행하는 신진 연구자 인프라 지원 사업입니다. 신진 연구자 인프라 지원 사업은 올해까지 3월 1일에 연구를 개시했으나, 내년부터는 신진 지역 장기 연구에 선정되지 않은 연구자를 추가로 지원할 수 있도록 개시일을 9월 1일로 변경했습니다. 자세한 내용은 담당 기관이 별도로 공지하는 신청 요강을 확인해 주시기 바랍니다. 내년 선정 규모는 70개 내외로 예상됩니다.", "source_blocks": [63, 64, 65, 66], "bullets": ["다음은 신진 연구 그룹에 대해서 말씀드리겠습니다. 연구 개시는 3월이고 우선 신진 연구 유형 B의 경우 연구 기간은 보시는 것처럼 1에서 5년 연구비는 연 1.5억 원 내외이고 선정 규모는 27년에 460개 내외입니다.", "유형 A는 연구 기간은 1에서 3년이고 연구비는 1억 원 내외 선정 규모는 600개 내외가 입니다.", "지원 대상은 두영 모두 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내대학 이공분야 전임 교원 및 국공립 민간 연구소의 정규직 연구원이 입니다. 신진 연구는 앞서 설명드렸던 요과는 다르게 모두 교원도 전임 교원 국공립 민간 연구소도 정규직 연구원 분들이 신청이 가능합니다.", "다음은 엠팩에서 수행하는 신진 연구자 인프라 지원 사업입니다. 신진 연구자 인프라 지원 사업은 올해까지 3월 1일에 연구를 개시했으나, 내년부터는 신진 지역 장기 연구에 선정되지 않은 연구자를 추가로 지원할 수 있도록 개시일을 9월 1일로 변경했습니다. 자세한 내용은 담당 기관이 별도로 공지하는 신청 요강을 확인해 주시기 바랍니다. 내년 선정 규모는 70개 내외로 예상됩니다."]}, {"id": "Z03-P06", "title": "신진 지역 장기 연구", "start": 1214, "end": 1281, "text": "다음은 내년에 신규로 추진되는 신진 지역 장기 연구입니다. 기간은 10년 5+ 5이고 연구비는 1년 차는 3억 원 내외이고 2년 차부터는 연 1.5억 원 내외입니다. 지원 대상은 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내 지역대학 이공분 20공분야 전임 교원입니다. 신진 지역 장기 연구는 지역 대학의 전임 교원을 대상으로 한다는 점에서 신진 연구 유형 A·B와 차이가 있습니다. 신진 연구자 지원 사업도 마찬가지로 PBS 폐지된 출연연은 신청이 불가하고 뒷부분에서 자세히 말씀드리겠지만 신규 사업인 신진 지역 장기 연구 같은 경우는 반드시 장비 구축 계획이 있어야 신청이 가능합니다. 다음은 세종과학 펠로우십에 대해서 말씀드리겠습니다.", "source_blocks": [67, 68, 69, 70], "bullets": ["다음은 내년에 신규로 추진되는 신진 지역 장기 연구입니다. 기간은 10년 5+ 5이고 연구비는 1년 차는 3억 원 내외이고 2년 차부터는 연 1.5억 원 내외입니다.", "지원 대상은 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내 지역대학 이공분 20공분야 전임 교원입니다. 신진 지역 장기 연구는 지역 대학의 전임 교원을 대상으로 한다는 점에서 신진 연구 유형 A·B와 차이가 있습니다.", "신진 연구자 지원 사업도 마찬가지로 PBS 폐지된 출연연은 신청이 불가하고 뒷부분에서 자세히 말씀드리겠지만 신규 사업인 신진 지역 장기 연구 같은 경우는 반드시 장비 구축 계획이 있어야 신청이 가능합니다.", "다음은 세종과학 펠로우십에 대해서 말씀드리겠습니다."]}, {"id": "Z03-P07", "title": "세종과학 펠로우십과 개인 연구 지원 규모", "start": 1281, "end": 1461, "text": "내년부터는 국내 트랙 및 복귀 유치 트랙으로 운영될 예정이고 우선 연구 기간은 5년, 연구비는 연 1.4 1.3억 원 내외이고 선정 규모는 국내 트랙이 170과제 내외, 복귀 유치 트랙이 200개 내외가 입니다. 연구 개시는 국내 트랙은 3월 1일 개시, 그리고 복귀 유치 트랙은 9월 1일 개시 예정입니다. 지원 대상은 국내 트랙은 국내들 국내대학 박사학위를 취득한 자로서 박사학위 취득 후 7년 이내이거나 만 39세 이하인 연구자 중에서 국내대학 이공분야 전임 교원이 아닌 자 또는 국공립 민간 연구소 등에서 비정규직으로 근무하는 자가 입니다. 복귀 유치 트랙은 해외대학 박사학위를 취득한 자로서 박사학위 취득 후 7년 이내이거나 만39세 이하인 연구자 중에서 국내대학 이공분야 전임 교원이 아닌자 또는 국립 민간 연구소 등에서 비정규직으로 근무하는 연구자분이 입니다. 마찬가지로 두유형 모두 PBS 폐지된 출연연은 신청이 불가합니다. 세종은 아까 신진 연구 지원 사업하고는 다르게 모두 대상을 비전임 교원 그다음에 비정규직 연구자로 하고 있다는게 민간 연구소 등에서 비정규직 연구자로 하고 있다는게 다른 내용이 입니다. 다음 슬라이드는 올해 2026년에 개인 연구지원 사업 전체 지원 실적을 보여 드리는 표인데 참고로 보시면 될 것 같고 계속제 포함해서 한 15,700여 과제가 지원이 됐고 예산으로는 한 2.3조원 정도가 지원이 된 바 있습니다. 다음 슬라이드는 2027년도 내년 개인 연구 신규 선정 규모 아닙니다. 리더 연구는 13개 내외 후속 신기 포함해서 13개 내외 96억 원 정도 핵심 연구는 3,705과제 정도의 예산은 4,10억 원 내외 신진 연구는 1230개 내외에 1800억 원 내외 정도. 그다음 세종과학 펠로우십 같은 경우는 선정 과제 수는 370과제 내외에 455억 원 정도이고 전체적으로는 약 신규 기준으로는 5,300과제 내외가 될 것 같고 예산은 약 6,367억 원 정도가 될 것 같습니다. 물론 이제이 수치는 올해 정부한 규모이고 향후 국회 예산 심의 과정 등에서 변경될 수 있다는 점 참고해 주시면 될 것 같습니다.", "source_blocks": [71, 72, 73, 74], "bullets": ["내년부터는 국내 트랙 및 복귀 유치 트랙으로 운영될 예정이고 우선 연구 기간은 5년, 연구비는 연 1.4 1.3억 원 내외이고 선정 규모는 국내 트랙이 170과제 내외, 복귀 유치 트랙이 200개 내외가 입니다. 연구 개시는 국내 트랙은 3월 1일 개시, 그리고 복귀 유치 트랙은 9월 1일 개시 예정입니다.", "지원 대상은 국내 트랙은 국내들 국내대학 박사학위를 취득한 자로서 박사학위 취득 후 7년 이내이거나 만 39세 이하인 연구자 중에서 국내대학 이공분야 전임 교원이 아닌 자 또는 국공립 민간 연구소 등에서 비정규직으로 근무하는 자가 입니다.", "복귀 유치 트랙은 해외대학 박사학위를 취득한 자로서 박사학위 취득 후 7년 이내이거나 만39세 이하인 연구자 중에서 국내대학 이공분야 전임 교원이 아닌자 또는 국립 민간 연구소 등에서 비정규직으로 근무하는 연구자분이 입니다.", "마찬가지로 두유형 모두 PBS 폐지된 출연연은 신청이 불가합니다. 세종은 아까 신진 연구 지원 사업하고는 다르게 모두 대상을 비전임 교원 그다음에 비정규직 연구자로 하고 있다는게 민간 연구소 등에서 비정규직 연구자로 하고 있다는게 다른 내용이 입니다.", "다음 슬라이드는 올해 2026년에 개인 연구지원 사업 전체 지원 실적을 보여 드리는 표인데 참고로 보시면 될 것 같고 계속제 포함해서 한 15,700여 과제가 지원이 됐고 예산으로는 한 2.3조원 정도가 지원이 된 바 있습니다.", "다음 슬라이드는 2027년도 내년 개인 연구 신규 선정 규모 아닙니다. 리더 연구는 13개 내외 후속 신기 포함해서 13개 내외 96억 원 정도 핵심 연구는 3,705과제 정도의 예산은 4,10억 원 내외 신진 연구는 1230개 내외에 1800억 원 내외 정도. 그다음 세종과학 펠로우십 같은 경우는 선정 과제 수는 370과제 내외에 455억 원 정도이고 전체적으로는 약 신규 기준으로는 5,300과제 내외가 될 것 같고 예산은 약 6,367억 원 정도가 될 것 같습니다. 물론 이제이 수치는 올해 정부한 규모이고 향후 국회 예산 심의 과정 등에서 변경될 수 있다는 점 참고해 주시면 될 것 같습니다."]}, {"id": "Z03-P08", "title": "사업별 추진 일정", "start": 1461, "end": 1628, "text": "다음 슬라이드는 내년도 사업 대략적인 추진 일정이 입니다. 그래서 우선 리더 연구는 12월 초까지 접수를 받고 3, 4월 중에 선정 평가를 거쳐서 6월 개시 예정입니다. 다음 핵심 연구 중 3월 개시하는 유형씨, BA, 도약형 그리고 한물 한우물 파기의 경우 마찬가지로 12월 초까지 접수를 받고 1, 2월 중에 평가를 거쳐서 3월 개시 예정이고 글로벌 매칭형은 12월 내년 12월 연구 개수 예정입니다. 그래서 한 내년도 1월 정도의 공고가 나갈 것 같고 그리고 핵심 연구의 전략 및 기본 연구 B, 기본 연구 A의 경우 9월 개시로 올해 내년 3월에 별도로 신청 요강 등의 안내가 나갈 것 같고 4월에 접수를 받아서 8월까지 선정 절차를 거쳐서 9월에 개시할 예정입니다. 9월 개시 등 하반기 과제에 대한 안내는 저희가 내년 한 3월 정도에 별도로 재단 홈페이지를 통해서 안내해 드릴 예정입니다. 다음은 신진연구입니다. 신진 연구자 인프라지원 사업을 제외하고 유형 B, 유형 A 신규인 신진 지역 장기 연구 3월 개시로 12월 초까지 접수를 받고 1, 2월에 평가를 거쳐서 3월 연구 개시 예정이고 신진인 신진 연구 인프라 지원 사업의 경우 아까 말씀드렸듯이 내년부터는 9월 연구 개시 예정입니다. 그다음 세종과학 펠로우십 국내 트랙의 경우는 마찬가지로 12월 초까지 접수를 받고 1,월 평가를 거쳐서 3월 개시 예정이고 복귀 유치 트랙의 경우는 3월까지 선정 작업을 마치고 나서 복귀 준비 등을 위해서 9월 개시 예정입니다. 9월 개시이지만 복귀 준비를 위해서 이번 개인구 1차 공고에 같이 포함해서 공고가 나가고 있고 참고로 11월 16일 다음 주 월요일에 저희가 신청 요강하고 그다음에 서식 등을 연구재단 홈페이지를 통해서 안내 예정이니까 반드시 한번 참고해서 준비를 해 주시면 될 것 같습니다. 다음 슬라이드부터는 신규 과제 신청 유의 사항에 대해서 말씀드리겠습니다. 여기는 개인 기초 사업도 있고 집단 연구 사업도 일부 포함돼 있는데 같이 말씀을 드리도록 하겠습니다.", "source_blocks": [75, 76, 77, 78, 79, 80], "bullets": ["다음 슬라이드는 내년도 사업 대략적인 추진 일정이 입니다.", "그래서 우선 리더 연구는 12월 초까지 접수를 받고 3, 4월 중에 선정 평가를 거쳐서 6월 개시 예정입니다.", "다음 핵심 연구 중 3월 개시하는 유형씨, BA, 도약형 그리고 한물 한우물 파기의 경우 마찬가지로 12월 초까지 접수를 받고 1, 2월 중에 평가를 거쳐서 3월 개시 예정이고 글로벌 매칭형은 12월 내년 12월 연구 개수 예정입니다.", "그래서 한 내년도 1월 정도의 공고가 나갈 것 같고 그리고 핵심 연구의 전략 및 기본 연구 B, 기본 연구 A의 경우 9월 개시로 올해 내년 3월에 별도로 신청 요강 등의 안내가 나갈 것 같고 4월에 접수를 받아서 8월까지 선정 절차를 거쳐서 9월에 개시할 예정입니다.", "9월 개시 등 하반기 과제에 대한 안내는 저희가 내년 한 3월 정도에 별도로 재단 홈페이지를 통해서 안내해 드릴 예정입니다.", "다음은 신진연구입니다. 신진 연구자 인프라지원 사업을 제외하고 유형 B, 유형 A 신규인 신진 지역 장기 연구 3월 개시로 12월 초까지 접수를 받고 1, 2월에 평가를 거쳐서 3월 연구 개시 예정이고 신진인 신진 연구 인프라 지원 사업의 경우 아까 말씀드렸듯이 내년부터는 9월 연구 개시 예정입니다.", "그다음 세종과학 펠로우십 국내 트랙의 경우는 마찬가지로 12월 초까지 접수를 받고 1,월 평가를 거쳐서 3월 개시 예정이고 복귀 유치 트랙의 경우는 3월까지 선정 작업을 마치고 나서 복귀 준비 등을 위해서 9월 개시 예정입니다. 9월 개시이지만 복귀 준비를 위해서 이번 개인구 1차 공고에 같이 포함해서 공고가 나가고 있고 참고로 11월 16일 다음 주 월요일에 저희가 신청 요강하고 그다음에 서식 등을 연구재단 홈페이지를 통해서 안내 예정이니까 반드시 한번 참고해서 준비를 해 주시면 될 것 같습니다.", "다음 슬라이드부터는 신규 과제 신청 유의 사항에 대해서 말씀드리겠습니다. 여기는 개인 기초 사업도 있고 집단 연구 사업도 일부 포함돼 있는데 같이 말씀을 드리도록 하겠습니다."]}], "summary": ["리더 연구, 핵심 연구, 신진 연구, 세종과학 펠로우십의 지원 대상·기간·규모를 비교합니다.", "도약형·한우물 파기·글로벌 매칭형·전략형·기본 연구 등 세부 유형별 요건과 개시 시점이 다릅니다.", "신진 지역 장기 연구와 인프라 지원, 세종 국내·복귀 유치 트랙의 차이를 설명하며 세부 일정은 신청 요강 확인이 필요합니다."]}, {"id": "Z04", "title": "신청 자격·수행 제한·접수 절차", "start": 1630, "end": 2543, "paragraphs": [{"id": "Z04-P01", "title": "공고와 접수 일정", "start": 1630, "end": 1701, "text": "우선 공고 및 신청 시기를 보여주는 슬라이드가 입니다. 그래서 리더 연구, 핵심 연구, 신진 연구, 세종과학 펠로우십은 말씀드렸듯이 12월 초까지 신청하시면 되고 연구 개시는 리더 연구는 6월 개시, 세종 복귀 유치는 9월 개시이고 나머지는 3월 개시가 입니다. 정확한 접수 마감일은 11월 5일에 공지한 공고문을 확인해 주시기 바랍니다. 신청 요강과 연구계획서 서식은 다음 주 월요일인 11월 16일에 공지할 예정입니다. 9월 개시 과제에 해당하는 개인 연구 2차 공고는 내년 3월 중에 안내하겠습니다. 그리고 집단 연구 같은 경우는 다음 달 12월에 공고 예정에 있고 2월 중에 접수를 받고 7월 8월에 걸쳐서 연구 개시를 할 예정입니다. 그래서 집단 연고도 다음 달에 공지될 자세한 내용을 공고문 등에서 확인해 보시면 좋을 것 같습니다.", "source_blocks": [81, 82, 83, 84], "bullets": ["우선 공고 및 신청 시기를 보여주는 슬라이드가 입니다. 그래서 리더 연구, 핵심 연구, 신진 연구, 세종과학 펠로우십은 말씀드렸듯이 12월 초까지 신청하시면 되고 연구 개시는 리더 연구는 6월 개시, 세종 복귀 유치는 9월 개시이고 나머지는 3월 개시가 입니다.", "정확한 접수 마감일은 11월 5일에 공지한 공고문을 확인해 주시기 바랍니다. 신청 요강과 연구계획서 서식은 다음 주 월요일인 11월 16일에 공지할 예정입니다. 9월 개시 과제에 해당하는 개인 연구 2차 공고는 내년 3월 중에 안내하겠습니다.", "그리고 집단 연구 같은 경우는 다음 달 12월에 공고 예정에 있고 2월 중에 접수를 받고 7월 8월에 걸쳐서 연구 개시를 할 예정입니다. 그래서 집단 연고도 다음 달에 공지될 자세한 내용을 공고문 등에서 확인해 보시면 좋을 것 같습니다."]}, {"id": "Z04-P02", "title": "1인 1과제 원칙과 예외 사업", "start": 1705, "end": 1772, "text": "다음 슬라이드는 개인 기초 사업 중에서 1인일과제 예외 사업들을 지금 보여 주는 장표가 이며 간단히 설명을 드리면 첫 번째로 글로벌 매칭형 같은 경우는 저희 연구재단 국제 협력 본부에서 수행을 하고 있는데 내년 1월 공고에서 계속 평가를 거쳐서 12월에 연구 개시는 12월에 할 예정이고 엠팩에서 수행 하는 신진 연구자 인프라 사업 같은 경우는 내년 3월에 별도로 공고를 해서 9월 연구 개시 예정입니다. 이 두 개 사업은 신 요강 등 별도로 공고 예정이니까 자세한 내용은 해당 각 사업에 신 요강해서 확인해 주시면 좋을 것 같습니다. 다음은 신청 및 수행 제한에 대한 내용이 입니다. 그래서 여기서부터는 요건 탈락에 해당되는 내용일 수 있어서 자세히 한번 보시고 준비를 해 주시면 좋을 것 같습니다.", "source_blocks": [85, 86], "bullets": ["다음 슬라이드는 개인 기초 사업 중에서 1인일과제 예외 사업들을 지금 보여 주는 장표가 이며 간단히 설명을 드리면 첫 번째로 글로벌 매칭형 같은 경우는 저희 연구재단 국제 협력 본부에서 수행을 하고 있는데 내년 1월 공고에서 계속 평가를 거쳐서 12월에 연구 개시는 12월에 할 예정이고 엠팩에서 수행 하는 신진 연구자 인프라 사업 같은 경우는 내년 3월에 별도로 공고를 해서 9월 연구 개시 예정입니다.", "이 두 개 사업은 신 요강 등 별도로 공고 예정이니까 자세한 내용은 해당 각 사업에 신 요강해서 확인해 주시면 좋을 것 같습니다.", "다음은 신청 및 수행 제한에 대한 내용이 입니다. 그래서 여기서부터는 요건 탈락에 해당되는 내용일 수 있어서 자세히 한번 보시고 준비를 해 주시면 좋을 것 같습니다."]}, {"id": "Z04-P03", "title": "기존 과제 수행자의 신청 제한과 예외", "start": 1773, "end": 1931, "text": "먼저 기존 수행 연구자 신청 및 수행 제한과 관련된 내용입니다. 기본적으로 개인 연구 사업은 연구 책임자로 1인일과제 수행 가능으로 개인 연구를 기존에 수행 중인 연구 책임제는 신규 신청이 불가능합니다. 그리고 집단 연구 사업은 연구 책임자 또는 참여 공동 연구원으로 1인일과제 수행이 가능해서 마찬가지로 집단 연구를 연구 책임자든 참여 연구 참여 공동 연구원이든 어떤 역할로 수행 중이라면 신규 신청은 불가합니다. 단 신진 연구자 인프라 지원 사업하고 내년에 신규는 없지만 핵심 연구 도전형의이 기수행하시는 분들 그리고 글로벌 매칭형 같은 경우는 예외로 중복 수행이 가능합니다. 그다음 다음은 기존 연구 수행자 신청 및 수행 제한 예외 사항에 대해서 말씀드리겠습니다. 앞서 설명한 신청 및 수행 제한의 예외 사항을 안내하겠습니다. 신진 연구자 인프라 지원 사업은 개인·집단 연구 모두에서 1인 1과제 수행 제한의 예외에 해당합니다. 그래서 기존에 개인 연구나 집단 연구는 한 가지를 하고 계셔도 신진 연구자 인프라지원 사업은 추가적으로 하나 더 수행할 수 있다는 그런 얘기가 이며 그다음 개인 기초에서는 수행 중의 과제가 내년도 그러니까 2027년도 12월 말일까지 최종 종료되는 경우에 신규 신청이 가능합니다. 그리고 또 리더 연구 같은 경우는 조금 다르게 리더 연구 개시가 내년도 6월 1일인데 6월 1일 연구 개시 기준으로 10개월 이내에 최종 종료되는 경우에는 리더 연구의 신규 신청이 가능합니다. 그리고 한우물 파기 같은 경우에는 수행 중인 과제 최종 종료 시기에 관계 없이 신청이 가능하고 선정이 되면 한우물 파기 기초연구로 전환할 수 있습니다. 다음은 집단 연구는 연구 개시 이후 10개월 이내 최종 종료되는 경우 신규 신청이 가능한 것으로 돼 있고 그래서 자세한 내용은 NRL 2.0도 별도 추진 계획이 공고가 될 텐데 12월에 공고가 되면 관련 내용을 참고해 주시면 좋을 것 같습니다.", "source_blocks": [87, 88, 89, 90, 91, 92, 93], "bullets": ["먼저 기존 수행 연구자 신청 및 수행 제한과 관련된 내용입니다. 기본적으로 개인 연구 사업은 연구 책임자로 1인일과제 수행 가능으로 개인 연구를 기존에 수행 중인 연구 책임제는 신규 신청이 불가능합니다.", "그리고 집단 연구 사업은 연구 책임자 또는 참여 공동 연구원으로 1인일과제 수행이 가능해서 마찬가지로 집단 연구를 연구 책임자든 참여 연구 참여 공동 연구원이든 어떤 역할로 수행 중이라면 신규 신청은 불가합니다.", "단 신진 연구자 인프라 지원 사업하고 내년에 신규는 없지만 핵심 연구 도전형의이 기수행하시는 분들 그리고 글로벌 매칭형 같은 경우는 예외로 중복 수행이 가능합니다.", "그다음 다음은 기존 연구 수행자 신청 및 수행 제한 예외 사항에 대해서 말씀드리겠습니다.", "앞서 설명한 신청 및 수행 제한의 예외 사항을 안내하겠습니다. 신진 연구자 인프라 지원 사업은 개인·집단 연구 모두에서 1인 1과제 수행 제한의 예외에 해당합니다.", "그래서 기존에 개인 연구나 집단 연구는 한 가지를 하고 계셔도 신진 연구자 인프라지원 사업은 추가적으로 하나 더 수행할 수 있다는 그런 얘기가 이며 그다음 개인 기초에서는 수행 중의 과제가 내년도 그러니까 2027년도 12월 말일까지 최종 종료되는 경우에 신규 신청이 가능합니다.", "그리고 또 리더 연구 같은 경우는 조금 다르게 리더 연구 개시가 내년도 6월 1일인데 6월 1일 연구 개시 기준으로 10개월 이내에 최종 종료되는 경우에는 리더 연구의 신규 신청이 가능합니다.", "그리고 한우물 파기 같은 경우에는 수행 중인 과제 최종 종료 시기에 관계 없이 신청이 가능하고 선정이 되면 한우물 파기 기초연구로 전환할 수 있습니다.", "다음은 집단 연구는 연구 개시 이후 10개월 이내 최종 종료되는 경우 신규 신청이 가능한 것으로 돼 있고 그래서 자세한 내용은 NRL 2.0도 별도 추진 계획이 공고가 될 텐데 12월에 공고가 되면 관련 내용을 참고해 주시면 좋을 것 같습니다."]}, {"id": "Z04-P04", "title": "리더 연구·세종과학 펠로우십의 별도 조건", "start": 1931, "end": 2053, "text": "다음 슬라이드는 세부 사업별로 제한 사항이 있는 것들을 정리한 거고 그거에 대해서 말씀을 드리도록 하겠습니다. 우선 리더 연구 책임자는 과기부 사업뿐만 아니고 타 국가 연구 개발 사업을 포함하여 연구 책임자로 한 개 과제만 추가 수행이 가능합니다. 그래서 그런 이유로 집단 연구 사업도 포함해서 집단 연구 사업 연구 책임자로도 그래 신청이 불가능하다는 거 알고 계시면 좋을 것 같고 그다음 세종 국내 트랙은 3월 1일 그러니까 세종 국내 트랙은 3월 1일 과제 개시를 하는데 과제가 개시되고 6개월 이내 즉 8월 30일까지 반드시 주관 연구기관을 확정해서 연구재단의 심의를 받아야 합니다. 그리고 세종 복귀 유치 트랙은 연구시가 9월 1일인데 9월 1일 전까지 주관기관을 확정해야 되고 복귀 유치 트랙에만 있는 내용이긴 한데 이직으로 인한 과제 중단은 과제 개시 이후 6개월이 경과한 시점에 국내 기간으로 이직시에만 정당한 사유로 인정되니 참고하시기 바랍니다. 그래서 세종 같은 경우 국내는 개시 후 6개월 이내 국는 연구 개시전에 이렇게 주관기관을 확정해야 된다고 하는 사항들이 이게 이루어지지 않으면 주관기관을 확정하지 못하면 선정 취소까지 가는 거기 때문에 반드시 기한 내에 주관기관을 확정하셔야 되는 내용이 입니다. 그다음 국가 연구소의 선도 연구 센터하고 기초연구실 같은 집단 사업은 아까 말씀처럼 12월 경에 내용이 다듬어지고 확정이 되면 추후 공지될 예정이라서 내용을 참고하시면 좋을 것 같습니다.", "source_blocks": [94, 95], "bullets": ["다음 슬라이드는 세부 사업별로 제한 사항이 있는 것들을 정리한 거고 그거에 대해서 말씀을 드리도록 하겠습니다.", "우선 리더 연구 책임자는 과기부 사업뿐만 아니고 타 국가 연구 개발 사업을 포함하여 연구 책임자로 한 개 과제만 추가 수행이 가능합니다. 그래서 그런 이유로 집단 연구 사업도 포함해서 집단 연구 사업 연구 책임자로도 그래 신청이 불가능하다는 거 알고 계시면 좋을 것 같고 그다음 세종 국내 트랙은 3월 1일 그러니까 세종 국내 트랙은 3월 1일 과제 개시를 하는데 과제가 개시되고 6개월 이내 즉 8월 30일까지 반드시 주관 연구기관을 확정해서 연구재단의 심의를 받아야 합니다.", "그리고 세종 복귀 유치 트랙은 연구시가 9월 1일인데 9월 1일 전까지 주관기관을 확정해야 되고 복귀 유치 트랙에만 있는 내용이긴 한데 이직으로 인한 과제 중단은 과제 개시 이후 6개월이 경과한 시점에 국내 기간으로 이직시에만 정당한 사유로 인정되니 참고하시기 바랍니다.", "그래서 세종 같은 경우 국내는 개시 후 6개월 이내 국는 연구 개시전에 이렇게 주관기관을 확정해야 된다고 하는 사항들이 이게 이루어지지 않으면 주관기관을 확정하지 못하면 선정 취소까지 가는 거기 때문에 반드시 기한 내에 주관기관을 확정하셔야 되는 내용이 입니다.", "그다음 국가 연구소의 선도 연구 센터하고 기초연구실 같은 집단 사업은 아까 말씀처럼 12월 경에 내용이 다듬어지고 확정이 되면 추후 공지될 예정이라서 내용을 참고하시면 좋을 것 같습니다."]}, {"id": "Z04-P05", "title": "정부 R&D 공통 제한", "start": 2053, "end": 2087, "text": "다음 슬라이드는 정부 R&D 공통 사항에 대해서 말씀드리겠습니다. 우선 당연히 제재 처분을 받은 연구자는 접수 마감일 전일까지 즉 접수 마감일이 아니고 접수 마감일 전일까지 처분이 종료되는 경우에 한해서 신규 신청이 가능합니다. 그리고 다들 잘 아시겠지만 연구 개발 과제는 최대 다섯 개까지 동시 수행이 가능하고 그중에서 연구 책임자로는 세 개까지 수행이 가능합니다.", "source_blocks": [96, 97, 98], "bullets": ["다음 슬라이드는 정부 R&D 공통 사항에 대해서 말씀드리겠습니다. 우선 당연히 제재 처분을 받은 연구자는 접수 마감일 전일까지 즉 접수 마감일이 아니고 접수 마감일 전일까지 처분이 종료되는 경우에 한해서 신규 신청이 가능합니다.", "그리고 다들 잘 아시겠지만 연구 개발 과제는 최대 다섯 개까지 동시 수행이 가능하고 그중에서 연구 책임자로는 세 개까지 수행이 가능합니다."]}, {"id": "Z04-P06", "title": "우대와 감점 기준", "start": 2091, "end": 2238, "text": "다음은 우대 및 감점 사항에 대해서 말씀드리겠습니다. 주로 개인 기초 사업에 해당은 되는 내용이기는 한데 일단 말씀을 드리도록 하겠습니다. 우선 여성 연구자를 대상으로 개인 기초연구 핵심 유형 B에서 20% 선정 목표제를 적용할 예정이고 그다음 지역 연구자 우대 관련해서는 핵심 기본 연구 A하고 기본 연구 B에서 연구비 비율로 한 40% 이상을 선정 예정에 있습니다. 그리고 지역 같은 경우는 집단 사업 중에 기초연구실 심화형에서 30% 수준을 지역 대학에 할당할 예정에 있습니다. 그다음 성과 우수자에 대한 우대 사항인데 성과 우수자가 핵심 연구 유형 AP에서 추가 선정 예정에 있고 신진 연구자 우대 관련해서는 세종 국내 트랙을 수행 중인 연구 책임자가 전임 교원으로 신분이 변동되고 그리고 5년 신 세종 밸로스 같은 경우 연구 기간이 5년인데 5년을 정상 종료대 되는 해 5년을 다 연구 수행을 하시고 정상 종료되는 해 신진 연구 유형 B에 신청하시면 저희가 우대에서 선정할 예정입니다. 그다음은 생애 첫 연구 및 경력단절 연구자에 대한 우대 사항인데 핵심 연구 A에서 가점을 부여해서 선정할 예정에 있습니다. 신진 연구자 인프라 지원 사업에서는 연구시설·장비 통합관리 지정 기관에 가점을 부여할 예정입니다. 다음은 밑에 감점 사항인데 접수 마감일 기준으로 최근 3년 이내 제재 처분을 받았거나 그리고 정당한 사유 없이 과제 수행을 포기한 사례가 있는 연구자는 감점 예정이니 참고하시기 바랍니다. 다음은 아이리스 상에서 신청 방법인데 간단히 말씀드리면 접수전 필수 사항으로 연구자는 NR, NRI 가입 및 연구자 전환 동의, 정보 등록 갱신 등을 기본적으로 마치셔야 합니다.", "source_blocks": [99, 100, 101, 102, 103, 104, 105], "bullets": ["다음은 우대 및 감점 사항에 대해서 말씀드리겠습니다. 주로 개인 기초 사업에 해당은 되는 내용이기는 한데 일단 말씀을 드리도록 하겠습니다. 우선 여성 연구자를 대상으로 개인 기초연구 핵심 유형 B에서 20% 선정 목표제를 적용할 예정이고 그다음 지역 연구자 우대 관련해서는 핵심 기본 연구 A하고 기본 연구 B에서 연구비 비율로 한 40% 이상을 선정 예정에 있습니다.", "그리고 지역 같은 경우는 집단 사업 중에 기초연구실 심화형에서 30% 수준을 지역 대학에 할당할 예정에 있습니다.", "그다음 성과 우수자에 대한 우대 사항인데 성과 우수자가 핵심 연구 유형 AP에서 추가 선정 예정에 있고 신진 연구자 우대 관련해서는 세종 국내 트랙을 수행 중인 연구 책임자가 전임 교원으로 신분이 변동되고 그리고 5년 신 세종 밸로스 같은 경우 연구 기간이 5년인데 5년을 정상 종료대 되는 해 5년을 다 연구 수행을 하시고 정상 종료되는 해 신진 연구 유형 B에 신청하시면 저희가 우대에서 선정할 예정입니다.", "그다음은 생애 첫 연구 및 경력단절 연구자에 대한 우대 사항인데 핵심 연구 A에서 가점을 부여해서 선정할 예정에 있습니다.", "신진 연구자 인프라 지원 사업에서는 연구시설·장비 통합관리 지정 기관에 가점을 부여할 예정입니다.", "다음은 밑에 감점 사항인데 접수 마감일 기준으로 최근 3년 이내 제재 처분을 받았거나 그리고 정당한 사유 없이 과제 수행을 포기한 사례가 있는 연구자는 감점 예정이니 참고하시기 바랍니다.", "다음은 아이리스 상에서 신청 방법인데 간단히 말씀드리면 접수전 필수 사항으로 연구자는 NR, NRI 가입 및 연구자 전환 동의, 정보 등록 갱신 등을 기본적으로 마치셔야 합니다."]}, {"id": "Z04-P07", "title": "IRIS 등록과 기관 승인", "start": 2238, "end": 2278, "text": "주관 연구기관은 접수 전에 IRIS 기관 등록과 기관 담당자 권한 부여를 완료해야 합니다. 필수 사전 절차를 마친 후 연구책임자는 온라인 정보를 입력하고 연구계획서를 업로드합니다. 주관 연구기관이 입력 정보와 제출 자료를 검토하여 승인하면 최종 접수가 완료됩니다.", "source_blocks": [106], "bullets": ["주관 연구기관은 접수 전에 IRIS 기관 등록과 기관 담당자 권한 부여를 완료해야 합니다.", "필수 사전 절차를 마친 후 연구책임자는 온라인 정보를 입력하고 연구계획서를 업로드합니다.", "주관 연구기관이 입력 정보와 제출 자료를 검토하여 승인하면 최종 접수가 완료됩니다."]}, {"id": "Z04-P08", "title": "사업별 접수 마감일", "start": 2278, "end": 2359, "text": "다음 슬라이드는 과제 신청 및 접수 일정이 입니다. 접수 마감일에 신청이 몰려 시스템에 부담이 발생하는 것을 방지하기 위해 사업별 마감일을 구분했습니다. 핵심 연구 유형 C·B·A와 도약형은 연구자 접수를 12월 7일에 마감하며, 주관기관 승인 마감일은 12월 9일입니다. 그 밖의 1차 공고 사업은 연구자 접수를 12월 8일에 마감하며, 주관기관 승인 마감일은 12월 10일입니다. 아마 많이들 해보셔서 알겠지만 마감일에는 접속자가 몰려서 시스템이 느려질 수도 있으니까 반드시 한 2, 3일 전에는 충분히 여유를 갖고 작업을 완료하시는게 좋을 것 같습니다. 읽고 신진 연구자 인프라 사업 등 나머지 여기 표기된 사업들은 추후 공고될 내용이니까 그때 내용을 한 번 더 참고하시면 좋을 것 같습니다.", "source_blocks": [107, 108, 109], "bullets": ["다음 슬라이드는 과제 신청 및 접수 일정이 입니다. 접수 마감일에 신청이 몰려 시스템에 부담이 발생하는 것을 방지하기 위해 사업별 마감일을 구분했습니다. 핵심 연구 유형 C·B·A와 도약형은 연구자 접수를 12월 7일에 마감하며, 주관기관 승인 마감일은 12월 9일입니다.", "그 밖의 1차 공고 사업은 연구자 접수를 12월 8일에 마감하며, 주관기관 승인 마감일은 12월 10일입니다.", "아마 많이들 해보셔서 알겠지만 마감일에는 접속자가 몰려서 시스템이 느려질 수도 있으니까 반드시 한 2, 3일 전에는 충분히 여유를 갖고 작업을 완료하시는게 좋을 것 같습니다. 읽고 신진 연구자 인프라 사업 등 나머지 여기 표기된 사업들은 추후 공고될 내용이니까 그때 내용을 한 번 더 참고하시면 좋을 것 같습니다."]}, {"id": "Z04-P09", "title": "신청 전·중·후 체크리스트", "start": 2359, "end": 2419, "text": "과제 신청 전 점검할 체크리스트는 11월 16일에 공지하는 신청 요강에 포함될 예정입니다. 해당 항목을 읽고 스스로 점검해 주시기 바랍니다. 이어지는 슬라이드에는 신청 중과 신청 후에 확인할 체크리스트를 제시했습니다. 대표 항목 외에도 각자 확인해야 할 사항을 충분히 점검하시기 바랍니다. 체크리스트는 신청 전에 최소한의 필수 사항을 확인하여 요건 탈락 등의 불이익을 예방할 수 있도록 제공하는 자료입니다.", "source_blocks": [110, 111], "bullets": ["과제 신청 전 점검할 체크리스트는 11월 16일에 공지하는 신청 요강에 포함될 예정입니다. 해당 항목을 읽고 스스로 점검해 주시기 바랍니다.", "이어지는 슬라이드에는 신청 중과 신청 후에 확인할 체크리스트를 제시했습니다. 대표 항목 외에도 각자 확인해야 할 사항을 충분히 점검하시기 바랍니다.", "체크리스트는 신청 전에 최소한의 필수 사항을 확인하여 요건 탈락 등의 불이익을 예방할 수 있도록 제공하는 자료입니다."]}, {"id": "Z04-P10", "title": "직접비·간접비와 수행 포기 유의 사항", "start": 2419, "end": 2543, "text": "직접비와 간접비의 분리 공고에 대해 안내하겠습니다. 연구자는 공고문과 신청 요강에 제시된 연간 총 연구비의 80% 수준을 직접비로 신청하면 됩니다. 선정 후에는 담당 팀에서 간접비를 별도로 산정하여 협약 시 총 연구비와 함께 안내합니다. 간접비 계상 예시는 표를 참고해 주시기 바랍니다. 과제 선정 후 수행 포기와 관련된 사항도 안내하겠습니다. 표에 제시된 정당한 사유 이외의 이유로 과제 수행을 포기하면 참여 제한 등의 제재 처분이 따를 수 있습니다. 특히 신진 지역 장기 연구는 수행 기간 중 지역 외 기관으로 이직할 경우 제재 대상이 될 수 있으므로, 신청 전에 이 점까지 고려해 신중하게 판단하시기 바랍니다. 이상으로 2027년 개인 기초연구 안내하고 과제 신청 유의 사항에 대한 설명을 마치겠습니다. 감사합니다.", "source_blocks": [112, 113, 114], "bullets": ["직접비와 간접비의 분리 공고에 대해 안내하겠습니다. 연구자는 공고문과 신청 요강에 제시된 연간 총 연구비의 80% 수준을 직접비로 신청하면 됩니다.", "선정 후에는 담당 팀에서 간접비를 별도로 산정하여 협약 시 총 연구비와 함께 안내합니다. 간접비 계상 예시는 표를 참고해 주시기 바랍니다.", "과제 선정 후 수행 포기와 관련된 사항도 안내하겠습니다. 표에 제시된 정당한 사유 이외의 이유로 과제 수행을 포기하면 참여 제한 등의 제재 처분이 따를 수 있습니다.", "특히 신진 지역 장기 연구는 수행 기간 중 지역 외 기관으로 이직할 경우 제재 대상이 될 수 있으므로, 신청 전에 이 점까지 고려해 신중하게 판단하시기 바랍니다. 이상으로 2027년 개인 기초연구 안내하고 과제 신청 유의 사항에 대한 설명을 마치겠습니다. 감사합니다."]}], "summary": ["기존 과제 수행 여부에 따른 신규 신청 제한, 1인 1과제 원칙과 예외, 사업별 별도 조건을 설명합니다.", "우대·감점 항목을 확인하고, IRIS 사전 등록부터 연구자 제출과 주관기관 승인까지 완료해야 합니다.", "사업별 마감일이 다르므로 여유 있게 접수하고, 직접비·간접비 신청 방식과 수행 포기·이직에 따른 제재 가능성도 확인해야 합니다."]}, {"id": "Z05", "title": "집단 연구 지원 사업", "start": 2543, "end": 3096, "paragraphs": [{"id": "Z05-P01", "title": "공고 일정과 국가연구소", "start": 2543, "end": 2702, "text": "다음은 과학기술정보통신부 기초연구 사업 집단 연구 사업 안내를 한국연구재단 집단 연구 지원이다 팀장이 발표하겠습니다. 안녕하십니까. 집단연구 지원 팀장 이다은입니다. 지금부터 과학기술정보통신부 집단 연구지원 사업 안내드리겠습니다. 사업 설명에 앞서 집단 연구 지원 사업 공고 일정에 대해서 먼저 안내드리겠습니다. 현재 집단 연구 지원 사업은 공고 전입니다. 2027년도에는 집단 연구 지원 사업의 개편에 따라 별도의 공고를 준비하고 있으며 12월 14일이 포함된 주간을 전후하여 공고할 예정입니다. 따라서 사업 신청을 준비하시는 연구자분들께서는 해당 일정을 참고하여 주시기 바랍니다. 첫 번째로 국가 연구소입니다. 대학 강점 분야의 우수 연구 인력과 인프라를 활용해서 세계 최초 최고 수준의 혁신적 연구를 선도하는 연구소를 육성하고자 추진하고 있습니다. 2027년 신규 과제는 총 세 가지입니다. 작년과 동일하게 대학별 최대 두 개까지 신청 가능하고 선정은 한 개로 제한될 예정입니다. 신규 대학의 진입 기회를 확대하기 위해서 2025년 2026년에 선정된 여덟 개 대학은 신청이 불가합니다. 대학의 목록은 신청 요강을 참고해 주시기 바랍니다. 2027년도에도 2026년과 마찬가지로 직역 균형 지원을 지속적으로 강화해 나갈 계획입니다. 우수 연구자들이 지역 대학에서 안정적으로 연구 활동을 지속하고 산학연 협력 등 지역 혁신의 핵심 주체로 성장할 수 있도록 지원함으로써 지역 균형 발전과 자생적 성장 기반을 강화하고자 합니다. 올해 전국 지역 대학 유형을 구분하여 지원하였으나 2027년도에는 국회 예산 심의 확정 결과에 따라서 지원 규모와 방법이 조정될 수 있습니다. 지원 기간은 총 10년으로 3단계에 걸쳐 지원할 예정입니다. 지원 규모는 연간 100억 원이며 2027년도에는 사업 추진 일정을 고려하여 7월 1일부터 12월 31일까지 6개월간 50억 원을 지원할 예정입니다. 지원 대상은 고등교육법 제2조의 대학 소속의 KCI 등록분야 대학 부설 연구소입니다. 사업에 관한 자세한 내용은 별도로 개최되는 설명회를 통해서 안내드릴 예정입니다. 신청 자격과 세부 요건과 같이 자세한 사항은 추후 공고되는 신청 요강을 참고해 주시기 바랍니다.", "source_blocks": [115, 116, 117, 118, 119, 120, 121, 122, 123, 124], "bullets": ["다음은 과학기술정보통신부 기초연구 사업 집단 연구 사업 안내를 한국연구재단 집단 연구 지원이다 팀장이 발표하겠습니다. 안녕하십니까. 집단연구 지원 팀장 이다은입니다. 지금부터 과학기술정보통신부 집단 연구지원 사업 안내드리겠습니다.", "사업 설명에 앞서 집단 연구 지원 사업 공고 일정에 대해서 먼저 안내드리겠습니다. 현재 집단 연구 지원 사업은 공고 전입니다.", "2027년도에는 집단 연구 지원 사업의 개편에 따라 별도의 공고를 준비하고 있으며 12월 14일이 포함된 주간을 전후하여 공고할 예정입니다. 따라서 사업 신청을 준비하시는 연구자분들께서는 해당 일정을 참고하여 주시기 바랍니다.", "첫 번째로 국가 연구소입니다. 대학 강점 분야의 우수 연구 인력과 인프라를 활용해서 세계 최초 최고 수준의 혁신적 연구를 선도하는 연구소를 육성하고자 추진하고 있습니다.", "2027년 신규 과제는 총 세 가지입니다. 작년과 동일하게 대학별 최대 두 개까지 신청 가능하고 선정은 한 개로 제한될 예정입니다.", "신규 대학의 진입 기회를 확대하기 위해서 2025년 2026년에 선정된 여덟 개 대학은 신청이 불가합니다. 대학의 목록은 신청 요강을 참고해 주시기 바랍니다.", "2027년도에도 2026년과 마찬가지로 직역 균형 지원을 지속적으로 강화해 나갈 계획입니다.", "우수 연구자들이 지역 대학에서 안정적으로 연구 활동을 지속하고 산학연 협력 등 지역 혁신의 핵심 주체로 성장할 수 있도록 지원함으로써 지역 균형 발전과 자생적 성장 기반을 강화하고자 합니다. 올해 전국 지역 대학 유형을 구분하여 지원하였으나 2027년도에는 국회 예산 심의 확정 결과에 따라서 지원 규모와 방법이 조정될 수 있습니다.", "지원 기간은 총 10년으로 3단계에 걸쳐 지원할 예정입니다. 지원 규모는 연간 100억 원이며 2027년도에는 사업 추진 일정을 고려하여 7월 1일부터 12월 31일까지 6개월간 50억 원을 지원할 예정입니다.", "지원 대상은 고등교육법 제2조의 대학 소속의 KCI 등록분야 대학 부설 연구소입니다.", "사업에 관한 자세한 내용은 별도로 개최되는 설명회를 통해서 안내드릴 예정입니다. 신청 자격과 세부 요건과 같이 자세한 사항은 추후 공고되는 신청 요강을 참고해 주시기 바랍니다."]}, {"id": "Z05-P02", "title": "미래연구센터 개편·유형·지원 요건", "start": 2702, "end": 2894, "text": "두 번째로 미래 연구 센터입니다. 집단 연구의 혁신성을 강화하고 미래 지향적 연구를 촉진하기 위해 연구 분야의 다양성을 확대하는 방향으로 집단 연구 지원 체계를 개편하였습니다. 이에 따라 2027년부터 기존 선도 연구 센터를 미래 연구 센터 체계로 전환하여 운영할 예정입니다. 미래 연구 센터는 대학의 우수 연구 그룹이 국가 사회적 수요에 대응하는 혁신적인 연구를 수행하고 지속 가능한 연구 역량을 확보할 수 있도록 지원하는 것을 목적으로 합니다. 표를 보시면 미래 연구 센터는 세계 트랙 다섯 가지 유형으로 구분되어 있습니다. 미래 연구 트랙, 기초 의학 트랙, 지역 혁신 트랙입니다. 미래 연구 트랙의 경우에는 목표 지향 FRCX, 탐구형 FRCS, 혁신형 FRCE가 있습니다. 연구 기관은 모든 트랙과 유형이 5+ 2 총 7년 지원으로 동일하게 변경된 바 있습니다. 연구비 규모는 사업의 특성에 따라 미래 지향형 15억 이내 탐구형과 혁신형은 각각 18억 원 22억 이내로 기존 SRC와 erc와 동일합니다. 기초 의과학 트랙은 지역 혁신 트랙과 함께 기존 동일하게 각각 15억 이내로 지원할 예정입니다. 지원 대상입니다. 비공개 분야 대학원이 설치되어 있는 대학의 연구 그로 전체가 모두 동일합니다. 지역 의과학 트랙의 경우에는 기초 의과학 분야 대학원이 설치되어 있는 대학 지역 혁신 트랙의 경우에는 이공개 대학원이 설치되어 있는 지역 대학입니다. 연구진 구성은 목표 지약은 참여 연구자 구성 인원의 수가 제한이 되어 있지 않습니다. 그래서 자유롭게 구성이 가능합니다. 그외 유형의 경우에는 기존과 동일하게 여덟 명 이상으로 그리고 지역 혁신 트랙의 경우에만 여덟 명 이내로 구성하여야 합니다. 미래 연구 센터의 신규 과제 선정 규모는 총 17개 과제 내외입니다. 미래연구 트랙은 목표 지향네 개, 탐구형과 혁신형은 각각 두 개 내외를 선정할 예정입니다. 현재 슬라이드에는 후속지형 과제가 포함되어 있지 않은데요. 탐구형과 혁신형은 기존 SRC, C 종료 센터를 대성으로 별도의 후속 연구를 지원할 계획입니다. 따라서 해당되는 센터에서는 후속 지원 3월를 개시를 위한 일정을 확인해 주시기 바랍니다. 기초 의과학 트랙은네 개 내외를 선정할 예정이며 지역 혁신 트랙은 2026년에는 지원이 없었으나 2027년에는 다섯 개 내외가 신규 과제로 확보되었습니다. 새롭게 신설되는 미래 연구 트랙 FRC X 유형에 대해 궁금한 점이 많으실 것으로 생각됩니다. 현재 지원 분야와 지원 방향과 같이 세부 사항을 논의 중에 있고요. 구체적인 내용이 확정되면 신청 요강 등을 통해서 안내드리도록 하겠습니다.", "source_blocks": [125, 126, 127, 128, 129, 130, 131, 132, 133], "bullets": ["두 번째로 미래 연구 센터입니다.", "집단 연구의 혁신성을 강화하고 미래 지향적 연구를 촉진하기 위해 연구 분야의 다양성을 확대하는 방향으로 집단 연구 지원 체계를 개편하였습니다. 이에 따라 2027년부터 기존 선도 연구 센터를 미래 연구 센터 체계로 전환하여 운영할 예정입니다.", "미래 연구 센터는 대학의 우수 연구 그룹이 국가 사회적 수요에 대응하는 혁신적인 연구를 수행하고 지속 가능한 연구 역량을 확보할 수 있도록 지원하는 것을 목적으로 합니다.", "표를 보시면 미래 연구 센터는 세계 트랙 다섯 가지 유형으로 구분되어 있습니다. 미래 연구 트랙, 기초 의학 트랙, 지역 혁신 트랙입니다.", "미래 연구 트랙의 경우에는 목표 지향 FRCX, 탐구형 FRCS, 혁신형 FRCE가 있습니다.", "연구 기관은 모든 트랙과 유형이 5+ 2 총 7년 지원으로 동일하게 변경된 바 있습니다.", "연구비 규모는 사업의 특성에 따라 미래 지향형 15억 이내 탐구형과 혁신형은 각각 18억 원 22억 이내로 기존 SRC와 erc와 동일합니다.", "기초 의과학 트랙은 지역 혁신 트랙과 함께 기존 동일하게 각각 15억 이내로 지원할 예정입니다.", "지원 대상입니다. 비공개 분야 대학원이 설치되어 있는 대학의 연구 그로 전체가 모두 동일합니다. 지역 의과학 트랙의 경우에는 기초 의과학 분야 대학원이 설치되어 있는 대학 지역 혁신 트랙의 경우에는 이공개 대학원이 설치되어 있는 지역 대학입니다.", "연구진 구성은 목표 지약은 참여 연구자 구성 인원의 수가 제한이 되어 있지 않습니다. 그래서 자유롭게 구성이 가능합니다. 그외 유형의 경우에는 기존과 동일하게 여덟 명 이상으로 그리고 지역 혁신 트랙의 경우에만 여덟 명 이내로 구성하여야 합니다.", "미래 연구 센터의 신규 과제 선정 규모는 총 17개 과제 내외입니다. 미래연구 트랙은 목표 지향네 개, 탐구형과 혁신형은 각각 두 개 내외를 선정할 예정입니다.", "현재 슬라이드에는 후속지형 과제가 포함되어 있지 않은데요. 탐구형과 혁신형은 기존 SRC, C 종료 센터를 대성으로 별도의 후속 연구를 지원할 계획입니다. 따라서 해당되는 센터에서는 후속 지원 3월를 개시를 위한 일정을 확인해 주시기 바랍니다.", "기초 의과학 트랙은네 개 내외를 선정할 예정이며 지역 혁신 트랙은 2026년에는 지원이 없었으나 2027년에는 다섯 개 내외가 신규 과제로 확보되었습니다.", "새롭게 신설되는 미래 연구 트랙 FRC X 유형에 대해 궁금한 점이 많으실 것으로 생각됩니다. 현재 지원 분야와 지원 방향과 같이 세부 사항을 논의 중에 있고요. 구체적인 내용이 확정되면 신청 요강 등을 통해서 안내드리도록 하겠습니다."]}, {"id": "Z05-P03", "title": "기초연구실 구성과 지원 요건", "start": 2894, "end": 2976, "text": "기초연구실입니다. 특정 연구 주제를 중심으로 소규모 기초연구 그룹을 지원해서 국가 기초연구 역량을 강화하는데 목적이 있습니다. 지원 유형은 심화형과 혁신형으로 구분됩니다. 개척형이 혁신형으로 2027년에 변경되었습니다. 창의적 도전적 연구를 수행하는 연구 집단을 육성하기 위해 개편되었습니다. 두 유형 모두 지원 기간은 총 3년, 지원 규모는 연 5억 원 이내입니다. 연구진의 연구 책임자를 포함해서 3인에서 4인으로 구성해야 합니다. 신진 연구 인력은 심화형의 경우 한 명 이상, 혁신형의 경우 두 명 이상 포함되어야 합니다. 또한 박사후 연구원 한 명 이상을 반드시 포함해야 합니다. 공동 연구진 구성 요건을 충족하지 못할 경우 요건 심사에서 탈락될 수 있으므로 신청 시 해당 사항을 반드시 확인해 주시기 바랍니다. 27년 신규 과제 지원 규모는 심화형 84개 내외, 혁신형 37개 내외로 예정되어 있습니다. 특히 혁신형에는 AI를 활용하여 과학적 난제 해결에 도전하는 연구 과제에 대한 지원이 포함될 예정입니다. 구체적인 지원 내용은 추후 공고되는 신청 요강에서 확인해 주시기 바랍니다.", "source_blocks": [134, 135, 136, 137, 138, 139], "bullets": ["기초연구실입니다. 특정 연구 주제를 중심으로 소규모 기초연구 그룹을 지원해서 국가 기초연구 역량을 강화하는데 목적이 있습니다.", "지원 유형은 심화형과 혁신형으로 구분됩니다. 개척형이 혁신형으로 2027년에 변경되었습니다. 창의적 도전적 연구를 수행하는 연구 집단을 육성하기 위해 개편되었습니다.", "두 유형 모두 지원 기간은 총 3년, 지원 규모는 연 5억 원 이내입니다.", "연구진의 연구 책임자를 포함해서 3인에서 4인으로 구성해야 합니다.", "신진 연구 인력은 심화형의 경우 한 명 이상, 혁신형의 경우 두 명 이상 포함되어야 합니다. 또한 박사후 연구원 한 명 이상을 반드시 포함해야 합니다. 공동 연구진 구성 요건을 충족하지 못할 경우 요건 심사에서 탈락될 수 있으므로 신청 시 해당 사항을 반드시 확인해 주시기 바랍니다.", "27년 신규 과제 지원 규모는 심화형 84개 내외, 혁신형 37개 내외로 예정되어 있습니다. 특히 혁신형에는 AI를 활용하여 과학적 난제 해결에 도전하는 연구 과제에 대한 지원이 포함될 예정입니다. 구체적인 지원 내용은 추후 공고되는 신청 요강에서 확인해 주시기 바랍니다."]}, {"id": "Z05-P04", "title": "신규 지원 규모와 추진 일정", "start": 2976, "end": 3096, "text": "앞서 사업별로 설명드린 내용을 종합해서 2027년 신규과제 지원 규모를 과제 수 중심으로 안내 드리겠습니다. 국가 연구소는 세계 내외를 지원할 예정입니다. 2027년 정부 예산 확정에 따라서 변경될 수 있습니다. 미래 연구 센터의 경우 미래 연구 트랙은 총 열 가지입니다. 목표 지향네 개 내외, 탐구형 세 개 내외, 혁신형 세 개 내외를 지원할 예정이고 각각 후속까지 한계를 포함하고 있습니다. 기초 의과학 트랙은네 개 내외, 지역 혁신 트랙은 다섯 개 내외를 지원할 예정입니다. 기초연구실은 총 120개 내외 과제입니다. 심화형 84개, 혁신형 36개 내외로 지원할 예정입니다. 이에 따라 2027년 전체 집단 연구 지원 사업의 신규 과제 지원 규모는 총 142개 내외입니다. 마지막으로 추진 일정에 대해서 설명드리겠습니다. 일정표에서 보시다시피 12월 사업 공고를 시작으로 2월 신청 접수 및 선정 평가를 거쳐서 연구가 개시될 예정입니다. 국가 연구소의 1차년도는 2027년 7월 개시로 12월까지 6개월을 지원하게 되고요. 미래 연구 센터와 기초연구실은 2027년 8월 개시되어서 12개월간 2028년 7월까지 지원됩니다. 참고로 올해는 모든 사업이 7월 1일에 개시되었습니다. 2027년에는 기초연구실의 선정 평가가 두 단계로 확대되는 등 종합적인 검토를 거쳐서 연구 개시일이 8월 1일로 조정되었음을 안내드립니다. 후속 신규 과제는 2027년 3월 1일에 개시될 예정이므로 대상이 되는 사업단에서는 하단의 일정을 참고하여 주시기 바랍니다. 이상으로 과학기술정보통신부 집단 연구 지원 사업에 2027년 신규 과제 선정 계획에 대한 설명을 마치겠습니다. 감사합니다.", "source_blocks": [140, 141, 142, 143, 144, 145, 146, 147, 148, 149], "bullets": ["앞서 사업별로 설명드린 내용을 종합해서 2027년 신규과제 지원 규모를 과제 수 중심으로 안내 드리겠습니다.", "국가 연구소는 세계 내외를 지원할 예정입니다. 2027년 정부 예산 확정에 따라서 변경될 수 있습니다.", "미래 연구 센터의 경우 미래 연구 트랙은 총 열 가지입니다. 목표 지향네 개 내외, 탐구형 세 개 내외, 혁신형 세 개 내외를 지원할 예정이고 각각 후속까지 한계를 포함하고 있습니다. 기초 의과학 트랙은네 개 내외, 지역 혁신 트랙은 다섯 개 내외를 지원할 예정입니다.", "기초연구실은 총 120개 내외 과제입니다. 심화형 84개, 혁신형 36개 내외로 지원할 예정입니다.", "이에 따라 2027년 전체 집단 연구 지원 사업의 신규 과제 지원 규모는 총 142개 내외입니다.", "마지막으로 추진 일정에 대해서 설명드리겠습니다. 일정표에서 보시다시피 12월 사업 공고를 시작으로 2월 신청 접수 및 선정 평가를 거쳐서 연구가 개시될 예정입니다.", "국가 연구소의 1차년도는 2027년 7월 개시로 12월까지 6개월을 지원하게 되고요.", "미래 연구 센터와 기초연구실은 2027년 8월 개시되어서 12개월간 2028년 7월까지 지원됩니다. 참고로 올해는 모든 사업이 7월 1일에 개시되었습니다.", "2027년에는 기초연구실의 선정 평가가 두 단계로 확대되는 등 종합적인 검토를 거쳐서 연구 개시일이 8월 1일로 조정되었음을 안내드립니다.", "후속 신규 과제는 2027년 3월 1일에 개시될 예정이므로 대상이 되는 사업단에서는 하단의 일정을 참고하여 주시기 바랍니다. 이상으로 과학기술정보통신부 집단 연구 지원 사업에 2027년 신규 과제 선정 계획에 대한 설명을 마치겠습니다. 감사합니다."]}], "summary": ["국가연구소, 미래연구센터, 기초연구실의 목적·지원 규모·연구진 구성 요건을 안내합니다.", "미래연구센터는 유형별 지원 목적과 구성 요건이 다르고, 기초연구실은 신진 연구 인력 등 필수 구성 요건을 충족해야 합니다.", "집단 연구의 세부 사항은 별도 공고 예정이며 사업별 연구 개시일도 구분됩니다."]}, {"id": "Z06", "title": "교육부 사업 추진 방향", "start": 3096, "end": 3390, "paragraphs": [{"id": "Z06-P01", "title": "사업 체계 개편", "start": 3096, "end": 3150, "text": "여기까지 과학기술정보통신부 기초연구 사업을 안내하였습니다. 이번 순서는 교육부 이공분야 학술연구 지원 사업 안내입니다. 교육부 기초연구 사업 추진 방향에 대해 교육부 학술연구 정책과 양종은 사무관이 발표하겠습니다. 안녕하십니까? 교육부 학술연구 정책과 양종훈 사무관입니다. 교육부 이공군 학술연구 주 사업에 대해서 말씀드리겠습니다. 앞에 말 발표한 과학기술정보통신부의 사업과 유사한 내용도 있지만 다른 사업도 있기 때문에 내용을 들으시면 좋을 것 같습니다. 내년도에는 학술연구 기반 구축 사업을 학술연구 인재 육성, 대학 연구 기반 구축, 지역 중심 혁신 지원, 통합 기초 지원의 네 가지 영역으로 개편합니다. 각 영역을 차례로 설명드리겠습니다.", "source_blocks": [150, 151, 152], "bullets": ["여기까지 과학기술정보통신부 기초연구 사업을 안내하였습니다. 이번 순서는 교육부 이공분야 학술연구 지원 사업 안내입니다. 교육부 기초연구 사업 추진 방향에 대해 교육부 학술연구 정책과 양종은 사무관이 발표하겠습니다. 안녕하십니까? 교육부 학술연구 정책과 양종훈 사무관입니다. 교육부 이공군 학술연구 주 사업에 대해서 말씀드리겠습니다. 앞에 말 발표한 과학기술정보통신부의 사업과 유사한 내용도 있지만 다른 사업도 있기 때문에 내용을 들으시면 좋을 것 같습니다.", "내년도에는 학술연구 기반 구축 사업을 학술연구 인재 육성, 대학 연구 기반 구축, 지역 중심 혁신 지원, 통합 기초 지원의 네 가지 영역으로 개편합니다. 각 영역을 차례로 설명드리겠습니다."]}, {"id": "Z06-P02", "title": "학술연구 인재 육성", "start": 3150, "end": 3206, "text": "우선 학술 연구 인재 육성입니다. 학소연구 인재육성은 1900 총 1925원이 편성되어 석사부터 전임 교원까지 전 학문 영역에 학문 세대에 걸쳐서 지원을 하고 있습니다. 우선 대학원생 연구 장려금의 경우에는 석사 과정 박사 과정생의 학위논문 연구를 위한 연구비를 지원하고 있습니다. 그리고 박사후 성장 지원의 경우에는 박사후 연구원에게 국내 연수 국외 연수를 지원하고 있습니다. 그리고 기본 연구 포형 경우에는 대학의 비전임원과 박사후 연구원에 대해서 지원하고 있습니다. 그리고 미래 도전 연구 지원은 기초과학 분야의 대학 연구자를 대상으로 다학제 융합 연구를 지원하고 있습니다. 보호 연구의 경우에는 국가 차원에서 보호와 지능이 필요한 분야에 대해서 별도로 지원을 하고 있는 상황입니다. 그리고 대학 연구 기반 구축에 대해서 말씀드리겠습니다. 총 2,817억 원이 편성되었습니다.", "source_blocks": [153, 154], "bullets": ["우선 학술 연구 인재 육성입니다. 학소연구 인재육성은 1900 총 1925원이 편성되어 석사부터 전임 교원까지 전 학문 영역에 학문 세대에 걸쳐서 지원을 하고 있습니다.", "우선 대학원생 연구 장려금의 경우에는 석사 과정 박사 과정생의 학위논문 연구를 위한 연구비를 지원하고 있습니다.", "그리고 박사후 성장 지원의 경우에는 박사후 연구원에게 국내 연수 국외 연수를 지원하고 있습니다.", "그리고 기본 연구 포형 경우에는 대학의 비전임원과 박사후 연구원에 대해서 지원하고 있습니다.", "그리고 미래 도전 연구 지원은 기초과학 분야의 대학 연구자를 대상으로 다학제 융합 연구를 지원하고 있습니다.", "보호 연구의 경우에는 국가 차원에서 보호와 지능이 필요한 분야에 대해서 별도로 지원을 하고 있는 상황입니다.", "그리고 대학 연구 기반 구축에 대해서 말씀드리겠습니다. 총 2,817억 원이 편성되었습니다."]}, {"id": "Z06-P03", "title": "대학 연구 기반과 지역 혁신 지원", "start": 3206, "end": 3291, "text": "기초연구소 지원은 대학 중점 연구소와 지램프라고 해서 대학 기초연구소를 지원하고 있습니다. 그리고 기초 인프라 지원은 저희가 이번에 셰어라고 해서 대학 단위에서 공기원 공시관을 중심으로 대학 내 장비 시설의 거버넌스를 개편하고 통합 관리 체계를 구축하는 사업을 신설했습니다. 이 부분에 대해서는 내년 초에 뒤에 말씀드릴 핵심 연구 지원 센터와 함께 내년 초에 다시 한번 설명회를 드리고 사업에 대해서 자세한 설명을 드릴 기회를 가지게 될 것 같습니다. 그리고 다음으로는 연구 분야별 공동 활용 인프라 및 첨단 R&D 장비 고축을 통해서 장비 전문 인력을 육성하고 연구를 지원하는 핵심 연구 지원 센터 사업을 기초 인프라 지원 내에서 함께 추진하고 있습니다. 마지막으로 대학 연구 기반 구축 내에서는 국가 연구소를 과기정통부와 함께 추진하고 있습니다. 다음으로는 지역 중심 혁신 지원입니다. 지역 중심 혁신 주원은 총 171억 원을 편성했습니다. 글로컬랩은 지역 산업 기반이 대학 연구소 연구 역량을 강화하고 지역 발전을 선도할 수 있게 하는 사업입니다. 그리고 글로컬 R&D 지원은 비수도권의 대학 연구자가 중심이 되어 기초연구를 하고 그리고 국제 협업을 포함해서 지원을 하고 있습니다. 마지막으로 통합 기초 지원은 661억 원을 편성하였는데이 부분은 현재 일 되어서 계속 사업만 지원하고 있는 상황입니다.", "source_blocks": [155, 156, 157], "bullets": ["기초연구소 지원은 대학 중점 연구소와 지램프라고 해서 대학 기초연구소를 지원하고 있습니다.", "그리고 기초 인프라 지원은 저희가 이번에 셰어라고 해서 대학 단위에서 공기원 공시관을 중심으로 대학 내 장비 시설의 거버넌스를 개편하고 통합 관리 체계를 구축하는 사업을 신설했습니다. 이 부분에 대해서는 내년 초에 뒤에 말씀드릴 핵심 연구 지원 센터와 함께 내년 초에 다시 한번 설명회를 드리고 사업에 대해서 자세한 설명을 드릴 기회를 가지게 될 것 같습니다.", "그리고 다음으로는 연구 분야별 공동 활용 인프라 및 첨단 R&D 장비 고축을 통해서 장비 전문 인력을 육성하고 연구를 지원하는 핵심 연구 지원 센터 사업을 기초 인프라 지원 내에서 함께 추진하고 있습니다.", "마지막으로 대학 연구 기반 구축 내에서는 국가 연구소를 과기정통부와 함께 추진하고 있습니다.", "다음으로는 지역 중심 혁신 지원입니다. 지역 중심 혁신 주원은 총 171억 원을 편성했습니다.", "글로컬랩은 지역 산업 기반이 대학 연구소 연구 역량을 강화하고 지역 발전을 선도할 수 있게 하는 사업입니다.", "그리고 글로컬 R&D 지원은 비수도권의 대학 연구자가 중심이 되어 기초연구를 하고 그리고 국제 협업을 포함해서 지원을 하고 있습니다.", "마지막으로 통합 기초 지원은 661억 원을 편성하였는데이 부분은 현재 일 되어서 계속 사업만 지원하고 있는 상황입니다."]}, {"id": "Z06-P04", "title": "예산과 신규 지원 계획", "start": 3291, "end": 3390, "text": "그래서 내년도 예산 아닙니다. 현재 6,469억 원이 정부안으로 변성되었고 국회 논의 과정에서 최종 확정이 될 예정이고 그에 대한 내용들은 내년 초에 사업 시행 계획을 공고할 때 자세하게 확정되어서 나갈 예정입니다. 하나하나 보시면 학술 연구 인재 육성에서는 기본 연구 부분을과 미래 도전 연구 주원이 대폭 증가하여 저희가 준비하고 있습니다. 그리고 대학 연구 기반 구축 같은 경우에는 기초연구소 지원에 포함되어 있는 국가 중점 연구서는 현재 일몰되어서 계속 사업만 있는 상황이고 지프 사업의 경우에는 예도에 정부한 기준으로는 한계를 신규 선정할 예정입니다. 그리고 기초 인프라 지원 같은 경우에는 핵심 연구 센터는 신규와 호소 합쳐서 15개를 저희가 준비하고 있습니다. 그리고 셰어 사업의 경우에는 현재로서는 세 개를 지원해서 대학 내에서 장비 거버넌스를 그렇게 편하려고 지원하고 있습니다. 그리고 국가 연구소는 과학기술정보통신부와 함께 현재 세 개를 지원하려고 준비하고 있는 상황입니다. 그리고 지역 중심 혁신 지원의 경우에는 글로컬 랩은 계속 사업 24개와 함께 신규 과제를 다섯 개를 선정하고 현재로서는 거점형과 컨소시엄형을 거점형 세 개, 컨소시엄형 두 개로 준비하고 있는 상황입니다. 그리고 글로컬 R&D 지원의 경우에는 신규 과제 수를 112개로 하여 준비하고 있는 상황입니다. 이상으로 교육부분야 학술 연구 지원 사업의 추진 방향을 간단하게 설명드렸습니다. 이어서 이공분야 학술연구 지원 사업 안내에 대해 한국연구재단 이공학술 지원 팀 김효진 팀장이 발표하겠습니다.", "source_blocks": [158, 159, 160], "bullets": ["그래서 내년도 예산 아닙니다. 현재 6,469억 원이 정부안으로 변성되었고 국회 논의 과정에서 최종 확정이 될 예정이고 그에 대한 내용들은 내년 초에 사업 시행 계획을 공고할 때 자세하게 확정되어서 나갈 예정입니다. 하나하나 보시면 학술 연구 인재 육성에서는 기본 연구 부분을과 미래 도전 연구 주원이 대폭 증가하여 저희가 준비하고 있습니다.", "그리고 대학 연구 기반 구축 같은 경우에는 기초연구소 지원에 포함되어 있는 국가 중점 연구서는 현재 일몰되어서 계속 사업만 있는 상황이고 지프 사업의 경우에는 예도에 정부한 기준으로는 한계를 신규 선정할 예정입니다.", "그리고 기초 인프라 지원 같은 경우에는 핵심 연구 센터는 신규와 호소 합쳐서 15개를 저희가 준비하고 있습니다.", "그리고 셰어 사업의 경우에는 현재로서는 세 개를 지원해서 대학 내에서 장비 거버넌스를 그렇게 편하려고 지원하고 있습니다.", "그리고 국가 연구소는 과학기술정보통신부와 함께 현재 세 개를 지원하려고 준비하고 있는 상황입니다.", "그리고 지역 중심 혁신 지원의 경우에는 글로컬 랩은 계속 사업 24개와 함께 신규 과제를 다섯 개를 선정하고 현재로서는 거점형과 컨소시엄형을 거점형 세 개, 컨소시엄형 두 개로 준비하고 있는 상황입니다.", "그리고 글로컬 R&D 지원의 경우에는 신규 과제 수를 112개로 하여 준비하고 있는 상황입니다. 이상으로 교육부분야 학술 연구 지원 사업의 추진 방향을 간단하게 설명드렸습니다. 이어서 이공분야 학술연구 지원 사업 안내에 대해 한국연구재단 이공학술 지원 팀 김효진 팀장이 발표하겠습니다."]}], "summary": ["교육부 사업을 학술연구 인재 육성, 대학 연구 기반 구축, 지역 중심 혁신 지원, 통합 기초 지원으로 설명합니다.", "대학원생·박사후연구원 지원과 대학 연구소·공동 활용 장비 기반 확충, 지역 혁신 사업을 함께 추진합니다.", "예산과 신규 선정 계획은 정부안 기준이며, 최종 내용은 추후 시행 계획과 공고에서 확인해야 합니다."]}, {"id": "Z07", "title": "교육부 사업별 지원 내용과 신청", "start": 3391, "end": 3873, "paragraphs": [{"id": "Z07-P01", "title": "대학원생 연구장려금", "start": 3391, "end": 3505, "text": "안녕하세요. 이공학술 지원팀 김효진입니다. 이어서 교육부 이공학술 분야 사업 내용 및 신규 과제 신청 유의 사항에 대해 설명드리도록 하겠습니다. 우선 2027년 사업 시행 계획 수립시 변동 가능하고 추후 사업별 공고문을 통해 자세한 설명을 진행드리겠습니다. 첫 번째로 학술 연구 인재 양성 사업 내 학문도속 지원 사업으로 대학생부터 박사후 연구원 신진 연구자까지 연구자의 성장 단계에 맞춰 연구 활동을 지원하는 사업입니다. 먼저 대학원생 연구 장려금은 우수한 석사 과정생 박사 과정생이 한문 학문 학위논문 연구를 위한 연구비를 지원하는 사업입니다. 석사 과정생은 국내대학원 석사 과정에 전일제로 제학 중인음 중인자로 석박사 통합 과정은 연구 계실 기준 2학기 이상 제학하여야 하고 석박사 통합 과정은 연구 개시 기준 2학기부터 4학기 제약 중이어야 합니다. 연구 기관은 1년 연 1,200만 원 지원이며 연구 수당은 개상이 불과합니다. 연구 신규 지원 규모로는 1044개 선정 125억 2,800만 원으로 9월 1일 연구 개시입니다. 박사 과정은 국내 대학원 박사 과정의 전일제 제약생 제약 중인자로 석박사 과정과 수생을 포함해서 선정할 예정입니다. 연구 기관은 1년에서 2년 지연 연구비는 연 2,500만 원이고 인건비 1천만 원 이상 계상 필수입니다. 신규 지원 규모로는 782개 선정, 97억 5,75 500만 원으로 9월 1일 연구 개시입니다.", "source_blocks": [161, 162, 163, 164, 165, 166], "bullets": ["안녕하세요. 이공학술 지원팀 김효진입니다. 이어서 교육부 이공학술 분야 사업 내용 및 신규 과제 신청 유의 사항에 대해 설명드리도록 하겠습니다.", "우선 2027년 사업 시행 계획 수립시 변동 가능하고 추후 사업별 공고문을 통해 자세한 설명을 진행드리겠습니다.", "첫 번째로 학술 연구 인재 양성 사업 내 학문도속 지원 사업으로 대학생부터 박사후 연구원 신진 연구자까지 연구자의 성장 단계에 맞춰 연구 활동을 지원하는 사업입니다.", "먼저 대학원생 연구 장려금은 우수한 석사 과정생 박사 과정생이 한문 학문 학위논문 연구를 위한 연구비를 지원하는 사업입니다.", "석사 과정생은 국내대학원 석사 과정에 전일제로 제학 중인음 중인자로 석박사 통합 과정은 연구 계실 기준 2학기 이상 제학하여야 하고 석박사 통합 과정은 연구 개시 기준 2학기부터 4학기 제약 중이어야 합니다. 연구 기관은 1년 연 1,200만 원 지원이며 연구 수당은 개상이 불과합니다. 연구 신규 지원 규모로는 1044개 선정 125억 2,800만 원으로 9월 1일 연구 개시입니다.", "박사 과정은 국내 대학원 박사 과정의 전일제 제약생 제약 중인자로 석박사 과정과 수생을 포함해서 선정할 예정입니다. 연구 기관은 1년에서 2년 지연 연구비는 연 2,500만 원이고 인건비 1천만 원 이상 계상 필수입니다. 신규 지원 규모로는 782개 선정, 97억 5,75 500만 원으로 9월 1일 연구 개시입니다."]}, {"id": "Z07-P02", "title": "박사후 성장 지원", "start": 3505, "end": 3551, "text": "다음으로는 박사후 성장 지원 사업입니다. 박사학위 취득 이후 영향을 높이고 독립적인 연구자로 성장할 수 있도록 지원하기 위한 박사후 성장 지원 사업입니다. 박사후 국내 연수는 국내의 대학 박사 취득 후 5년 이내인자로 연구 기간은 1년에서 3년 6천만 원 지원 연구비이며 신규 지원 규모로는 70개 선정 21억으로 9월 1일 개시입니다. 박사후 국외 연수는 국내외 대학 박사 취득 5년 이내인자로 연구 기간은 1년 6년 6천만 원이고 신규 지원 규모로는 80개 선정 48억으로 9월 1일 연구 개시입니다.", "source_blocks": [167], "bullets": ["다음으로는 박사후 성장 지원 사업입니다. 박사학위 취득 이후 영향을 높이고 독립적인 연구자로 성장할 수 있도록 지원하기 위한 박사후 성장 지원 사업입니다.", "박사후 국내 연수는 국내의 대학 박사 취득 후 5년 이내인자로 연구 기간은 1년에서 3년 6천만 원 지원 연구비이며 신규 지원 규모로는 70개 선정 21억으로 9월 1일 개시입니다.", "박사후 국외 연수는 국내외 대학 박사 취득 5년 이내인자로 연구 기간은 1년 6년 6천만 원이고 신규 지원 규모로는 80개 선정 48억으로 9월 1일 연구 개시입니다."]}, {"id": "Z07-P03", "title": "기본 연구·미래도전·보호 연구", "start": 3551, "end": 3651, "text": "이와 함께 학술 생태계의 조성 지원 사업은 성장 단계에 따른 안정적인 연구 기회와 다양한 경험을 보장하기 위해 기본 연구 포용형 미래도전 연구 지원 보호 연구로 연구자 맞춤형 지원을 하고자 합니다. 기본 포요형형은 대학소속 비전임 박사후 연구원의 조기 정착을 위해 연구 경험과 기회를 제공함으로써 안정적인 연구를 지원하고자 합니다. 지원 대상은 대학소 비전임 박사후 연구원의 단독 연구이고 연구 기관은 3년, 연구 지원비는 연천만 원이며 신규 지원 규모로는 800개 선정 240억 원이며 9월 1일 개시입니다. 미래 도전 지원은 새로운 영역을 개척할 수 있고 도전적이고 잠재력이 풍부하며 패러다임을 변화를 가져올 수 있는 협력 다학제 연구 지원을 하고자 합니다. 지원 대상은 대학 소속 연구자로 공동 연구이며 연구 기관은 5년 연 1억 6천 지원입니다. 신규신 지원 규모로는 35개 선정 28억 원이며 9월 1일 연구 개시입니다. 다음은 보호 연구인데요. 보호 연구는 국가 차원의 보호 육성이 필요한 분야에 연구를 지원하여 학문의 균형 발전을 유도하고자 합니다. 지원 대상은 대학 소속 연구자로 공동 또는 단독 연구가 가능하며 연구 기간은 5년, 지원비는 공동 연구의 경우 2억 8, 단독 연구는 1억 원입니다. 신규 지원 규모로는 35개 선정 21억으로 9월 1일 연구 개시입니다.", "source_blocks": [168, 169, 170, 171], "bullets": ["이와 함께 학술 생태계의 조성 지원 사업은 성장 단계에 따른 안정적인 연구 기회와 다양한 경험을 보장하기 위해 기본 연구 포용형 미래도전 연구 지원 보호 연구로 연구자 맞춤형 지원을 하고자 합니다.", "기본 포요형형은 대학소속 비전임 박사후 연구원의 조기 정착을 위해 연구 경험과 기회를 제공함으로써 안정적인 연구를 지원하고자 합니다. 지원 대상은 대학소 비전임 박사후 연구원의 단독 연구이고 연구 기관은 3년, 연구 지원비는 연천만 원이며 신규 지원 규모로는 800개 선정 240억 원이며 9월 1일 개시입니다.", "미래 도전 지원은 새로운 영역을 개척할 수 있고 도전적이고 잠재력이 풍부하며 패러다임을 변화를 가져올 수 있는 협력 다학제 연구 지원을 하고자 합니다. 지원 대상은 대학 소속 연구자로 공동 연구이며 연구 기관은 5년 연 1억 6천 지원입니다. 신규신 지원 규모로는 35개 선정 28억 원이며 9월 1일 연구 개시입니다.", "다음은 보호 연구인데요. 보호 연구는 국가 차원의 보호 육성이 필요한 분야에 연구를 지원하여 학문의 균형 발전을 유도하고자 합니다. 지원 대상은 대학 소속 연구자로 공동 또는 단독 연구가 가능하며 연구 기간은 5년, 지원비는 공동 연구의 경우 2억 8, 단독 연구는 1억 원입니다. 신규 지원 규모로는 35개 선정 21억으로 9월 1일 연구 개시입니다."]}, {"id": "Z07-P04", "title": "대학 연구 기반·지역 혁신 지원", "start": 3651, "end": 3761, "text": "다음 대학 연구 기획 기반 구축 인프라 지원 사업입니다. 기초연구 거점으로서 대학 내 기초연구를 육성 운영 체계를 확충해 연구자가 보다 안정적인 환경에서 연구를 수행할 수 있도록 지원하고자 합니다. 주요 사업으로는 핵심 연구지원 센터 조성 및 운영과 대학 연구지원 구축이 있습니다. 이 부분은 엠팩에서 주관하는 사업이기는 합니다. 연구 시설과 장비의 공동 활용을 활성화하고 대학 내 연구지원 기반을 체계적으로 구축하는데 목적이 있는 사업이며 자세한 사항은 별도 안내드릴 예정입니다. 그리고 지램프 사업의 경우도 차년도 별도 수립을 해서 안내할 예정이고 국가 연구소 사업의 경우는 과기부 설명과 동일하겠습니다. 다음은 지역 중심 혁신 지원 사업입니다. 지역 대학의 기초연구 역량을 높이고 지역 특성과 영한 연구 기반을 육성하는 사업으로 글로컬 랩과 글로컬 R&D 지원 사업이 있습니다. 지역의 연구 수요와 대학의 강점을 연결하고 연계하고 대학 및 연구 기관제 합용을 통해 지속 가능한 연구 기반을 마련하 중점을 두고 있습니다. 글로컬랩의 지원 대상은 대학 부설 연구소이며 거점형 그다음 컨소시엄으로 구분하여 선정할 예정입니다. 연구 기관은 9년, 연구 지원 연구비는 거점형은 연, 컨소시엄은 연 24억입니다. 신규 지원로는 다섯 개 내외 선정 42억 5천만 원이 지원될 예정이고 유형별 선정수는 앞서 설명드린 바 같지만 조금 변동될 수도 있음을 참고해 주시기 바랍니다. 그리고 연구 개시는 9월 1일입니다.", "source_blocks": [172, 173, 174, 175, 176, 177], "bullets": ["다음 대학 연구 기획 기반 구축 인프라 지원 사업입니다. 기초연구 거점으로서 대학 내 기초연구를 육성 운영 체계를 확충해 연구자가 보다 안정적인 환경에서 연구를 수행할 수 있도록 지원하고자 합니다. 주요 사업으로는 핵심 연구지원 센터 조성 및 운영과 대학 연구지원 구축이 있습니다. 이 부분은 엠팩에서 주관하는 사업이기는 합니다.", "연구 시설과 장비의 공동 활용을 활성화하고 대학 내 연구지원 기반을 체계적으로 구축하는데 목적이 있는 사업이며 자세한 사항은 별도 안내드릴 예정입니다.", "그리고 지램프 사업의 경우도 차년도 별도 수립을 해서 안내할 예정이고 국가 연구소 사업의 경우는 과기부 설명과 동일하겠습니다.", "다음은 지역 중심 혁신 지원 사업입니다. 지역 대학의 기초연구 역량을 높이고 지역 특성과 영한 연구 기반을 육성하는 사업으로 글로컬 랩과 글로컬 R&D 지원 사업이 있습니다. 지역의 연구 수요와 대학의 강점을 연결하고 연계하고 대학 및 연구 기관제 합용을 통해 지속 가능한 연구 기반을 마련하 중점을 두고 있습니다.", "글로컬랩의 지원 대상은 대학 부설 연구소이며 거점형 그다음 컨소시엄으로 구분하여 선정할 예정입니다. 연구 기관은 9년, 연구 지원 연구비는 거점형은 연, 컨소시엄은 연 24억입니다.", "신규 지원로는 다섯 개 내외 선정 42억 5천만 원이 지원될 예정이고 유형별 선정수는 앞서 설명드린 바 같지만 조금 변동될 수도 있음을 참고해 주시기 바랍니다. 그리고 연구 개시는 9월 1일입니다."]}, {"id": "Z07-P05", "title": "신청 자격·수행 제한·유의 사항", "start": 3761, "end": 3873, "text": "다음은 신규 과제 신청 유의 사항입니다. 지원 자격과 신청 요건을 반드시 확인해야 합니다. 사업별 하기 취득 시점 연구 경력 소속 기간 및 참여 자격이 다룰 수 있으므로 신청 전 공고문 및 신청 요강을 꼼꼼히 확인해 주시기 바랍니다. 그리고 신청 및 수행 제한으로 개별 사업 내 한개만 신청 수행 가능하고 집단 사업 내에서는 연구 책임자 또는 공동 연구자 한 개만 신청 또는 수행 가능합니다. 예외 사항으로는 수행 중인 과제가 신청 과제 개시일로부터 10개월 이내 종료내는 경우 예외로 인정되고 기초 인프라 지원 사업에 하나하여 타 집단 과제와 중복 수행이 허용합니다. 정부 R&D 공통 사항인 동시 수행 과제 수와 연구책임자 수행 과제 수 제한은 앞서 과학기술정보통신부 사업에서 설명한 내용과 동일합니다. 끝으로 신청 절차와 방 신청 방법도 과기부 설명 내용과 동일합니다. 주의 사항으로는 2 27년 과기정통부 교육부 최초 신청 과제 접수된 연구 계획서 대상으로 차별성 검토를 실시하여 차별성이 없음으로 판정되는 경우 불이익 받을 수 있습니다. 공고된 개별 사업 신청 요강에 따라 신청하여야 하며 신청 요강 내 안내 사항을 준수하지 않을 경우 요건 탈락될 수 있으므로 연구자께서는 본인의 연구 단계와 연구 목표에 적합한 사업을 선택하시고 작 지원 자격과 연구 계획 신청 일자 등을 충분히 검토해 주시기 바랍니다. 감사합니다.", "source_blocks": [178, 179, 180, 181, 182, 183], "bullets": ["다음은 신규 과제 신청 유의 사항입니다. 지원 자격과 신청 요건을 반드시 확인해야 합니다.", "사업별 하기 취득 시점 연구 경력 소속 기간 및 참여 자격이 다룰 수 있으므로 신청 전 공고문 및 신청 요강을 꼼꼼히 확인해 주시기 바랍니다.", "그리고 신청 및 수행 제한으로 개별 사업 내 한개만 신청 수행 가능하고 집단 사업 내에서는 연구 책임자 또는 공동 연구자 한 개만 신청 또는 수행 가능합니다.", "예외 사항으로는 수행 중인 과제가 신청 과제 개시일로부터 10개월 이내 종료내는 경우 예외로 인정되고 기초 인프라 지원 사업에 하나하여 타 집단 과제와 중복 수행이 허용합니다.", "정부 R&D 공통 사항인 동시 수행 과제 수와 연구책임자 수행 과제 수 제한은 앞서 과학기술정보통신부 사업에서 설명한 내용과 동일합니다.", "끝으로 신청 절차와 방 신청 방법도 과기부 설명 내용과 동일합니다.", "주의 사항으로는 2 27년 과기정통부 교육부 최초 신청 과제 접수된 연구 계획서 대상으로 차별성 검토를 실시하여 차별성이 없음으로 판정되는 경우 불이익 받을 수 있습니다. 공고된 개별 사업 신청 요강에 따라 신청하여야 하며 신청 요강 내 안내 사항을 준수하지 않을 경우 요건 탈락될 수 있으므로 연구자께서는 본인의 연구 단계와 연구 목표에 적합한 사업을 선택하시고 작 지원 자격과 연구 계획 신청 일자 등을 충분히 검토해 주시기 바랍니다. 감사합니다."]}], "summary": ["대학원생 연구장려금, 박사후 성장 지원, 기본·미래도전·보호 연구 등 연구 단계별 지원 내용을 안내합니다.", "대학 연구 인프라와 글로컬 사업의 지원 방향도 설명합니다.", "학위 취득 시점·소속·참여 자격과 중복 수행 제한을 확인하고, 신청 과제의 차별성과 제출 절차를 점검해야 합니다."]}, {"id": "Z08", "title": "선정 평가 방식과 기준", "start": 3873, "end": 4439, "paragraphs": [{"id": "Z08-P01", "title": "평가 유형: 서면·토론·발표·심층", "start": 3873, "end": 3991, "text": "다음 순서는 기초연구 사업 평가 안내입니다. 발표는 한국연구재단 자연과학단 이지원 피오가 하겠습니다. 안녕하십니까? 자연과학단 PO 이지원입니다. 어이어서 기초연구 사업 평가제도 설명드리겠습니다. 평가제도 설명에서는 신청하시고자 하는 사업이 어떠한 방법과 기준으로 평가되는지에 대해 설명드리겠습니다. 먼저 기초연구 사업의 평가 유형에 대해 설명드리면 평가 유형은 크게 온라인 서면 평가, 토론 평가, 발표 평가로 구분되며 일부 사업에만 적용되는 해외 서면 평가와 심층 평가가 있습니다. 1번 온라인 서면 평가는 온라인에서 개별적으로 신청 연구 계획서에 대해 평가하는 유형입니다. 북과는 RB 분야 또는 유사 세부 알비 분야를 기준으로 다섯 개에서 열 가지의 내외 규모로 평가 대상 과제를 구성하고 평가 위원 3에서 5인이 개별적으로 점수를 부여하는 방식으로 평가를 진행합니다. 이번 해외 서면 평가는 리더 연구에만 적용되는 평가 유형으로 해외 석학이 평가위원으로 참여하는 온라인 서면 평가입니다. 3번 토론 평가는 평가위원이 직접 모여서 신청 계획서에 대해 검토하고 위원 간 토론을 통해 우수한 과제가 추천될 수 있도록 평가하는 유형입니다. 4번 발표 평가는 연구 계획서에 대한 검토뿐만 아니라 연구 책임자 발표와 질의응답 그리고 평가 위원 간 토론을 통해 우수한 과제가 추천될 수 있도록 평가하는 유형입니다. 마지막으로 5번 심층 평가는 분야별 최고 수준의 전문가로 평가 위원회를 구성하고 구성된 평가 위원회가 충분한 시간을 가지고 토론과 연구 책임자 발표 및 질의응답을 통해 우수한 과제가 추천될 수 있도록 평가하는 유형입니다. 이 평가 유형은 리더 연구, 미래 연구 센터 및 국가 연구소 선정 평가에 적용하고 있습니다.", "source_blocks": [184, 185, 186, 187, 188, 189, 190, 191, 192, 193], "bullets": ["다음 순서는 기초연구 사업 평가 안내입니다. 발표는 한국연구재단 자연과학단 이지원 피오가 하겠습니다. 안녕하십니까? 자연과학단 PO 이지원입니다. 어이어서 기초연구 사업 평가제도 설명드리겠습니다. 평가제도 설명에서는 신청하시고자 하는 사업이 어떠한 방법과 기준으로 평가되는지에 대해 설명드리겠습니다.", "먼저 기초연구 사업의 평가 유형에 대해 설명드리면 평가 유형은 크게 온라인 서면 평가, 토론 평가, 발표 평가로 구분되며 일부 사업에만 적용되는 해외 서면 평가와 심층 평가가 있습니다.", "1번 온라인 서면 평가는 온라인에서 개별적으로 신청 연구 계획서에 대해 평가하는 유형입니다.", "북과는 RB 분야 또는 유사 세부 알비 분야를 기준으로 다섯 개에서 열 가지의 내외 규모로 평가 대상 과제를 구성하고 평가 위원 3에서 5인이 개별적으로 점수를 부여하는 방식으로 평가를 진행합니다.", "이번 해외 서면 평가는 리더 연구에만 적용되는 평가 유형으로 해외 석학이 평가위원으로 참여하는 온라인 서면 평가입니다.", "3번 토론 평가는 평가위원이 직접 모여서 신청 계획서에 대해 검토하고 위원 간 토론을 통해 우수한 과제가 추천될 수 있도록 평가하는 유형입니다.", "4번 발표 평가는 연구 계획서에 대한 검토뿐만 아니라 연구 책임자 발표와 질의응답 그리고 평가 위원 간 토론을 통해 우수한 과제가 추천될 수 있도록 평가하는 유형입니다.", "마지막으로 5번 심층 평가는 분야별 최고 수준의 전문가로 평가 위원회를 구성하고 구성된 평가 위원회가 충분한 시간을 가지고 토론과 연구 책임자 발표 및 질의응답을 통해 우수한 과제가 추천될 수 있도록 평가하는 유형입니다. 이 평가 유형은 리더 연구, 미래 연구 센터 및 국가 연구소 선정 평가에 적용하고 있습니다."]}, {"id": "Z08-P02", "title": "과기정통부 사업별 평가 절차", "start": 3992, "end": 4080, "text": "과기부관 사업별로 선정 평가 방식을 설명드리겠습니다. 먼저 리더 연구는 유형 B와 A 모두 1차 예비 평가는 토론 평가로 진행하고 2차 본평가는 해외 서면 평가와 발표 평가로 진행하며 심층 평가로 진행합니다. 핵심 연구에서는 유형 C는 토론, 유형 B와 A는 온라인 서면 평가로 진행하며 한우물 파기 기초연구는 토론 평가로 진행합니다. 글로벌 매칭형은 1차 평가는 온라인 서면 또는 토론으로 2차 평가는 양국 공동 패널 토론 평가로 진행하며 하반기 개시되는 전략 그리고 기본 연구 B와 기본 연구 A는 모두 온라인 서면 평가로 진행합니다. 신진 연구 보시겠습니다. 유형 B와 A는 온라인 서면 평가로 신진 연구자 인프라 지원은 1차 토론 평가 2차 발표 평가로 진행하며 올해 신규 사업인 지역 장기 연구는 토론 평가로 진행합니다. 세종과학 펠로우십은 올해 국내 트랙과 복귀 유치 트랙 두 개 유형으로 지원할 예정이며 두 개 유형 모두 온라인 서면 평가로 진행합니다. 집단 연구 사업주 국가 연구소는 1차 예비 평가는 서명과 토론 평가로 진행하고 2차 본평가는 발표 평가로 진행하며 심층 평가로 진행됩니다. 미래 연구 센터는 1차 토론 2차 발표 평가로 진행하되 어이 역시 심층 평가로 진행되며 기초연구실은 올해부터 1차 토론 2차 발표 평가로 진행될 예정입니다.", "source_blocks": [194, 195, 196, 197, 198, 199, 200, 201], "bullets": ["과기부관 사업별로 선정 평가 방식을 설명드리겠습니다.", "먼저 리더 연구는 유형 B와 A 모두 1차 예비 평가는 토론 평가로 진행하고 2차 본평가는 해외 서면 평가와 발표 평가로 진행하며 심층 평가로 진행합니다.", "핵심 연구에서는 유형 C는 토론, 유형 B와 A는 온라인 서면 평가로 진행하며 한우물 파기 기초연구는 토론 평가로 진행합니다.", "글로벌 매칭형은 1차 평가는 온라인 서면 또는 토론으로 2차 평가는 양국 공동 패널 토론 평가로 진행하며 하반기 개시되는 전략 그리고 기본 연구 B와 기본 연구 A는 모두 온라인 서면 평가로 진행합니다.", "신진 연구 보시겠습니다. 유형 B와 A는 온라인 서면 평가로 신진 연구자 인프라 지원은 1차 토론 평가 2차 발표 평가로 진행하며 올해 신규 사업인 지역 장기 연구는 토론 평가로 진행합니다.", "세종과학 펠로우십은 올해 국내 트랙과 복귀 유치 트랙 두 개 유형으로 지원할 예정이며 두 개 유형 모두 온라인 서면 평가로 진행합니다.", "집단 연구 사업주 국가 연구소는 1차 예비 평가는 서명과 토론 평가로 진행하고 2차 본평가는 발표 평가로 진행하며 심층 평가로 진행됩니다.", "미래 연구 센터는 1차 토론 2차 발표 평가로 진행하되 어이 역시 심층 평가로 진행되며 기초연구실은 올해부터 1차 토론 2차 발표 평가로 진행될 예정입니다."]}, {"id": "Z08-P03", "title": "개인 연구 평가 항목과 가중치", "start": 4081, "end": 4223, "text": "다음으로 사업별 선정 평가 시 평가 기준을 설명드리겠습니다. 참고로 도전적 혁신적 연구 촉진의 일환으로 27년부터는 혁신성 중심으로 선정 평가를 진행할 예정입니다. 이에 연구의 창의성 및 도전석 항목 평가시에 목표의 도전성 혁신성을 함께 고려할 예정임을 미리 안내드립니다. 현재 기초연구 사업은 각 사업의 목적과 특성 그리고 평가 방법에 따라 평가 항목의 배점 또는 가중치를 달리하고 있습니다. 먼저 리더 연구를 보시면 1차 예비 평가에는 연구의 창의성, 원천성 및 도전성의 50점, 연구자의 우수정, 우수성의 40점, 연구 성과의 활용 및 기대 효과의 10점을 배하고 있으며 2차 본평가에는 연구의 창인성, 원천선 및 도전성의 35점, 연구 책임자 역량의 우수성의 45점, 목표 설정의 타당성 및 달성 가능성의 10점, 유치기관 지원의 의지의 10점이 배점되어 있습니다. 핵심 연구 유형 C의 경우 토론 합의 평가이므로네 개 평가 항목에 각각 40%, 30%, 20%, 10%의 가중치를 두고 있으며 유형 B와 유형 A는 온라인 서면 평가며네 개의 평가 항목에 대해 각각 40%, 30%, 20%, 10%의 가중치를 적용하여 총점 100점이 부여됩니다. 기본 연구 B와 기본 연구 A도 온라인 서면 평가로 진행되며 앞서 말씀드린 유형 B, 유형 A와 동일한 방식으로네 개의 평가 항목에 대해 각각 50%, 30%, 10%, 10%의 가중치를 적용하여 총점 100점을 부여합니다. 도약형의 경우에는 두 개 항목의 각각 70%와 30%의 가중치를 적용하고 있으며 어이는 CRB를 중심으로 구성된 정문 평가단이 진행하는 1차 토론 평가에서 적용하고 있습니다. 현재 말씀드리는 화면에 보이는 각 평가 항목의 퍼센트로 표기되어 있는 건 가중치를 의미합니다. 점으로 표기되어 있는 건 점수를 부여한다는 걸로 이해해 주시면 입니다. 다음으로 신진 연구의 유형 BA와 세종과학 펠로우십의 국내 트랙 복귀 유치 트랙입니다. 화면에 보이는 자료를 참고해 주시기 바라고 세종과학 펠로우십의 경우는 두 개 각 유형별 평가 항목과 가중치가 상해하오니 신청하고자 하는 유형에 따른 평가 항목 및 가중치를 잘 확인하시고 과제를 신청해 주셔야 합니다.", "source_blocks": [202, 203, 204, 205, 206, 207], "bullets": ["다음으로 사업별 선정 평가 시 평가 기준을 설명드리겠습니다. 참고로 도전적 혁신적 연구 촉진의 일환으로 27년부터는 혁신성 중심으로 선정 평가를 진행할 예정입니다. 이에 연구의 창의성 및 도전석 항목 평가시에 목표의 도전성 혁신성을 함께 고려할 예정임을 미리 안내드립니다.", "현재 기초연구 사업은 각 사업의 목적과 특성 그리고 평가 방법에 따라 평가 항목의 배점 또는 가중치를 달리하고 있습니다.", "먼저 리더 연구를 보시면 1차 예비 평가에는 연구의 창의성, 원천성 및 도전성의 50점, 연구자의 우수정, 우수성의 40점, 연구 성과의 활용 및 기대 효과의 10점을 배하고 있으며 2차 본평가에는 연구의 창인성, 원천선 및 도전성의 35점, 연구 책임자 역량의 우수성의 45점, 목표 설정의 타당성 및 달성 가능성의 10점, 유치기관 지원의 의지의 10점이 배점되어 있습니다.", "핵심 연구 유형 C의 경우 토론 합의 평가이므로네 개 평가 항목에 각각 40%, 30%, 20%, 10%의 가중치를 두고 있으며 유형 B와 유형 A는 온라인 서면 평가며네 개의 평가 항목에 대해 각각 40%, 30%, 20%, 10%의 가중치를 적용하여 총점 100점이 부여됩니다.", "기본 연구 B와 기본 연구 A도 온라인 서면 평가로 진행되며 앞서 말씀드린 유형 B, 유형 A와 동일한 방식으로네 개의 평가 항목에 대해 각각 50%, 30%, 10%, 10%의 가중치를 적용하여 총점 100점을 부여합니다.", "도약형의 경우에는 두 개 항목의 각각 70%와 30%의 가중치를 적용하고 있으며 어이는 CRB를 중심으로 구성된 정문 평가단이 진행하는 1차 토론 평가에서 적용하고 있습니다.", "현재 말씀드리는 화면에 보이는 각 평가 항목의 퍼센트로 표기되어 있는 건 가중치를 의미합니다. 점으로 표기되어 있는 건 점수를 부여한다는 걸로 이해해 주시면 입니다.", "다음으로 신진 연구의 유형 BA와 세종과학 펠로우십의 국내 트랙 복귀 유치 트랙입니다. 화면에 보이는 자료를 참고해 주시기 바라고 세종과학 펠로우십의 경우는 두 개 각 유형별 평가 항목과 가중치가 상해하오니 신청하고자 하는 유형에 따른 평가 항목 및 가중치를 잘 확인하시고 과제를 신청해 주셔야 합니다."]}, {"id": "Z08-P04", "title": "평가 방식 변경 사항", "start": 4225, "end": 4271, "text": "다음은 한우물 파기 기초연구 신진 연구자 인프라 지원 핵심 연구 전략형 사업의 평가 항목입니다. 자료를 참고해 주시면 되고 일부 평가 방식이 변경된 사업에 대해서만 추가 설명드리겠습니다. 한우물 파기 기초연구의 경우 이전까지 1차 토론 평가와 2차 발표 평가로 진행되어 왔다면 2027년부터는 토론 평가만 실시할 예정입니다. 이에 평가 준비에 참고하여 주시기 바랍니다. 또한 핵심 연구 전략형도 2026년에는 1차 예비 계획서 평가 후 계획서를 접수받아 2차 본평 평가를 진행하였다면 2027년에는 한 번의 계획서를 접수받고 온라인 서면 평가로 진행할 예정입니다. 글로벌 매칭형 사업의 평가 항목도 화면을 참고해 주시면 감사하겠습니다.", "source_blocks": [208, 209, 210], "bullets": ["다음은 한우물 파기 기초연구 신진 연구자 인프라 지원 핵심 연구 전략형 사업의 평가 항목입니다. 자료를 참고해 주시면 되고 일부 평가 방식이 변경된 사업에 대해서만 추가 설명드리겠습니다.", "한우물 파기 기초연구의 경우 이전까지 1차 토론 평가와 2차 발표 평가로 진행되어 왔다면 2027년부터는 토론 평가만 실시할 예정입니다. 이에 평가 준비에 참고하여 주시기 바랍니다.", "또한 핵심 연구 전략형도 2026년에는 1차 예비 계획서 평가 후 계획서를 접수받아 2차 본평 평가를 진행하였다면 2027년에는 한 번의 계획서를 접수받고 온라인 서면 평가로 진행할 예정입니다.", "글로벌 매칭형 사업의 평가 항목도 화면을 참고해 주시면 감사하겠습니다."]}, {"id": "Z08-P05", "title": "집단 연구 평가 기준", "start": 4272, "end": 4360, "text": "다음으로 집단 연구 평가 안내드리겠습니다. 먼저 기초연구실의 경우 2027년부터 1차 토론, 2차 발표로 진행될 예정이니 평가 준비에 참고하여 주시고 결과 도출 방식은 1차 토론의 경우 항목별 가중치에 기반한 합의 방식, 2차 발표의 경우는 개별 점수 부여 방식으로 평가가 진행될 예정입니다. 자세한 평가 항목과 가중치 배은 화면을 참고하여 주시기 바랍니다. 다음은 미래 연구 센터입니다. 미래 연구 센터는 분야및 목적에 따라 여러 가지 유형으로 구분되고 유형별로 평가 항목을 달리 적용하고 있습니다. 공통적으로는 1차 토론 평가와 2차 발표 평가로 진행되고 있고요. 자세한 항목 및 대점 등은 화면에 보이는 자료로 대신하도록 하겠습니다. 다만 지금 미래 연구 센터 중에 X유형은 아직 평가 항목과 신규 공고시의 최종 평가 항목을 신규 공고시에 최종 확인하여 주시기 바랍니다. 다음은 국가 연구소 평가 항목입니다. 국가 연구소의 경우 연구 개발, 연구소 운영, 대학원 지원 의지 총 세 가지 영역으로 구분하여 평가를 실시하고 있으며 자세한 내용은 화면을 참고하여 주시면 감사하겠습니다. 다만 화면에 안내되는 것처럼 향후 세부 평가 계획에서 변경 적용될 수 있음을 미리 안내드리고 안내드립니다. 이상과 같이 설명드린 각 사업별 평가 항목은 기초연구 사업 신청 요강에서도 확인하실 수 있습니다.", "source_blocks": [211, 212, 213, 214, 215, 216, 217], "bullets": ["다음으로 집단 연구 평가 안내드리겠습니다.", "먼저 기초연구실의 경우 2027년부터 1차 토론, 2차 발표로 진행될 예정이니 평가 준비에 참고하여 주시고 결과 도출 방식은 1차 토론의 경우 항목별 가중치에 기반한 합의 방식, 2차 발표의 경우는 개별 점수 부여 방식으로 평가가 진행될 예정입니다. 자세한 평가 항목과 가중치 배은 화면을 참고하여 주시기 바랍니다.", "다음은 미래 연구 센터입니다. 미래 연구 센터는 분야및 목적에 따라 여러 가지 유형으로 구분되고 유형별로 평가 항목을 달리 적용하고 있습니다. 공통적으로는 1차 토론 평가와 2차 발표 평가로 진행되고 있고요. 자세한 항목 및 대점 등은 화면에 보이는 자료로 대신하도록 하겠습니다.", "다만 지금 미래 연구 센터 중에 X유형은 아직 평가 항목과 신규 공고시의 최종 평가 항목을 신규 공고시에 최종 확인하여 주시기 바랍니다.", "다음은 국가 연구소 평가 항목입니다. 국가 연구소의 경우 연구 개발, 연구소 운영, 대학원 지원 의지 총 세 가지 영역으로 구분하여 평가를 실시하고 있으며 자세한 내용은 화면을 참고하여 주시면 감사하겠습니다.", "다만 화면에 안내되는 것처럼 향후 세부 평가 계획에서 변경 적용될 수 있음을 미리 안내드리고 안내드립니다.", "이상과 같이 설명드린 각 사업별 평가 항목은 기초연구 사업 신청 요강에서도 확인하실 수 있습니다."]}, {"id": "Z08-P06", "title": "교육부 사업 평가와 확인 사항", "start": 4361, "end": 4439, "text": "지금까지 과기부 소관 사업에 대한 설명을 드렸고 다음은 교육부 소관 사업에 대해 말씀드리겠습니다. 학술 연구 인재 육성 사업 중에 석사 과정 연구 장려금은 전문 평가당에 의한 토론 평가 방식으로 그리고 박사 과정 연구 장여금과 박사 국내 연수, 국계 연수는 온라인 평가 방식으로 평가를 진행할 내용 계획입니다. 동일 내역 사업 중에 기본 연구 포형은 온라인 평가 방식으로 그리고 미래도전 연구 지원과 보호 연구는 토론 평가 방식으로 진행할 예정입니다. 지역 중심 혁신 지원 중에서 글로컬 랩은 1차 토론 평가와 2차 발표 평가의 방식으로 진행될 예정입니다. 글로컬 R&D 지원은 온라인 평가로 진행될 예정입니다. 참고로 교육부 소관 사업은 현재 사업 종합 계획이 미확정 상태이기 때문에 화면에서 보시고 계시는 평가 방식이나 항목 배점 등은 사업 공고시에 변경될 수 있음을 양지하여 주시기 바랍니다. 그리고 앞서 말씀드린 바와 같이 사업별 주요 평가 항목은 본 자료뿐만 아니라 사업 공고시 안내하는 신청 요광에도 명시되어 있으니까 과제 신청하실 때 신청하고자 하는 사업의 평가 항목을 꼭 확인하시고 신청하시기 바랍니다. 이상 평가 제도에 대한 설명을 마치겠습니다. 경청해 주셔서 감사합니다.", "source_blocks": [218, 219, 220, 221, 222], "bullets": ["지금까지 과기부 소관 사업에 대한 설명을 드렸고 다음은 교육부 소관 사업에 대해 말씀드리겠습니다.", "학술 연구 인재 육성 사업 중에 석사 과정 연구 장려금은 전문 평가당에 의한 토론 평가 방식으로 그리고 박사 과정 연구 장여금과 박사 국내 연수, 국계 연수는 온라인 평가 방식으로 평가를 진행할 내용 계획입니다.", "동일 내역 사업 중에 기본 연구 포형은 온라인 평가 방식으로 그리고 미래도전 연구 지원과 보호 연구는 토론 평가 방식으로 진행할 예정입니다.", "지역 중심 혁신 지원 중에서 글로컬 랩은 1차 토론 평가와 2차 발표 평가의 방식으로 진행될 예정입니다. 글로컬 R&D 지원은 온라인 평가로 진행될 예정입니다.", "참고로 교육부 소관 사업은 현재 사업 종합 계획이 미확정 상태이기 때문에 화면에서 보시고 계시는 평가 방식이나 항목 배점 등은 사업 공고시에 변경될 수 있음을 양지하여 주시기 바랍니다.", "그리고 앞서 말씀드린 바와 같이 사업별 주요 평가 항목은 본 자료뿐만 아니라 사업 공고시 안내하는 신청 요광에도 명시되어 있으니까 과제 신청하실 때 신청하고자 하는 사업의 평가 항목을 꼭 확인하시고 신청하시기 바랍니다. 이상 평가 제도에 대한 설명을 마치겠습니다. 경청해 주셔서 감사합니다."]}], "summary": ["온라인 서면·토론·발표·심층 평가의 차이와 사업별 평가 절차를 설명합니다.", "평가 항목과 가중치는 사업 유형마다 다르며, 혁신성과 도전성을 고려하는 방향을 안내합니다.", "한우물 파기·전략형·기초연구실 등의 평가 방식 변경을 설명합니다. 최종 기준은 해당 사업 신청 요강에서 확인해야 합니다."]}, {"id": "Z09", "title": "개인 연구 FAQ", "start": 4439, "end": 5505, "paragraphs": [{"id": "Z09-P01", "title": "출연연 소속 연구자 제한과 리더 연구 신청", "start": 4439, "end": 4611, "text": "다음은 2027년도 사업 추진과 관련하여 연구자분들께서 궁금해하실 질의 사항에 대한 FAQ 답변 시간을 갖도록 하겠습니다. 먼저 개인 연구 관련 질의 사항에 대해 한국연구재단 개인 연구지원 팀 임무군 팀장이 발표하겠습니다. 지금부터는 개인 연구지원 사업 FQ에 대해서 말씀드리도록 하겠습니다. 첫 번째는 공통 사항으로 올해 내년 신규 접수부터 PBS 폐지된 출연연 소속 연구자 신청이 제한이 되고 있는데 그거 관련된 질문이고 그래서 PBS 폐지된 출연연 소자의 신규 과제 신청 또는 기존의 과제 수행 중인 PBS 폐지된 기간으로 이직씩 과제에 수행이 가능한가요라는 질문이 입니다. 습니다. 답변은 PBS 폐지된 출연연은 신규과제 신청은 불과하고 기존에 과제 수행 중인 분들은 PBAS 폐지된 출연연으로 이직할 경우에 2026년 올해 2차 신규 과제에 선정해서 수행 중인 과제는 중단을 해야 되고 그리고 올해 2차 이전 1차 이전에 선정된 연구자는 과제 2후 과제 수행이 가능합니다. 여기서 올해 2차 신규 과제 선정되신 분들도 과제 중단은 되는데 정당한 사유의 과제 중단 처리될 예정입니다. 단 앞서 핵심 연구 쪽에서도 설명을 드리긴 했는데 개인 기초연구 2차 공고에 나올 예정인 핵심 전략형에는 PBS 폐지된 출연연 연구자분들도 신청이 가능합니다. 다음은 리더 연구 관련된 FAQ입니다. 첫 번째 질문은 현재 개인 기초연구를 수행 중에 있는데 리더 연구 신규 과제를 신청할 수 있나요이이고 답변은 수행 중인 과제가 신규 과제 개시일 그러니까 리더 연구 같은 경우는 아까 말씀드렸듯이 내년도 6월 1일 개시일인데 개시일로부터 10개월 이내 최종 종료되는 경우에는 기존에 수행하시는 분들도 신청이 가능합니다. 그리고 리더에서 유형 B의 경우는 기존에 리더 현재 수행 중이신 분들도 27년 3단계 진입 예정인 분들은 기존 리더 연구를 수행 중이셔도 추가로 신청이 가능합니다. 여기 신청을 하시고 선정까지 되시면 역시 정당한 사유에 의한 과제 중단 처리될 예정입니다.", "source_blocks": [223, 224, 225, 226, 227], "bullets": ["다음은 2027년도 사업 추진과 관련하여 연구자분들께서 궁금해하실 질의 사항에 대한 FAQ 답변 시간을 갖도록 하겠습니다. 먼저 개인 연구 관련 질의 사항에 대해 한국연구재단 개인 연구지원 팀 임무군 팀장이 발표하겠습니다. 지금부터는 개인 연구지원 사업 FQ에 대해서 말씀드리도록 하겠습니다.", "첫 번째는 공통 사항으로 올해 내년 신규 접수부터 PBS 폐지된 출연연 소속 연구자 신청이 제한이 되고 있는데 그거 관련된 질문이고 그래서 PBS 폐지된 출연연 소자의 신규 과제 신청 또는 기존의 과제 수행 중인 PBS 폐지된 기간으로 이직씩 과제에 수행이 가능한가요라는 질문이 입니다. 습니다.", "답변은 PBS 폐지된 출연연은 신규과제 신청은 불과하고 기존에 과제 수행 중인 분들은 PBAS 폐지된 출연연으로 이직할 경우에 2026년 올해 2차 신규 과제에 선정해서 수행 중인 과제는 중단을 해야 되고 그리고 올해 2차 이전 1차 이전에 선정된 연구자는 과제 2후 과제 수행이 가능합니다. 여기서 올해 2차 신규 과제 선정되신 분들도 과제 중단은 되는데 정당한 사유의 과제 중단 처리될 예정입니다.", "단 앞서 핵심 연구 쪽에서도 설명을 드리긴 했는데 개인 기초연구 2차 공고에 나올 예정인 핵심 전략형에는 PBS 폐지된 출연연 연구자분들도 신청이 가능합니다.", "다음은 리더 연구 관련된 FAQ입니다. 첫 번째 질문은 현재 개인 기초연구를 수행 중에 있는데 리더 연구 신규 과제를 신청할 수 있나요이이고 답변은 수행 중인 과제가 신규 과제 개시일 그러니까 리더 연구 같은 경우는 아까 말씀드렸듯이 내년도 6월 1일 개시일인데 개시일로부터 10개월 이내 최종 종료되는 경우에는 기존에 수행하시는 분들도 신청이 가능합니다.", "그리고 리더에서 유형 B의 경우는 기존에 리더 현재 수행 중이신 분들도 27년 3단계 진입 예정인 분들은 기존 리더 연구를 수행 중이셔도 추가로 신청이 가능합니다. 여기 신청을 하시고 선정까지 되시면 역시 정당한 사유에 의한 과제 중단 처리될 예정입니다."]}, {"id": "Z09-P02", "title": "보직 수행·핵심 연구 중복 신청·도약형", "start": 4611, "end": 4828, "text": "두 번째는 현재 학례 보직을 수행 중인데 리더 연구 지원이 가능한가요이고 답변은 보직을 현재 수행 중인 연구자가 리더 연구에 선정된 경우에는 연구 개시일 이후 2개월 이내에 2개월 이내에 전문 기간에 보직 수행 승인을 받으셔야 합니다. 다음은 핵심 연구 유형 CBA에 관한 FAQ입니다. 첫 번째는 1차 상반기에 핵심 연구에 신청하면 2차 하반기에 핵심 연구 신청이 불가한가요이고 답변은 1차에 신청을 하셨더라도 선정이 되지 않으셨다면 당연히 2차에 공고되는 기본 연구 BA 전략형에 신청이 가능합니다. 그다음 두 번째는 리더 연구하고 핵심리형 C B 그리고 도약형 중 한 개는 중복 신청이 가능한가요가 질문이 이며 답변은 가능합니다. 리더 연구와 핵심 유형 CBA 그리고 도약형 중 한 개는 예외적으로 동시에 신청이 가능하고 수행이 가능한 거는 아닙니다. 신청이 가능하고 그래서 핵심 연구에가 3월 1일 개시로 먼저 선정 발표가 날 텐데 핵심 연구에 선정이 돼도 리더 연구의 평가 결과를 기 기다렸다가 리더 연구에서 만약에 선정이 되면 리더 연구를 수행하시게 됩니다. 다음은 핵심 연구 도약형에 대한 질문이 입니다. 첫 번째 질문은 올해까지는 핵심 연구 도약형에 유형이 분류돼 있 내년에 도약형 같은 경우는 단일 유형으로 단일 통일이 돼서 연간 연구비는 간접비 포함해서 최대 2.5억 원비는 3년으로 고정 지원된다는 그런 지위와 답변이 입니다. 두 번째는 기초연구 핵심 연구 도약형 지원 대상 사업을 수행 중인 연구자가 올해 2026년에 종료되었을 경우 이번 27년 신규 과제에 신청할 수 있습니까? 신청할 수 없습니다. 도약형은 신청 연도인 2027년에 과제가 종료될 예정인 연구자만 신청할 수 있습니다. 해당 과제가 종료되는 해에 한하여 한 차례 신청 기회를 부여합니다. 그다음 세 번째는 핵심 유형 BC 그리고 신진유형 B 외에 타유형의 연구 책임자도 도약형에 지원이 가능하냐 이러한 질문이 이며 답변은 불가합니다이고 이유는 기존에 후속 연구가 있는 사업 유형이 리더하고 중견하고 우수신진 우수신 중이었는데 그중에서 중견하고 우수신 후속이 도약 약형으로 재개편된 거기 때문에 일관성 유지 차원에서 동일하게 타유형은 도약형에 신청을 할 수 없고 중경과 우수신이 연구 책임자분들이 신청이 가능하게 입니다.", "source_blocks": [228, 229, 230, 231, 232], "bullets": ["두 번째는 현재 학례 보직을 수행 중인데 리더 연구 지원이 가능한가요이고 답변은 보직을 현재 수행 중인 연구자가 리더 연구에 선정된 경우에는 연구 개시일 이후 2개월 이내에 2개월 이내에 전문 기간에 보직 수행 승인을 받으셔야 합니다.", "다음은 핵심 연구 유형 CBA에 관한 FAQ입니다.", "첫 번째는 1차 상반기에 핵심 연구에 신청하면 2차 하반기에 핵심 연구 신청이 불가한가요이고 답변은 1차에 신청을 하셨더라도 선정이 되지 않으셨다면 당연히 2차에 공고되는 기본 연구 BA 전략형에 신청이 가능합니다.", "그다음 두 번째는 리더 연구하고 핵심리형 C B 그리고 도약형 중 한 개는 중복 신청이 가능한가요가 질문이 이며 답변은 가능합니다. 리더 연구와 핵심 유형 CBA 그리고 도약형 중 한 개는 예외적으로 동시에 신청이 가능하고 수행이 가능한 거는 아닙니다. 신청이 가능하고 그래서 핵심 연구에가 3월 1일 개시로 먼저 선정 발표가 날 텐데 핵심 연구에 선정이 돼도 리더 연구의 평가 결과를 기 기다렸다가 리더 연구에서 만약에 선정이 되면 리더 연구를 수행하시게 됩니다.", "다음은 핵심 연구 도약형에 대한 질문이 입니다.", "첫 번째 질문은 올해까지는 핵심 연구 도약형에 유형이 분류돼 있 내년에 도약형 같은 경우는 단일 유형으로 단일 통일이 돼서 연간 연구비는 간접비 포함해서 최대 2.5억 원비는 3년으로 고정 지원된다는 그런 지위와 답변이 입니다.", "두 번째는 기초연구 핵심 연구 도약형 지원 대상 사업을 수행 중인 연구자가 올해 2026년에 종료되었을 경우 이번 27년 신규 과제에 신청할 수 있습니까? 신청할 수 없습니다. 도약형은 신청 연도인 2027년에 과제가 종료될 예정인 연구자만 신청할 수 있습니다. 해당 과제가 종료되는 해에 한하여 한 차례 신청 기회를 부여합니다.", "그다음 세 번째는 핵심 유형 BC 그리고 신진유형 B 외에 타유형의 연구 책임자도 도약형에 지원이 가능하냐 이러한 질문이 이며 답변은 불가합니다이고 이유는 기존에 후속 연구가 있는 사업 유형이 리더하고 중견하고 우수신진 우수신 중이었는데 그중에서 중견하고 우수신 후속이 도약 약형으로 재개편된 거기 때문에 일관성 유지 차원에서 동일하게 타유형은 도약형에 신청을 할 수 없고 중경과 우수신이 연구 책임자분들이 신청이 가능하게 입니다."]}, {"id": "Z09-P03", "title": "한우물 파기 신청 자격과 기존 과제", "start": 4828, "end": 4945, "text": "다음은 한우물 파기 기초연구의 FAQ입니다. 대학 소속 비정규직 연구원도 지원할 수 있는지에 대한 질문입니다. 예를 들어 산학협력단이나 대학 부설 연구소 소속 비정규직 연구원, 박사후연구원도 신청할 수 있습니다. 그래서 다만 아까 말씀드렸듯이 한우물 파기 기초연구는 박사학위 취득 후 2 15년 이내라는 그러니까 연도 기준으로는 2012년 1월 1일 이후에 박사학위를 취득하신 분들이 하나요. 신청이 가능하겠습니다. 두 번째는 현재 교육부소관 개인 기초연구를 수행 중인데 최종 종료 시기에 관계 없이 한우물 파기 기초연구의 신청이 가능한가요입니다. 질문은 아까 앞단에서 한우물 파기 기초연구 파트에서 설명을 드릴 때 기존의 수행 중인 과제의 최종 종료 시계의 관계 없이 한우물 파기 기초 연금이 신청이 가능하다고 말씀을 드렸는데 그거는 과기부 소관 과기부 소관 개인기초 기초연구에 해당이 되는 내용이고 만약에 지금 현재 교육부소관 기초연구 과제를 수행 중이시라면 최종 종료율이 2027년 12월 30일 이전일 경우에만 신청이 가능합니다. 그래서 교육부 소관 개인기초연구 사업을 현재 수행 중이신 분들은 27년 12월 말일까지 최종 종료되는 과제에 한해서 제 한우물 파기 기초연구에 신청이 가능합니다. 말씀드렸듯이 과기 부소관 개인 기초연구는 종료 최종 종료 시계 관계 없이 신청이 가능합니다.", "source_blocks": [233, 234, 235], "bullets": ["다음은 한우물 파기 기초연구의 FAQ입니다. 대학 소속 비정규직 연구원도 지원할 수 있는지에 대한 질문입니다. 예를 들어 산학협력단이나 대학 부설 연구소 소속 비정규직 연구원, 박사후연구원도 신청할 수 있습니다.", "그래서 다만 아까 말씀드렸듯이 한우물 파기 기초연구는 박사학위 취득 후 2 15년 이내라는 그러니까 연도 기준으로는 2012년 1월 1일 이후에 박사학위를 취득하신 분들이 하나요. 신청이 가능하겠습니다.", "두 번째는 현재 교육부소관 개인 기초연구를 수행 중인데 최종 종료 시기에 관계 없이 한우물 파기 기초연구의 신청이 가능한가요입니다. 질문은 아까 앞단에서 한우물 파기 기초연구 파트에서 설명을 드릴 때 기존의 수행 중인 과제의 최종 종료 시계의 관계 없이 한우물 파기 기초 연금이 신청이 가능하다고 말씀을 드렸는데 그거는 과기부 소관 과기부 소관 개인기초 기초연구에 해당이 되는 내용이고 만약에 지금 현재 교육부소관 기초연구 과제를 수행 중이시라면 최종 종료율이 2027년 12월 30일 이전일 경우에만 신청이 가능합니다. 그래서 교육부 소관 개인기초연구 사업을 현재 수행 중이신 분들은 27년 12월 말일까지 최종 종료되는 과제에 한해서 제 한우물 파기 기초연구에 신청이 가능합니다.", "말씀드렸듯이 과기 부소관 개인 기초연구는 종료 최종 종료 시계 관계 없이 신청이 가능합니다."]}, {"id": "Z09-P04", "title": "전략형과 기본 연구의 신청 자격", "start": 4945, "end": 5050, "text": "다음은 핵심 연구 전략에 대한 질문이 이며 질문은 전략형에는 PBS 폐지 출연연 연구자도 지원 가능한가요이고 답변은 가능합니다. 그래서 전략 같은 경우는 국가 전략 기술, 전략 기술 및 미래 유망 분야 등 국가 사회적 수요에 대응하기 위해 기획된 유형이라서 예외적으로 출연연 연구원 분들도 가지 신청 및 수행이 가능합니다. 참고로 전략형은 하반기 9월 1일 개시 예정입니다. 다음은 핵심 연구 중 기본 연구 B·A에 대한 질문입니다. 참고로 3월 하반기 9월 1일 개시 유형들이라서 3월 정도의 공고 예정에 있고 그중 첫 번째 질문은 지방소재 연구자의 정의가 어떻게 됩니까 답변은 서울인천 경기 지역 연구 기관하고 그다음에 사대 과기연하고 포항공대는 재외가 되고 그러니까 지역 외관으로 분류가 됩니다. 그리고 고등교육법 24조에 의한 분교 중에서 서울인청 경기 지역 외에 분류되는 기간이 지역의 대학이나 지역 연구 기간으로 해당이 되고 그래서 이런 분교가 다섯 개 우리나라에 다섯 개 있는 걸로 아는데 그래서 예를 들면 한양대 에리카 캠퍼스 같은 경우는 법에 의해서 분교로 분류가 되지만 소재지가 수도권이라서 지역 기관에 해당되지 않습니다.", "source_blocks": [236, 237, 238], "bullets": ["다음은 핵심 연구 전략에 대한 질문이 이며 질문은 전략형에는 PBS 폐지 출연연 연구자도 지원 가능한가요이고 답변은 가능합니다. 그래서 전략 같은 경우는 국가 전략 기술, 전략 기술 및 미래 유망 분야 등 국가 사회적 수요에 대응하기 위해 기획된 유형이라서 예외적으로 출연연 연구원 분들도 가지 신청 및 수행이 가능합니다. 참고로 전략형은 하반기 9월 1일 개시 예정입니다.", "다음은 핵심 연구 중 기본 연구 B·A에 대한 질문입니다.", "참고로 3월 하반기 9월 1일 개시 유형들이라서 3월 정도의 공고 예정에 있고 그중 첫 번째 질문은 지방소재 연구자의 정의가 어떻게 됩니까 답변은 서울인천 경기 지역 연구 기관하고 그다음에 사대 과기연하고 포항공대는 재외가 되고 그러니까 지역 외관으로 분류가 됩니다.", "그리고 고등교육법 24조에 의한 분교 중에서 서울인청 경기 지역 외에 분류되는 기간이 지역의 대학이나 지역 연구 기간으로 해당이 되고 그래서 이런 분교가 다섯 개 우리나라에 다섯 개 있는 걸로 아는데 그래서 예를 들면 한양대 에리카 캠퍼스 같은 경우는 법에 의해서 분교로 분류가 되지만 소재지가 수도권이라서 지역 기관에 해당되지 않습니다."]}, {"id": "Z09-P05", "title": "대학병원·신진 연구 자격과 우대", "start": 5050, "end": 5198, "text": "그다음에는 대학 병원 소속. 두 번째는 대학 병원 소속인 경우 기본 연구에 신청이 가능합니까이고 답변은 대학이 병원하고 대학하고 별도 법인으로 설립이 된 기간이고 병원에서 연구이 중앙 관리가 가능하다면 하반기에 있을 기본 연구 B하고 A에 신청이 가능하겠습니다. 다음은 신진 연구 관련된 FAQ입니다. 첫 번째 질문은 정년 트랙으로 조교수 이상의 지위로 임명된 지 5년 이내지만 비정년 트랙으로 조교수 이상의 지기로 임명된 이력이 있습니다. 신진연구 신청 자격에 해당이 됩니까라는 질문이고 답변은 특정 트랙의 관계 없이 주관 연구 기관의 규정상항 최초 조교수 이상의 지기로 임용된 전임 교원이면 신청이 가능합니다. 그다음 두 번째는 세종 국내 트랙을 수행한 연구자가 신진 유형비 신규 과제 신청했을 때 후속 연구 연계 등의 우대 사항이 있나요라는 질문이고 앞쪽에서 설명을 드리긴 했지만 세종 국내트랙을 수행 중이신 분이 연구 책임자께서 전임 교원으로 신분 변동이 있었고 그리고 연구 책임자로 중단 없이 5년간 세종사 5년간 정상 종료를 하는해진 연구 유형 B로 신청하시면 저희가 우대하여서 선정할 예정에 있습니다. 다음은 신진연 신청 출산이나 육가 휴직 기간으로 인해 박사학위 취득 후 7년이 초과되거나 최초 조교소 이상의 지기로 임명된 지 5년 이내라는 그런 자격에 대한 증빙을 공문으로 제출해야 하나요라는 질문이 이며 답변은 반드시 공문으로 제출할 필요는 없고 해당 사항을 가점을 위해서 해당 사항을 증빙자 증빙하고자 하시는 경우에는 신청서 서식에 포함되어 있는 화격서에 첨부를 하셔서 주관기관 승인 마감일까지 아이리스상으로 제출해 주시면 됩니다.", "source_blocks": [239, 240], "bullets": ["그다음에는 대학 병원 소속. 두 번째는 대학 병원 소속인 경우 기본 연구에 신청이 가능합니까이고 답변은 대학이 병원하고 대학하고 별도 법인으로 설립이 된 기간이고 병원에서 연구이 중앙 관리가 가능하다면 하반기에 있을 기본 연구 B하고 A에 신청이 가능하겠습니다.", "다음은 신진 연구 관련된 FAQ입니다. 첫 번째 질문은 정년 트랙으로 조교수 이상의 지위로 임명된 지 5년 이내지만 비정년 트랙으로 조교수 이상의 지기로 임명된 이력이 있습니다. 신진연구 신청 자격에 해당이 됩니까라는 질문이고 답변은 특정 트랙의 관계 없이 주관 연구 기관의 규정상항 최초 조교수 이상의 지기로 임용된 전임 교원이면 신청이 가능합니다.", "그다음 두 번째는 세종 국내 트랙을 수행한 연구자가 신진 유형비 신규 과제 신청했을 때 후속 연구 연계 등의 우대 사항이 있나요라는 질문이고 앞쪽에서 설명을 드리긴 했지만 세종 국내트랙을 수행 중이신 분이 연구 책임자께서 전임 교원으로 신분 변동이 있었고 그리고 연구 책임자로 중단 없이 5년간 세종사 5년간 정상 종료를 하는해진 연구 유형 B로 신청하시면 저희가 우대하여서 선정할 예정에 있습니다.", "다음은 신진연 신청 출산이나 육가 휴직 기간으로 인해 박사학위 취득 후 7년이 초과되거나 최초 조교소 이상의 지기로 임명된 지 5년 이내라는 그런 자격에 대한 증빙을 공문으로 제출해야 하나요라는 질문이 이며 답변은 반드시 공문으로 제출할 필요는 없고 해당 사항을 가점을 위해서 해당 사항을 증빙자 증빙하고자 하시는 경우에는 신청서 서식에 포함되어 있는 화격서에 첨부를 하셔서 주관기관 승인 마감일까지 아이리스상으로 제출해 주시면 됩니다."]}, {"id": "Z09-P06", "title": "지역 장기 연구의 장비 구축과 이직", "start": 5198, "end": 5314, "text": "그다음은 신규 사업은 신진 지역 장기 연구 관련된 FAQ가 이며 첫 번째는 연구 시설 장비 구축 계획이 필수인가요라는 질문이 입니다. 그래서 답변은 반드시 연구 시설 장비 구축 계획이 필수라는 것이고 지역 장기 연구는 연구 초기 그러니까 1에서 2년 차의 연구 시설 장배를 구축하여 구축된 인프라를 기반으로 안정적인 연구를 지원하는 사업으로 장비 구축 계획이 없는 경우에는 신청이 불가능하십니다. 두 번째 질문은 연구시설·장비비의 계상 및 집행 기준입니다. 연구책임자는 1~2차년도에 연구시설·장비비로 총 3억 원 이상을 의무적으로 계상해야 하며, 계상한 3억 원은 2차년도 종료일까지 반드시 집행해야 합니다. 그다음 지역 장기 연구 수행 중에 이직할 경우 계속해서 과제를 수행할 수 있나요라는 질문이 이며음 지역 장기 연구는 이직한 곳이 국내 지역 대학일 경우에 한해서 계속 수행이 가능합니다. 이 부분은 아까 신진 지역 장기 연구 사업 설명 파트에서도 말씀드리긴 했는데 국내 지역 대학으로 이직할 경우에만 국내 지역에는 연구소는 포함이 안 되고 반드시 지역 대학으로 이직할 경우에 계속해서 과제를 수행할 수 있게 됩니다. 그래서 여기서도 국내 지역 대학 외 기관으로 이직할 시에는 정당한 사회에 해당하지 않는 수행 포기로 간주돼서 참여 제한 등의 제재 조치가 있을 예정입니다.", "source_blocks": [241, 242, 243], "bullets": ["그다음은 신규 사업은 신진 지역 장기 연구 관련된 FAQ가 이며 첫 번째는 연구 시설 장비 구축 계획이 필수인가요라는 질문이 입니다. 그래서 답변은 반드시 연구 시설 장비 구축 계획이 필수라는 것이고 지역 장기 연구는 연구 초기 그러니까 1에서 2년 차의 연구 시설 장배를 구축하여 구축된 인프라를 기반으로 안정적인 연구를 지원하는 사업으로 장비 구축 계획이 없는 경우에는 신청이 불가능하십니다.", "두 번째 질문은 연구시설·장비비의 계상 및 집행 기준입니다. 연구책임자는 1~2차년도에 연구시설·장비비로 총 3억 원 이상을 의무적으로 계상해야 하며, 계상한 3억 원은 2차년도 종료일까지 반드시 집행해야 합니다.", "그다음 지역 장기 연구 수행 중에 이직할 경우 계속해서 과제를 수행할 수 있나요라는 질문이 이며음 지역 장기 연구는 이직한 곳이 국내 지역 대학일 경우에 한해서 계속 수행이 가능합니다. 이 부분은 아까 신진 지역 장기 연구 사업 설명 파트에서도 말씀드리긴 했는데 국내 지역 대학으로 이직할 경우에만 국내 지역에는 연구소는 포함이 안 되고 반드시 지역 대학으로 이직할 경우에 계속해서 과제를 수행할 수 있게 됩니다. 그래서 여기서도 국내 지역 대학 외 기관으로 이직할 시에는 정당한 사회에 해당하지 않는 수행 포기로 간주돼서 참여 제한 등의 제재 조치가 있을 예정입니다."]}, {"id": "Z09-P07", "title": "세종과학 펠로우십: 체류·개시·소속 기관", "start": 5314, "end": 5505, "text": "다음은 세종과학 펠로우십에 대한 FAQ가 이며 첫 번째는 과제 수행 중 국내국의 체류 기준 즉 국내국에 파견이나 체료를 할 수가 있는데 그거에 대한 기준이 어떻게 되나요라는 질문이고 답변을 드리면 국내 및 복귀 유치 트랙 모두 최대 1년으로 제안을 하고 있는데 그거를 그거에 대한 기준은 출입국 사실 증명서에 출국일라고 입구기를 기준으로 저희가 산정을 하고 있고 단 복귀 유치 트랙은 연구개발 계획서에 1년 이상 파견 계획이 명시되어 있고 부 국에서 필요성이 명백한 경우에 한해서 초과해서 나가실 수 있게 저희가 그렇게 해 드리고 있습니다. 복귀·유치 트랙도 1차 공고의 다른 사업과 동일하게 3월에 개시하는지에 대한 질문입니다. 복귀·유치 트랙은 연구책임자의 입국 준비 기간을 고려하여 상반기에 선정을 마치더라도 연구는 9월 1일에 개시할 예정입니다. 마지막 질문은 국내 및 복귀·유치 트랙에 신청할 때 소속 기관이 없는 경우의 신청 방법입니다. 연구 개시일을 기준으로 소속될 기관이 확정되어 있다면, 해당 기관을 주관 연구기관으로 신청하면 됩니다. 소속 예정 기관이 없거나 현재 과제 신청이 불가능한 기관에 소속되어 있는 경우에도 한국연구재단을 주관기관으로 지정하여 신청할 수 있습니다. 다만 이 방식으로 신청한 경우 국내 트랙은 연구 개시일인 3월 1일부터 6개월 이내에, 복귀·유치 트랙은 연구 개시일인 9월 1일 전에 주관 연구기관을 확정하고 한국연구재단의 심의를 받아야 합니다. 이를 이행하지 않으면 선정이 취소됩니다. 이상으로 개인기 연구 FQ 설명을 마치겠습니다. 감사합니다.", "source_blocks": [244, 245, 246, 247], "bullets": ["다음은 세종과학 펠로우십에 대한 FAQ가 이며 첫 번째는 과제 수행 중 국내국의 체류 기준 즉 국내국에 파견이나 체료를 할 수가 있는데 그거에 대한 기준이 어떻게 되나요라는 질문이고 답변을 드리면 국내 및 복귀 유치 트랙 모두 최대 1년으로 제안을 하고 있는데 그거를 그거에 대한 기준은 출입국 사실 증명서에 출국일라고 입구기를 기준으로 저희가 산정을 하고 있고 단 복귀 유치 트랙은 연구개발 계획서에 1년 이상 파견 계획이 명시되어 있고 부 국에서 필요성이 명백한 경우에 한해서 초과해서 나가실 수 있게 저희가 그렇게 해 드리고 있습니다.", "복귀·유치 트랙도 1차 공고의 다른 사업과 동일하게 3월에 개시하는지에 대한 질문입니다. 복귀·유치 트랙은 연구책임자의 입국 준비 기간을 고려하여 상반기에 선정을 마치더라도 연구는 9월 1일에 개시할 예정입니다.", "마지막 질문은 국내 및 복귀·유치 트랙에 신청할 때 소속 기관이 없는 경우의 신청 방법입니다. 연구 개시일을 기준으로 소속될 기관이 확정되어 있다면, 해당 기관을 주관 연구기관으로 신청하면 됩니다. 소속 예정 기관이 없거나 현재 과제 신청이 불가능한 기관에 소속되어 있는 경우에도 한국연구재단을 주관기관으로 지정하여 신청할 수 있습니다.", "다만 이 방식으로 신청한 경우 국내 트랙은 연구 개시일인 3월 1일부터 6개월 이내에, 복귀·유치 트랙은 연구 개시일인 9월 1일 전에 주관 연구기관을 확정하고 한국연구재단의 심의를 받아야 합니다. 이를 이행하지 않으면 선정이 취소됩니다. 이상으로 개인기 연구 FQ 설명을 마치겠습니다. 감사합니다."]}], "summary": ["출연연 소속 연구자의 신청 제한, 리더 연구와 핵심 연구의 중복 신청, 도약형 신청 자격을 질문·답변으로 설명합니다.", "한우물 파기·기본 연구·신진 연구의 자격과 우대, 지역 장기 연구의 장비 구축 및 이직 조건을 다룹니다.", "세종과학 펠로우십은 체류 기준·연구 개시 시점·소속 기관 확정 기한을 확인해야 하며, 소속이 없는 경우의 신청 방법도 안내합니다."]}, {"id": "Z10", "title": "집단 연구 FAQ", "start": 5506, "end": 5841, "paragraphs": [{"id": "Z10-P01", "title": "공동 연구진과 참여 연구원 자격", "start": 5506, "end": 5594, "text": "다음으로 집단 연구 관련 질의 사항에 대해 한국연구재단 집단 연구 지원 팀 이다원 팀장이 발표하겠습니다. 집단연구 지원 사업 FAQ입니다. 첫 번째 질문은 공동 연구진과 참여 연구원 공동은 어떤 차이가 있나요입니다. 국가 연구 개발 사업 연구개발비 사용 기준 제2조에 따른 참여 연구자는 연구 책임자와 학생 연구자를 포함해서 해당 과제에 참여하는 모든 연구자를 의미합니다. 다만 공동 연구진과 참여 연구원 공동은 집단 연구의 특성을 고려하여 활용하고 있습니다. 공동연구지는 연구 책임자와 참여공 참여 연구원 공동으로 구성되어 있고요. 참여 연구원 공동은 사업에서 정한 참여 자격을 충족해야 하거나 신청 과제 수 제한이나 성과 목표 관리제에 따른 수행 기간 유지 등을 적용받습니다. 참여 연구원 공동의 자격을 살펴보면요. 미래 연구 센터는 국내회, 대학 소속, 전임, 비전임 교원 또는 국내외, 공공 민간 연구소의 선임 연구원 이상입니다. 기초연구실은 국내외 대학 소속 전임, 비전임 연구원입니다. 표에서 보시는 바와 같이 사업별로 공동 연구진 수를 제시하고 있습니다. 공동 연구진 중 연구 책임자를 제외하면 제외한 인원이 참여 연구원 공동에 해당됩니다.", "source_blocks": [248, 249, 250, 251, 252, 253, 254, 255], "bullets": ["다음으로 집단 연구 관련 질의 사항에 대해 한국연구재단 집단 연구 지원 팀 이다원 팀장이 발표하겠습니다. 집단연구 지원 사업 FAQ입니다.", "첫 번째 질문은 공동 연구진과 참여 연구원 공동은 어떤 차이가 있나요입니다. 국가 연구 개발 사업 연구개발비 사용 기준 제2조에 따른 참여 연구자는 연구 책임자와 학생 연구자를 포함해서 해당 과제에 참여하는 모든 연구자를 의미합니다.", "다만 공동 연구진과 참여 연구원 공동은 집단 연구의 특성을 고려하여 활용하고 있습니다. 공동연구지는 연구 책임자와 참여공 참여 연구원 공동으로 구성되어 있고요. 참여 연구원 공동은 사업에서 정한 참여 자격을 충족해야 하거나 신청 과제 수 제한이나 성과 목표 관리제에 따른 수행 기간 유지 등을 적용받습니다.", "참여 연구원 공동의 자격을 살펴보면요. 미래 연구 센터는 국내회, 대학 소속, 전임, 비전임 교원 또는 국내외, 공공 민간 연구소의 선임 연구원 이상입니다.", "기초연구실은 국내외 대학 소속 전임, 비전임 연구원입니다.", "표에서 보시는 바와 같이 사업별로 공동 연구진 수를 제시하고 있습니다. 공동 연구진 중 연구 책임자를 제외하면 제외한 인원이 참여 연구원 공동에 해당됩니다."]}, {"id": "Z10-P02", "title": "연구진 변경과 개인·집단 과제 병행", "start": 5594, "end": 5671, "text": "두 번째 질문입니다. 미래 연구 센터와 기초연구실 신규 과제 선정 후여 연구원 공동이 변경되면 불이익이 있나요? 답변입니다. 앞서 설명드린 것처럼 참여 연구원 공동은 성과 목표 관리제 등에 따라서 관리가 되고 있는 인력입니다. 따라서 1차년도 연구 기간 내에 참여 연구원 공동의 변경이 있는 경우 차년도 연구비의 20%가 삭감됩니다. 세 번째 질문입니다. 기초 개인 연구 사업 연구 책임자로 과제를 수행하고 있습니다. 집단 연구 사업에 지원 가능한가요? 기초 개인 연구 사업 연구 책임자는 집단 과제의 연구 책임자 또는 참여 연구원 공동으로 한 과제 추가 수행이 가능합니다. 다만 리더 연구 책임자는 수행 중인 과제가 신규 과제 개실로부터 10개월 이내인 2028년 5월 31일 이내 최종 종료되는 경우에만 집단 연구 사업의 연구 책임자로 신청 가능합니다. 번째 질문입니다. 미래 연구센터 공동연구진 의로 과제를 수행 중입니다. 국가 연구소의 연구 책임자로 지원이 가능합니 한한가요?", "source_blocks": [256, 257, 258], "bullets": ["두 번째 질문입니다. 미래 연구 센터와 기초연구실 신규 과제 선정 후여 연구원 공동이 변경되면 불이익이 있나요? 답변입니다. 앞서 설명드린 것처럼 참여 연구원 공동은 성과 목표 관리제 등에 따라서 관리가 되고 있는 인력입니다. 따라서 1차년도 연구 기간 내에 참여 연구원 공동의 변경이 있는 경우 차년도 연구비의 20%가 삭감됩니다.", "세 번째 질문입니다. 기초 개인 연구 사업 연구 책임자로 과제를 수행하고 있습니다. 집단 연구 사업에 지원 가능한가요?", "기초 개인 연구 사업 연구 책임자는 집단 과제의 연구 책임자 또는 참여 연구원 공동으로 한 과제 추가 수행이 가능합니다.", "다만 리더 연구 책임자는 수행 중인 과제가 신규 과제 개실로부터 10개월 이내인 2028년 5월 31일 이내 최종 종료되는 경우에만 집단 연구 사업의 연구 책임자로 신청 가능합니다.", "번째 질문입니다. 미래 연구센터 공동연구진 의로 과제를 수행 중입니다. 국가 연구소의 연구 책임자로 지원이 가능합니 한한가요?"]}, {"id": "Z10-P03", "title": "국가연구소·미래연구센터 신청 예외", "start": 5671, "end": 5755, "text": "답변입니다. 원칙적으로 집단 연구 과제를 수행 중인 연구 책임자 또는 참여 연구원 공동은 신규 과제 신청이 불가능합니다. 다만 국가연구소 연구 책임자로 신청할 경우 제한적으로 예외를 허용하고 있습니다. 미래선도 연구센터 연구 책임자는 단계 종료를 고려해서 2028년에 후속 단계가 개시되는 과제에 하나하여 신청할 수 있고요. 미래선도 연구 센터 참력 연구원 공동은 모두 신청 가능합니다. 또한 기초연구실은 연구 책임자 참여 연구원 공동 모두 신청하실 수 있고요. 단계가 없기 때문에 별도로 제한을 받지 않습니다. 다섯 번째 질문입니다. 국가 연구소 참여 연구원 공동으로 과제를 수행 중인 경우 미래 연구 센터 신규 과제에 신청할 수 있나요? 답변을 먼저 드리면 신청할 수 없습니다. 앞서 설명드린 바와 같이 집단 연구 과제를 수행 중인 연구 책임자 또는 참여 연구원 공동은 원칙적으로 신규과제 신청이 한 과제로 제한되고요. 미래 연구 센터는 별도에 예외 없이 해당 기준을 적용하고 있습니다. 따라서 국가 연구소 과제를 수행하고 있는 연구 책임자 및 참여 연구원 공동은 미래 연구 센터 신규 과제에 신청하실 수 없습니다.", "source_blocks": [259, 260, 261, 262], "bullets": ["답변입니다. 원칙적으로 집단 연구 과제를 수행 중인 연구 책임자 또는 참여 연구원 공동은 신규 과제 신청이 불가능합니다.", "다만 국가연구소 연구 책임자로 신청할 경우 제한적으로 예외를 허용하고 있습니다. 미래선도 연구센터 연구 책임자는 단계 종료를 고려해서 2028년에 후속 단계가 개시되는 과제에 하나하여 신청할 수 있고요. 미래선도 연구 센터 참력 연구원 공동은 모두 신청 가능합니다.", "또한 기초연구실은 연구 책임자 참여 연구원 공동 모두 신청하실 수 있고요. 단계가 없기 때문에 별도로 제한을 받지 않습니다.", "다섯 번째 질문입니다. 국가 연구소 참여 연구원 공동으로 과제를 수행 중인 경우 미래 연구 센터 신규 과제에 신청할 수 있나요? 답변을 먼저 드리면 신청할 수 없습니다.", "앞서 설명드린 바와 같이 집단 연구 과제를 수행 중인 연구 책임자 또는 참여 연구원 공동은 원칙적으로 신규과제 신청이 한 과제로 제한되고요. 미래 연구 센터는 별도에 예외 없이 해당 기준을 적용하고 있습니다. 따라서 국가 연구소 과제를 수행하고 있는 연구 책임자 및 참여 연구원 공동은 미래 연구 센터 신규 과제에 신청하실 수 없습니다."]}, {"id": "Z10-P04", "title": "신진 연구 인력과 동시 수행 제한", "start": 5755, "end": 5841, "text": "여섯 번째입니다. 집단 연구 사업 신진 연구인 인력 기준이 무엇인가요? 신진 연구 인력은 박사학위 취득 후 7년 이내인 연구자, 만 39세 이하인 연구자, 또는 최초 조교수 이상 직위로 임용된 지 5년 이내인 연구자를 의미합니다. 상세 기준은 자료를 참고해 주시기 바랍니다. 기초연구실에서는 신진 연구 인력이 공동 연구진의 필수 구성원입니다. 따라서 접수 시점에 포함되지 않을 경우 요건 탈락됩니다. 심화형에는 신진 연구 인력이 한 명 이상, 혁신형에는 두 명 이상이므로 신청 시 유의하여 주시기 바랍니다. 마지막 질문입니다. 현재 다른 국가연구 개발 사업의 연구 책임자로 두 가지를 수행하고 있습니다. 미래 연구센터 연구 책임자로 신청 가능한가요? 답변입니다. 신청할 수 없습니다. 미래 연구 센터에 선정되면 다른 국가 연구 개발 사업 연구 책임자로 한개까지만 수행 가능합니다. 그러나 수행하시고 있는 국가 연구 개발 사업의 과제가 연구 개시일인 2028년 8월 1일 기준으로 10개월 이내의 최종 종료가 되면 신청 가능하십니다. 이것으로 집단 연구 지원 사업의 FAQ를 마치겠습니다. 감사합니다.", "source_blocks": [263, 264, 265, 266, 267], "bullets": ["여섯 번째입니다. 집단 연구 사업 신진 연구인 인력 기준이 무엇인가요?", "신진 연구 인력은 박사학위 취득 후 7년 이내인 연구자, 만 39세 이하인 연구자, 또는 최초 조교수 이상 직위로 임용된 지 5년 이내인 연구자를 의미합니다. 상세 기준은 자료를 참고해 주시기 바랍니다. 기초연구실에서는 신진 연구 인력이 공동 연구진의 필수 구성원입니다.", "따라서 접수 시점에 포함되지 않을 경우 요건 탈락됩니다. 심화형에는 신진 연구 인력이 한 명 이상, 혁신형에는 두 명 이상이므로 신청 시 유의하여 주시기 바랍니다.", "마지막 질문입니다. 현재 다른 국가연구 개발 사업의 연구 책임자로 두 가지를 수행하고 있습니다. 미래 연구센터 연구 책임자로 신청 가능한가요?", "답변입니다. 신청할 수 없습니다. 미래 연구 센터에 선정되면 다른 국가 연구 개발 사업 연구 책임자로 한개까지만 수행 가능합니다. 그러나 수행하시고 있는 국가 연구 개발 사업의 과제가 연구 개시일인 2028년 8월 1일 기준으로 10개월
