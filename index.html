합니다. 개인 기초연구사업은 11월 5일에 공고되었으며, 집단 연구사업은 추후 별도로 공고될 예정입니다. 설명회가 끝날 때까지 전용 플랫폼에서 질문을 접수합니다. 궁금한 사항을 게시판에 남겨 주시면 검토 후 이메일로 답변드리겠습니다. 만족도 조사에 보내 주신 의견도 향후 사업 운영에 참고하겠습니다. 발표에 앞서 과학기술정보통신부 기초연구진흥과장의 인사말이 있겠습니다.", "source_blocks": [1, 2, 3], "bullets": ["지금부터 2027년도 기초연구사업 설명회를 시작하겠습니다. 사회를 맡은 한국연구재단 기초연구 총괄실장입니다. 바쁘신 가운데 온라인 설명회에 함께해 주신 연구자 여러분께 진심으로 감사드립니다.", "오늘 설명회에서는 2027년도 기초연구사업의 주요 추진 방향과 세부 지원 내용을 안내합니다. 개인 기초연구사업은 11월 5일에 공고되었으며, 집단 연구사업은 추후 별도로 공고될 예정입니다.", "설명회가 끝날 때까지 전용 플랫폼에서 질문을 접수합니다. 궁금한 사항을 게시판에 남겨 주시면 검토 후 이메일로 답변드리겠습니다. 만족도 조사에 보내 주신 의견도 향후 사업 운영에 참고하겠습니다. 발표에 앞서 과학기술정보통신부 기초연구진흥과장의 인사말이 있겠습니다."]}, {"id": "Z01-P02", "title": "발표 순서와 과기정통부 사업 소개", "start": 75, "end": 110, "text": "안녕하십니까? 과학기술정보통신부 기초연구진흥과장입니다. 2027년 과학기술 분야 기초연구사업 설명회를 시작하겠습니다. 발표 순서는 과학기술정보통신부 기초연구사업 안내, 교육부 이공분야 학술연구지원사업 안내, 기초연구사업 평가제도, FAQ입니다. 먼저 과학기술정보통신부 기초연구사업의 추진 방향을 설명드리겠습니다.", "source_blocks": [4, 5, 6, 7], "bullets": ["안녕하십니까? 과학기술정보통신부 기초연구진흥과장입니다. 2027년 과학기술 분야 기초연구사업 설명회를 시작하겠습니다.", "발표 순서는 과학기술정보통신부 기초연구사업 안내, 교육부 이공분야 학술연구지원사업 안내, 기초연구사업 평가제도, FAQ입니다. 먼저 과학기술정보통신부 기초연구사업의 추진 방향을 설명드리겠습니다."]}], "summary": ["설명회의 진행 순서와 질의 접수 방법을 안내합니다.", "과기정통부·교육부의 사업 안내, 평가제도 설명, FAQ 순으로 진행하며 질문은 별도 플랫폼을 통해 접수합니다."]}, {"id": "Z02", "title": "과기정통부 기초연구 정책과 예산", "start": 110, "end": 798, "paragraphs": [{"id": "Z02-P01", "title": "2027년 중점 추진 방향", "start": 110, "end": 189, "text": "2027년 기초연구는 투자 회복을 넘어, AI와 과학기술의 대도약을 준비하는 대한민국 기초연구 생태계 혁신에 중점을 두고 있습니다. 기본 방향은 장기적이고 안정적인 지원, 창의적이고 도전적인 연구 투자 강화, 연구 성과의 책임성을 높이는 지원 시스템 혁신입니다. 중점 추진 과제는 기초연구 저변 확대와 견고한 연구 안전망 구축, 청년 연구자 성장 지원, 지역 연구 역량 강화, 세계 최상위 리더급 연구자와 연구 그룹 육성, 집단 연구의 혁신성과 도전성 강화, AI를 활용한 과학 난제 해결 지원입니다. 아울러 질적 성과 중심의 관리, 지원 체계의 전주기 글로벌화, AI 시대의 연구 관리 혁신과 책임성 강화, 평가제도 개선을 추진합니다.", "source_blocks": [8, 9, 10], "bullets": ["2027년 기초연구는 투자 회복을 넘어, AI와 과학기술의 대도약을 준비하는 대한민국 기초연구 생태계 혁신에 중점을 두고 있습니다.", "기본 방향은 장기적이고 안정적인 지원, 창의적이고 도전적인 연구 투자 강화, 연구 성과의 책임성을 높이는 지원 시스템 혁신입니다.", "중점 추진 과제는 기초연구 저변 확대와 견고한 연구 안전망 구축, 청년 연구자 성장 지원, 지역 연구 역량 강화, 세계 최상위 리더급 연구자와 연구 그룹 육성, 집단 연구의 혁신성과 도전성 강화, AI를 활용한 과학 난제 해결 지원입니다.", "아울러 질적 성과 중심의 관리, 지원 체계의 전주기 글로벌화, AI 시대의 연구 관리 혁신과 책임성 강화, 평가제도 개선을 추진합니다."]}, {"id": "Z02-P02", "title": "장기·안정적 지원과 청년 연구자 성장", "start": 189, "end": 310, "text": "장기적이고 안정적인 지원을 통해 기초연구 저변을 확대하고 견고한 연구 안전망을 구축하겠습니다. 내년도 기초연구 예산은 역대 최대인 2.91조 원 규모이며, 약 1.8만 개 과제를 지원할 예정입니다. 이를 바탕으로 지원받는 연구자 수를 지속적으로 확대하겠습니다. 2026년에 복원된 기본 연구의 신규 과제 규모를 유지하고, 연구 기반이 취약한 연구자에 대한 우대를 지속하겠습니다. 청년 연구자 성장을 지원하기 위해 세종과학 펠로우십을 국내 및 복귀·유치 지원 중심으로 개편합니다. 성장 잠재력이 큰 박사후연구원의 연구 기회를 지원하고 신진 연구자 지원 규모도 확대하겠습니다. 신진 연구자 인프라 지원 사업은 평가와 성과 활용 관련 부담을 줄이고, 수행 포기의 정당한 사유를 추가하는 방향으로 개선합니다. 구매 예정 장비의 가격이 대외적 여건으로 20% 이상 상승한 경우를 정당한 사유로 명시하여 제재 부담을 완화하고자 합니다. 우수한 연구가 단절 없이 이어지도록 한우물 파기 과제를 현재 31개에서 내년도 40개로 확대합니다. 우수 성과자가 최대 11년까지 연구를 지속할 수 있도록 후속 과제인 도약형의 지원 기준도 정비했습니다.", "source_blocks": [11, 12, 13, 14, 15, 16, 17], "bullets": ["장기적이고 안정적인 지원을 통해 기초연구 저변을 확대하고 견고한 연구 안전망을 구축하겠습니다. 내년도 기초연구 예산은 역대 최대인 2.91조 원 규모이며, 약 1.8만 개 과제를 지원할 예정입니다. 이를 바탕으로 지원받는 연구자 수를 지속적으로 확대하겠습니다.", "2026년에 복원된 기본 연구의 신규 과제 규모를 유지하고, 연구 기반이 취약한 연구자에 대한 우대를 지속하겠습니다.", "청년 연구자 성장을 지원하기 위해 세종과학 펠로우십을 국내 및 복귀·유치 지원 중심으로 개편합니다. 성장 잠재력이 큰 박사후연구원의 연구 기회를 지원하고 신진 연구자 지원 규모도 확대하겠습니다.", "신진 연구자 인프라 지원 사업은 평가와 성과 활용 관련 부담을 줄이고, 수행 포기의 정당한 사유를 추가하는 방향으로 개선합니다. 구매 예정 장비의 가격이 대외적 여건으로 20% 이상 상승한 경우를 정당한 사유로 명시하여 제재 부담을 완화하고자 합니다.", "우수한 연구가 단절 없이 이어지도록 한우물 파기 과제를 현재 31개에서 내년도 40개로 확대합니다. 우수 성과자가 최대 11년까지 연구를 지속할 수 있도록 후속 과제인 도약형의 지원 기준도 정비했습니다."]}, {"id": "Z02-P03", "title": "지역 연구 역량과 연구거점 강화", "start": 310, "end": 371, "text": "젊고 유망한 연구자가 지역에 유입·정착하여 지역 혁신 역량의 중추로 성장할 수 있도록 지역 장기 연구를 신설합니다. 총 10년간 지원하며, 초기에는 연구 장비를 구축하고 이후에는 이를 활용한 장기 연구를 수행합니다. 뒤의 세부 사업 안내에서는 1차년도 3억 원 내외, 2차년도부터 연 1.5억 원 내외로 설명합니다. 총 100개 과제를 선정할 계획입니다. 지역 장기 연구에 선정되지 않은 연구자가 신진 연구자 인프라 지원 사업에 도전할 수 있도록 해당 사업의 지원 시기를 상반기에서 하반기로 조정합니다. 지역 연구거점 육성을 위해 지역 혁신 미래연구센터 5개를 신규 선정할 계획입니다.", "source_blocks": [18, 19, 20, 21], "bullets": ["젊고 유망한 연구자가 지역에 유입·정착하여 지역 혁신 역량의 중추로 성장할 수 있도록 지역 장기 연구를 신설합니다.", "총 10년간 지원하며, 초기에는 연구 장비를 구축하고 이후에는 이를 활용한 장기 연구를 수행합니다. 뒤의 세부 사업 안내에서는 1차년도 3억 원 내외, 2차년도부터 연 1.5억 원 내외로 설명합니다. 총 100개 과제를 선정할 계획입니다.", "지역 장기 연구에 선정되지 않은 연구자가 신진 연구자 인프라 지원 사업에 도전할 수 있도록 해당 사업의 지원 시기를 상반기에서 하반기로 조정합니다.", "지역 연구거점 육성을 위해 지역 혁신 미래연구센터 5개를 신규 선정할 계획입니다."]}, {"id": "Z02-P04", "title": "리더급 연구자·국가연구소 육성", "start": 372, "end": 423, "text": "세계적 수준의 성과를 창출하고 세계 선도 연구자를 육성하기 위해 리더 연구를 지속적으로 지원합니다. 탑티어급 과제는 내년도에 3개, 유형 A는 10개를 선정할 계획입니다. 국가연구소는 세계 최고 수준의 연구소 육성을 위해 집단 기초연구 중 가장 큰 규모로 지원하는 사업입니다. 효과적인 운영을 위해 현장 컨설팅의 실효성을 높이고 신규 연구소 지원을 지속적으로 확대하겠습니다.", "source_blocks": [22, 23], "bullets": ["세계적 수준의 성과를 창출하고 세계 선도 연구자를 육성하기 위해 리더 연구를 지속적으로 지원합니다. 탑티어급 과제는 내년도에 3개, 유형 A는 10개를 선정할 계획입니다.", "국가연구소는 세계 최고 수준의 연구소 육성을 위해 집단 기초연구 중 가장 큰 규모로 지원하는 사업입니다. 효과적인 운영을 위해 현장 컨설팅의 실효성을 높이고 신규 연구소 지원을 지속적으로 확대하겠습니다."]}, {"id": "Z02-P05", "title": "집단 연구 개편과 AI 활용 연구", "start": 423, "end": 527, "text": "집단 기초연구 주제의 혁신성을 높이고 국가·사회적 의제와의 연계성을 강화하기 위해 미래연구센터 체계를 구축합니다. 기존 이학·공학·기초의과학·지역혁신 연구센터를 미래연구센터 체계로 전환하고, FRC-X 유형을 신설할 계획입니다. 유형별 명칭과 구성은 뒤의 집단 연구 안내에서 설명합니다. FRC-X는 학문 분야의 구분을 넘어 연구 주제의 도전성과 국가·사회적 난제와의 연관성을 중심으로 연구팀을 선발하며, 내년도에 4개를 선정할 계획입니다. 집단 연구의 세부 내용은 추가 의견 수렴을 거쳐 다음 달에 공고하겠습니다. AI를 활용하여 과학적 난제를 해결하고 새로운 연구 영역과 방법론을 개척하는 도전적 연구를 지원합니다. 핵심 연구 전략형과 기초연구실 사업에서 AI 활용 기초연구, AI가 제시한 가설·데이터·증명 등의 검증, AI의 발견을 과학적 원리와 이론으로 발전시키는 연구 등을 선정할 계획입니다. 구체적인 선정 규모는 추후 공고합니다.", "source_blocks": [24, 25, 26, 27, 28], "bullets": ["집단 기초연구 주제의 혁신성을 높이고 국가·사회적 의제와의 연계성을 강화하기 위해 미래연구센터 체계를 구축합니다. 기존 이학·공학·기초의과학·지역혁신 연구센터를 미래연구센터 체계로 전환하고, FRC-X 유형을 신설할 계획입니다. 유형별 명칭과 구성은 뒤의 집단 연구 안내에서 설명합니다.", "FRC-X는 학문 분야의 구분을 넘어 연구 주제의 도전성과 국가·사회적 난제와의 연관성을 중심으로 연구팀을 선발하며, 내년도에 4개를 선정할 계획입니다. 집단 연구의 세부 내용은 추가 의견 수렴을 거쳐 다음 달에 공고하겠습니다.", "AI를 활용하여 과학적 난제를 해결하고 새로운 연구 영역과 방법론을 개척하는 도전적 연구를 지원합니다. 핵심 연구 전략형과 기초연구실 사업에서 AI 활용 기초연구, AI가 제시한 가설·데이터·증명 등의 검증, AI의 발견을 과학적 원리와 이론으로 발전시키는 연구 등을 선정할 계획입니다. 구체적인 선정 규모는 추후 공고합니다."]}, {"id": "Z02-P06", "title": "성과 관리·글로벌화·AI 활용 책임성", "start": 528, "end": 632, "text": "연구지원 시스템을 혁신하고 질적 성과 중심의 관리를 강화합니다. 단계·최종 보고서 등에서 논문·특허와 같은 양적 실적 제출을 전면 금지하고 질적 성과 중심으로 평가할 계획입니다. 연구팀의 자율성에 기반한 성과 관리를 강화하며, 단계·최종 평가와 컨설팅, 성과 분석에서 자립 역량과 지속 가능성에 중점을 두도록 관리 체계를 개선하겠습니다. 연구과제 지원의 전주기 글로벌화를 추진합니다. 국내 연구 생태계에 참여하는 해외 학위 취득자와 우수 외국인 연구자의 편의성을 높이고 참여 기회를 확대하기 위해 영문 공고문과 글로벌 표준 양식 등을 도입합니다. 외국인 지원자가 많거나 해외 평가위원의 참여 필요성이 높은 사업에서는 영문 연구계획서 등 영문 양식의 도입을 확대하겠습니다. AI 시대의 연구 관리 혁신과 책임성 강화를 추진합니다. 연구지원 방식 자체를 과학적으로 분석·검증하여 지원 체계를 고도화하고자 합니다. 생성형 AI 활용이 확산되는 상황에서 연구자가 책임성과 투명성을 바탕으로 AI를 활용할 수 있도록, 연구계획서 등의 AI 활용 경향을 시범적으로 파악하겠습니다.", "source_blocks": [29, 30, 31, 32, 33, 34, 35], "bullets": ["연구지원 시스템을 혁신하고 질적 성과 중심의 관리를 강화합니다. 단계·최종 보고서 등에서 논문·특허와 같은 양적 실적 제출을 전면 금지하고 질적 성과 중심으로 평가할 계획입니다. 연구팀의 자율성에 기반한 성과 관리를 강화하며, 단계·최종 평가와 컨설팅, 성과 분석에서 자립 역량과 지속 가능성에 중점을 두도록 관리 체계를 개선하겠습니다.", "연구과제 지원의 전주기 글로벌화를 추진합니다. 국내 연구 생태계에 참여하는 해외 학위 취득자와 우수 외국인 연구자의 편의성을 높이고 참여 기회를 확대하기 위해 영문 공고문과 글로벌 표준 양식 등을 도입합니다. 외국인 지원자가 많거나 해외 평가위원의 참여 필요성이 높은 사업에서는 영문 연구계획서 등 영문 양식의 도입을 확대하겠습니다.", "AI 시대의 연구 관리 혁신과 책임성 강화를 추진합니다. 연구지원 방식 자체를 과학적으로 분석·검증하여 지원 체계를 고도화하고자 합니다. 생성형 AI 활용이 확산되는 상황에서 연구자가 책임성과 투명성을 바탕으로 AI를 활용할 수 있도록, 연구계획서 등의 AI 활용 경향을 시범적으로 파악하겠습니다."], "bullet_labels": ["질적 성과 중심 관리", "연구지원의 글로벌화", "AI 시대 연구 관리와 책임성"]}, {"id": "Z02-P07", "title": "평가 개선과 성과 홍보", "start": 632, "end": 686, "text": "기초연구실 선정 평가와 리더 연구·선도연구센터 최종 평가를 발표 평가로 운영할 계획입니다. 연구자가 실패에 대한 부담 없이 도전하도록 단계·최종 평가 등급을 폐지하고, 성실한 수행에 따른 연구 완료 여부를 평가할 계획입니다. 출연연 PBS 폐지에 따라 해당 출연연 소속 연구자의 기초연구 과제 신청을 제한하고 대학 교원 중심으로 지원을 확대할 계획입니다. 과제 협약 시점부터 우수 성과의 대국민 홍보를 관리합니다. 주요 저널 게재 성과는 과기정통부 브리핑과 언론 인터뷰 등에 연계하여 홍보 효과를 높이겠습니다.", "source_blocks": [36, 37, 38, 39], "bullets": ["기초연구실 선정 평가와 리더 연구·선도연구센터 최종 평가를 발표 평가로 운영할 계획입니다.", "연구자가 실패에 대한 부담 없이 도전하도록 단계·최종 평가 등급을 폐지하고, 성실한 수행에 따른 연구 완료 여부를 평가할 계획입니다.", "출연연 PBS 폐지에 따라 해당 출연연 소속 연구자의 기초연구 과제 신청을 제한하고 대학 교원 중심으로 지원을 확대할 계획입니다.", "과제 협약 시점부터 우수 성과의 대국민 홍보를 관리합니다. 주요 저널 게재 성과는 과기정통부 브리핑과 언론 인터뷰 등에 연계하여 홍보 효과를 높이겠습니다."]}, {"id": "Z02-P08", "title": "예산과 지원 규모", "start": 692, "end": 798, "text": "2027년도 기초연구사업 예산은 과학기술정보통신부 2조 9,102억 원과 교육부 6,469억 원을 합쳐 총 3조 5,571억 원입니다. 과기정통부 예산은 2026년 2조 7,362억 원 대비 약 1,739억 원 증가했습니다. 현재 국회 심의 중이므로 최종 규모는 변동될 수 있습니다. 개인 연구 예산은 총 2조 4,421억 원입니다. 지원 과제 수는 자동 자막에 ‘18,11개’로 기록되어 있어 발표자료 확인이 필요합니다. 리더·핵심·신진 연구와 세종과학 펠로우십의 지원 규모 및 과제 수는 표를 참고해 주시기 바랍니다. 집단 연구에는 4,681억 원을 투입하여 총 505개 과제를 지원합니다. 사업별 세부 예산과 과제 수는 표를 참고해 주시기 바랍니다. 트랙별 신규 선정 계획은 이어지는 사업 설명에서 자세히 안내하겠습니다.", "source_blocks": [40, 41, 42, 43, 44, 45, 46, 47], "bullets": ["2027년도 기초연구사업 예산은 과학기술정보통신부 2조 9,102억 원과 교육부 6,469억 원을 합쳐 총 3조 5,571억 원입니다. 과기정통부 예산은 2026년 2조 7,362억 원 대비 약 1,739억 원 증가했습니다. 현재 국회 심의 중이므로 최종 규모는 변동될 수 있습니다.", "개인 연구 예산은 총 2조 4,421억 원입니다. 지원 과제 수는 자동 자막에 ‘18,11개’로 기록되어 있어 발표자료 확인이 필요합니다. 리더·핵심·신진 연구와 세종과학 펠로우십의 지원 규모 및 과제 수는 표를 참고해 주시기 바랍니다.", "집단 연구에는 4,681억 원을 투입하여 총 505개 과제를 지원합니다. 사업별 세부 예산과 과제 수는 표를 참고해 주시기 바랍니다. 트랙별 신규 선정 계획은 이어지는 사업 설명에서 자세히 안내하겠습니다."]}], "summary": ["장기적·안정적 지원, 창의적·도전적 연구, 성과 책임성 강화를 중심으로 2027년 정책 방향을 설명합니다.", "청년·지역 연구자 지원, 리더급 연구와 집단 연구 육성, AI를 활용한 과학 난제 해결이 주요 과제입니다.", "질적 성과 중심의 관리와 평가 개선을 추진합니다. 제시된 예산과 지원 규모는 국회 심의에 따라 달라질 수 있습니다."]}, {"id": "Z03", "title": "개인 연구 사업별 지원 내용", "start": 799, "end": 1628, "paragraphs": [{"id": "Z03-P01", "title": "리더 연구", "start": 799, "end": 888, "text": "한국연구재단 개인연구지원팀에서 2027년도 개인 연구지원사업의 세부 사업과 신규 과제 신청 유의 사항을 설명드리겠습니다. 먼저 리더 연구입니다. 연구 기간은 유형 A·B 모두 9년이며, 5년과 4년의 단계로 구성됩니다. 유형 A의 연구비는 연 8억 원 내외입니다. 유형 B의 연구비는 자동 자막에서 누락되어 발표자료 확인이 필요합니다. 선정 규모는 유형 B 3개 내외, 유형 A는 후속 과제 2개 내외를 포함하여 총 10개 내외입니다. 지원 대상은 대학 이공분야 전임·비전임 교원과 국공립·민간 연구소 연구원입니다. PBS가 폐지된 출연연 소속 연구자는 신청할 수 없습니다. 유형 B에는 2027년 3단계 진입 예정인 기존 리더 연구자도 신청할 수 있습니다. 리더 연구는 이번 1차 공고에 포함되지만 연구 개시는 6월이며, 1차년도 연구 기간은 9개월입니다.", "source_blocks": [48, 49, 50, 51, 52, 53], "bullets": ["한국연구재단 개인연구지원팀에서 2027년도 개인 연구지원사업의 세부 사업과 신규 과제 신청 유의 사항을 설명드리겠습니다. 먼저 리더 연구입니다.", "연구 기간은 유형 A·B 모두 9년이며, 5년과 4년의 단계로 구성됩니다. 유형 A의 연구비는 연 8억 원 내외입니다. 유형 B의 연구비는 자동 자막에서 누락되어 발표자료 확인이 필요합니다. 선정 규모는 유형 B 3개 내외, 유형 A는 후속 과제 2개 내외를 포함하여 총 10개 내외입니다.", "지원 대상은 대학 이공분야 전임·비전임 교원과 국공립·민간 연구소 연구원입니다. PBS가 폐지된 출연연 소속 연구자는 신청할 수 없습니다. 유형 B에는 2027년 3단계 진입 예정인 기존 리더 연구자도 신청할 수 있습니다.", "리더 연구는 이번 1차 공고에 포함되지만 연구 개시는 6월이며, 1차년도 연구 기간은 9개월입니다."]}, {"id": "Z03-P02", "title": "핵심 연구 유형 C·B·A", "start": 888, "end": 960, "text": "핵심 연구 유형 C·B·A는 모두 3월 1일에 개시합니다. 연구 기간은 1~5년 범위에서 연구자가 자율적으로 설정하며, 연구비는 각각 연 3억 원, 2억 원, 1억 원 내외입니다. 선정 규모는 유형 C 100개 내외, 유형 A 825개 내외입니다. 유형 B의 선정 규모는 자동 자막에 ‘60, 670개’로 기록되어 정확한 수치를 확인해야 합니다. 지원 대상은 리더 연구와 같습니다. 슬라이드의 지원 대상에서 ‘교원’은 전임·비전임 교원을 모두 포함합니다. ‘연구원’도 별도 제한이 명시되지 않았다면 정규직·비정규직 연구원 모두 신청할 수 있다는 의미입니다.", "source_blocks": [54, 55], "bullets": ["핵심 연구 유형 C·B·A는 모두 3월 1일에 개시합니다. 연구 기간은 1~5년 범위에서 연구자가 자율적으로 설정하며, 연구비는 각각 연 3억 원, 2억 원, 1억 원 내외입니다.", "선정 규모는 유형 C 100개 내외, 유형 A 825개 내외입니다. 유형 B의 선정 규모는 자동 자막에 ‘60, 670개’로 기록되어 정확한 수치를 확인해야 합니다. 지원 대상은 리더 연구와 같습니다.", "슬라이드의 지원 대상에서 ‘교원’은 전임·비전임 교원을 모두 포함합니다. ‘연구원’도 별도 제한이 명시되지 않았다면 정규직·비정규직 연구원 모두 신청할 수 있다는 의미입니다."]}, {"id": "Z03-P03", "title": "도약형과 한우물 파기", "start": 960, "end": 1048, "text": "도약형은 후속 연구 성격의 사업으로, 연구 기간은 3년이고 연구비는 연 2.5억 원 내외입니다. 핵심 연구 유형 B·C, 신진 연구 유형 B, 구 중견 후속 및 중견 연계 신진 후속 과제 등에서 2027년 종료 예정인 연구책임자를 대상으로 합니다. PBS가 폐지된 출연연 소속 연구자는 신청할 수 없습니다. 한우물 파기 기초연구는 5년과 5년, 총 10년간 지원하며 연구비는 연 2억 원 내외입니다. 선정 규모는 40개 내외입니다. 한우물 파기의 지원 대상은 박사학위 취득 후 15년 이내인 대학 이공분야 전임·비전임 교원과 국공립·민간 연구소 연구원입니다. 이 사업도 PBS가 폐지된 출연연 소속 연구자는 신청할 수 없습니다. 다음으로 글로벌 매칭형, 전략형, 기본 연구 B·A를 설명드리겠습니다.", "source_blocks": [56, 57, 58, 59], "bullets": ["도약형은 후속 연구 성격의 사업으로, 연구 기간은 3년이고 연구비는 연 2.5억 원 내외입니다. 핵심 연구 유형 B·C, 신진 연구 유형 B, 구 중견 후속 및 중견 연계 신진 후속 과제 등에서 2027년 종료 예정인 연구책임자를 대상으로 합니다. PBS가 폐지된 출연연 소속 연구자는 신청할 수 없습니다.", "한우물 파기 기초연구는 5년과 5년, 총 10년간 지원하며 연구비는 연 2억 원 내외입니다. 선정 규모는 40개 내외입니다.", "한우물 파기의 지원 대상은 박사학위 취득 후 15년 이내인 대학 이공분야 전임·비전임 교원과 국공립·민간 연구소 연구원입니다. 이 사업도 PBS가 폐지된 출연연 소속 연구자는 신청할 수 없습니다. 다음으로 글로벌 매칭형, 전략형, 기본 연구 B·A를 설명드리겠습니다."]}, {"id": "Z03-P04", "title": "글로벌 매칭형·전략형·기본 연구", "start": 1048, "end": 1121, "text": "글로벌 매칭형, 전략형, 기본 연구 B·A는 3월 1일 개시 사업이 아닙니다. 글로벌 매칭형은 12월에 개시하며, 3년간 연 1.5억 원 내외를 지원하고 20개 내외를 선정할 예정입니다. 전략형은 9월 1일에 개시하며 연구 기간은 1~3년, 연구비는 연 2억 원 내외입니다. 선정 규모는 50개 내외입니다. 다른 유형과 달리 PBS가 폐지된 출연연 소속 연구자도 신청할 수 있습니다. 기본 연구 B·A는 모두 1~5년간 지원합니다. 유형 A의 연구비는 연 5천만 원 내외이고 선정 규모는 750개 과제 내외입니다. 유형 B의 연구비와 선정 규모는 자동 자막이 불명확하므로 발표자료 확인이 필요합니다. 대학 소속 신청자는 두 유형 모두 전임 교원이어야 합니다.", "source_blocks": [60, 61, 62], "bullets": ["글로벌 매칭형, 전략형, 기본 연구 B·A는 3월 1일 개시 사업이 아닙니다. 글로벌 매칭형은 12월에 개시하며, 3년간 연 1.5억 원 내외를 지원하고 20개 내외를 선정할 예정입니다.", "전략형은 9월 1일에 개시하며 연구 기간은 1~3년, 연구비는 연 2억 원 내외입니다. 선정 규모는 50개 내외입니다. 다른 유형과 달리 PBS가 폐지된 출연연 소속 연구자도 신청할 수 있습니다.", "기본 연구 B·A는 모두 1~5년간 지원합니다. 유형 A의 연구비는 연 5천만 원 내외이고 선정 규모는 750개 과제 내외입니다. 유형 B의 연구비와 선정 규모는 자동 자막이 불명확하므로 발표자료 확인이 필요합니다. 대학 소속 신청자는 두 유형 모두 전임 교원이어야 합니다."]}, {"id": "Z03-P05", "title": "신진 연구와 인프라 지원", "start": 1123, "end": 1214, "text": "신진 연구는 3월에 개시합니다. 유형 B는 1~5년간 연 1.5억 원 내외를 지원하며, 2027년 선정 규모는 460개 내외입니다. 유형 A는 1~3년간 연 1억 원 내외를 지원하고 600개 내외를 선정합니다. 두 유형의 지원 대상은 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내 대학 이공분야 전임 교원과 국공립·민간 연구소의 정규직 연구원입니다. 앞서 설명한 일부 사업과 달리 전임 교원과 정규직 연구원을 대상으로 합니다. 신진 연구자 인프라 지원 사업은 올해까지 3월 1일에 개시했으나, 내년부터는 신진 지역 장기 연구에 선정되지 않은 연구자도 지원할 수 있도록 개시일을 9월 1일로 변경했습니다. 담당 기관의 별도 신청 요강을 확인해 주시기 바랍니다. 내년 선정 규모는 70개 내외로 예상됩니다.", "source_blocks": [63, 64, 65, 66], "bullets": ["신진 연구는 3월에 개시합니다. 유형 B는 1~5년간 연 1.5억 원 내외를 지원하며, 2027년 선정 규모는 460개 내외입니다. 유형 A는 1~3년간 연 1억 원 내외를 지원하고 600개 내외를 선정합니다.", "두 유형의 지원 대상은 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내 대학 이공분야 전임 교원과 국공립·민간 연구소의 정규직 연구원입니다. 앞서 설명한 일부 사업과 달리 전임 교원과 정규직 연구원을 대상으로 합니다.", "신진 연구자 인프라 지원 사업은 올해까지 3월 1일에 개시했으나, 내년부터는 신진 지역 장기 연구에 선정되지 않은 연구자도 지원할 수 있도록 개시일을 9월 1일로 변경했습니다. 담당 기관의 별도 신청 요강을 확인해 주시기 바랍니다. 내년 선정 규모는 70개 내외로 예상됩니다."]}, {"id": "Z03-P06", "title": "신진 지역 장기 연구", "start": 1214, "end": 1281, "text": "신진 지역 장기 연구는 내년에 새로 추진하는 사업입니다. 연구 기간은 5년과 5년, 총 10년입니다. 연구비는 1차년도 3억 원 내외, 2차년도부터 연 1.5억 원 내외입니다. 지원 대상은 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내 지역 대학 이공분야 전임 교원입니다. 지역 대학의 전임 교원을 대상으로 한다는 점에서 신진 연구 유형 A·B와 차이가 있습니다. PBS가 폐지된 출연연은 신청할 수 없습니다. 신진 지역 장기 연구는 반드시 장비 구축 계획이 있어야 신청할 수 있습니다. 다음으로 세종과학 펠로우십을 설명드리겠습니다.", "source_blocks": [67, 68, 69, 70], "bullets": ["신진 지역 장기 연구는 내년에 새로 추진하는 사업입니다. 연구 기간은 5년과 5년, 총 10년입니다. 연구비는 1차년도 3억 원 내외, 2차년도부터 연 1.5억 원 내외입니다.", "지원 대상은 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내 지역 대학 이공분야 전임 교원입니다. 지역 대학의 전임 교원을 대상으로 한다는 점에서 신진 연구 유형 A·B와 차이가 있습니다.", "PBS가 폐지된 출연연은 신청할 수 없습니다. 신진 지역 장기 연구는 반드시 장비 구축 계획이 있어야 신청할 수 있습니다. 다음으로 세종과학 펠로우십을 설명드리겠습니다."]}, {"id": "Z03-P07", "title": "세종과학 펠로우십과 개인 연구 지원 규모", "start": 1281, "end": 1461, "text": "세종과학 펠로우십은 내년부터 국내 트랙과 복귀·유치 트랙으로 운영하며 연구 기간은 5년입니다. 연간 연구비는 자동 자막에 ‘1.4 1.3억 원’으로 기록되어 트랙별 정확한 금액을 발표자료에서 확인해야 합니다. 선정 규모는 국내 트랙 170개 내외, 복귀·유치 트랙 200개 내외입니다. 국내 트랙은 3월 1일, 복귀·유치 트랙은 9월 1일에 개시합니다. 국내 트랙은 국내 대학에서 박사학위를 취득한 연구자, 복귀·유치 트랙은 해외 대학에서 박사학위를 취득한 연구자를 대상으로 합니다. 두 트랙 모두 박사학위 취득 후 7년 이내이거나 만 39세 이하인 연구자 중 국내 대학의 전임 교원이 아닌 사람 또는 국공립·민간 연구소 등의 비정규직 연구자가 대상입니다. PBS가 폐지된 출연연은 신청할 수 없습니다. 신진 연구와 달리 비전임 교원과 비정규직 연구자를 대상으로 한다는 점을 확인해 주시기 바랍니다. 2026년 개인 연구지원 실적은 계속 과제를 포함해 약 15,700개, 예산은 약 2.3조 원입니다. 2027년 신규 선정 계획은 리더 연구 13개 내외·약 96억 원, 핵심 연구 3,705개 내외, 신진 연구 1,230개 내외·약 1,800억 원, 세종과학 펠로우십 370개 내외·약 455억 원입니다. 핵심 연구 예산은 자막의 ‘4,10억 원’만으로는 확정할 수 없어 발표자료 확인이 필요합니다. 전체 신규 지원 규모는 약 5,300개 과제, 약 6,367억 원입니다. 정부안 기준이므로 국회 심의 과정에서 변경될 수 있습니다.", "source_blocks": [71, 72, 73, 74], "bullets": ["세종과학 펠로우십은 내년부터 국내 트랙과 복귀·유치 트랙으로 운영하며 연구 기간은 5년입니다. 연간 연구비는 자동 자막에 ‘1.4 1.3억 원’으로 기록되어 트랙별 정확한 금액을 발표자료에서 확인해야 합니다. 선정 규모는 국내 트랙 170개 내외, 복귀·유치 트랙 200개 내외입니다. 국내 트랙은 3월 1일, 복귀·유치 트랙은 9월 1일에 개시합니다.", "국내 트랙은 국내 대학에서 박사학위를 취득한 연구자, 복귀·유치 트랙은 해외 대학에서 박사학위를 취득한 연구자를 대상으로 합니다. 두 트랙 모두 박사학위 취득 후 7년 이내이거나 만 39세 이하인 연구자 중 국내 대학의 전임 교원이 아닌 사람 또는 국공립·민간 연구소 등의 비정규직 연구자가 대상입니다. PBS가 폐지된 출연연은 신청할 수 없습니다.", "신진 연구와 달리 비전임 교원과 비정규직 연구자를 대상으로 한다는 점을 확인해 주시기 바랍니다. 2026년 개인 연구지원 실적은 계속 과제를 포함해 약 15,700개, 예산은 약 2.3조 원입니다.", "2027년 신규 선정 계획은 리더 연구 13개 내외·약 96억 원, 핵심 연구 3,705개 내외, 신진 연구 1,230개 내외·약 1,800억 원, 세종과학 펠로우십 370개 내외·약 455억 원입니다. 핵심 연구 예산은 자막의 ‘4,10억 원’만으로는 확정할 수 없어 발표자료 확인이 필요합니다. 전체 신규 지원 규모는 약 5,300개 과제, 약 6,367억 원입니다. 정부안 기준이므로 국회 심의 과정에서 변경될 수 있습니다."]}, {"id": "Z03-P08", "title": "사업별 추진 일정", "start": 1461, "end": 1628, "text": "리더 연구는 12월 초까지 접수하고 3~4월 선정 평가를 거쳐 6월에 개시할 예정입니다. 핵심 연구 유형 C·B·A, 도약형, 한우물 파기는 12월 초까지 접수하고 1~2월 평가를 거쳐 3월에 개시합니다. 글로벌 매칭형은 내년 1월경 공고하고 12월에 개시할 예정입니다. 전략형과 기본 연구 B·A는 내년 3월에 신청 요강을 안내하고 4월에 접수한 뒤, 8월까지 선정 절차를 거쳐 9월에 개시합니다. 하반기 개시 과제의 자세한 내용은 내년 3월경 재단 홈페이지에서 안내하겠습니다. 신진 연구 유형 B·A와 신진 지역 장기 연구는 12월 초까지 접수하고 1~2월 평가를 거쳐 3월에 개시합니다. 신진 연구자 인프라 지원 사업은 내년부터 9월에 개시합니다. 세종과학 펠로우십 국내 트랙은 12월 초까지 접수하고 평가를 거쳐 3월에 개시합니다. 복귀·유치 트랙은 3월까지 선정을 마친 뒤 복귀 준비 기간을 고려하여 9월에 개시합니다. 복귀·유치 트랙도 이번 개인 연구 1차 공고에 포함됩니다. 신청 요강과 서식은 11월 16일 월요일에 재단 홈페이지에서 안내할 예정입니다. 다음으로 개인 기초연구와 일부 집단 연구에 공통으로 적용되는 신규 과제 신청 유의 사항을 설명드리겠습니다.", "source_blocks": [75, 76, 77, 78, 79, 80], "bullets": ["리더 연구는 12월 초까지 접수하고 3~4월 선정 평가를 거쳐 6월에 개시할 예정입니다.", "핵심 연구 유형 C·B·A, 도약형, 한우물 파기는 12월 초까지 접수하고 1~2월 평가를 거쳐 3월에 개시합니다. 글로벌 매칭형은 내년 1월경 공고하고 12월에 개시할 예정입니다.", "전략형과 기본 연구 B·A는 내년 3월에 신청 요강을 안내하고 4월에 접수한 뒤, 8월까지 선정 절차를 거쳐 9월에 개시합니다. 하반기 개시 과제의 자세한 내용은 내년 3월경 재단 홈페이지에서 안내하겠습니다.", "신진 연구 유형 B·A와 신진 지역 장기 연구는 12월 초까지 접수하고 1~2월 평가를 거쳐 3월에 개시합니다. 신진 연구자 인프라 지원 사업은 내년부터 9월에 개시합니다.", "세종과학 펠로우십 국내 트랙은 12월 초까지 접수하고 평가를 거쳐 3월에 개시합니다. 복귀·유치 트랙은 3월까지 선정을 마친 뒤 복귀 준비 기간을 고려하여 9월에 개시합니다. 복귀·유치 트랙도 이번 개인 연구 1차 공고에 포함됩니다.", "신청 요강과 서식은 11월 16일 월요일에 재단 홈페이지에서 안내할 예정입니다. 다음으로 개인 기초연구와 일부 집단 연구에 공통으로 적용되는 신규 과제 신청 유의 사항을 설명드리겠습니다."]}], "summary": ["리더 연구, 핵심 연구, 신진 연구, 세종과학 펠로우십의 지원 대상·기간·규모를 비교합니다.", "도약형·한우물 파기·글로벌 매칭형·전략형·기본 연구 등 세부 유형별 요건과 개시 시점이 다릅니다.", "신진 지역 장기 연구와 인프라 지원, 세종 국내·복귀 유치 트랙의 차이를 설명하며 세부 일정은 신청 요강 확인이 필요합니다."]}, {"id": "Z04", "title": "신청 자격·수행 제한·접수 절차", "start": 1630, "end": 2543, "paragraphs": [{"id": "Z04-P01", "title": "공고와 접수 일정", "start": 1630, "end": 1701, "text": "리더 연구, 핵심 연구, 신진 연구, 세종과학 펠로우십은 12월 초까지 신청하면 됩니다. 연구 개시는 리더 연구가 6월, 세종 복귀·유치 트랙이 9월이며, 나머지 해당 사업은 3월입니다. 정확한 접수 마감일은 11월 5일에 공지한 공고문을 확인해 주시기 바랍니다. 신청 요강과 연구계획서 서식은 11월 16일에 공지합니다. 9월 개시 과제에 해당하는 개인 연구 2차 공고는 내년 3월 중에 안내할 예정입니다. 집단 연구는 12월 공고, 2월 접수를 거쳐 7~8월에 개시할 예정입니다. 자세한 내용은 다음 달 공고문을 확인해 주시기 바랍니다.", "source_blocks": [81, 82, 83, 84], "bullets": ["리더 연구, 핵심 연구, 신진 연구, 세종과학 펠로우십은 12월 초까지 신청하면 됩니다. 연구 개시는 리더 연구가 6월, 세종 복귀·유치 트랙이 9월이며, 나머지 해당 사업은 3월입니다.", "정확한 접수 마감일은 11월 5일에 공지한 공고문을 확인해 주시기 바랍니다. 신청 요강과 연구계획서 서식은 11월 16일에 공지합니다. 9월 개시 과제에 해당하는 개인 연구 2차 공고는 내년 3월 중에 안내할 예정입니다.", "집단 연구는 12월 공고, 2월 접수를 거쳐 7~8월에 개시할 예정입니다. 자세한 내용은 다음 달 공고문을 확인해 주시기 바랍니다."]}, {"id": "Z04-P02", "title": "1인 1과제 원칙과 예외 사업", "start": 1705, "end": 1772, "text": "개인 기초연구 중 1인 1과제 원칙의 예외 사업을 안내합니다. 글로벌 매칭형은 연구재단 국제협력본부에서 추진하며, 내년 1월 공고 후 평가를 거쳐 12월에 개시할 예정입니다. 신진 연구자 인프라 지원 사업은 담당 기관에서 내년 3월에 별도로 공고하고 9월에 개시할 예정입니다. 두 사업은 신청 요강을 별도로 공고하므로 각 사업의 요강을 확인해 주시기 바랍니다. 이어서 신청 및 수행 제한을 설명합니다. 요건 심사에서 탈락할 수 있는 사항이므로 신청 전에 충분히 확인해 주시기 바랍니다.", "source_blocks": [85, 86], "bullets": ["개인 기초연구 중 1인 1과제 원칙의 예외 사업을 안내합니다. 글로벌 매칭형은 연구재단 국제협력본부에서 추진하며, 내년 1월 공고 후 평가를 거쳐 12월에 개시할 예정입니다.", "신진 연구자 인프라 지원 사업은 담당 기관에서 내년 3월에 별도로 공고하고 9월에 개시할 예정입니다. 두 사업은 신청 요강을 별도로 공고하므로 각 사업의 요강을 확인해 주시기 바랍니다.", "이어서 신청 및 수행 제한을 설명합니다. 요건 심사에서 탈락할 수 있는 사항이므로 신청 전에 충분히 확인해 주시기 바랍니다."]}, {"id": "Z04-P03", "title": "기존 과제 수행자의 신청 제한과 예외", "start": 1773, "end": 1931, "text": "개인 연구는 연구책임자로 1인 1과제 수행이 원칙입니다. 기존 개인 연구 과제를 수행 중인 연구책임자는 원칙적으로 신규 신청을 할 수 없습니다. 집단 연구도 연구책임자 또는 참여 연구원(공동)으로 1인 1과제 수행이 원칙이므로, 해당 역할로 과제를 수행 중이면 신규 신청이 제한됩니다. 신진 연구자 인프라 지원 사업, 기존 핵심 연구 도전형 수행 과제, 글로벌 매칭형은 예외적으로 중복 수행이 가능합니다. 신진 연구자 인프라 지원 사업은 개인·집단 과제를 수행하고 있어도 추가로 수행할 수 있습니다. 개인 기초연구는 수행 중인 과제가 2027년 12월 말까지 최종 종료되는 경우 신규 신청이 가능합니다. 리더 연구는 개시일인 2027년 6월 1일부터 10개월 이내에 기존 과제가 최종 종료되는 경우 신청할 수 있습니다. 한우물 파기는 수행 중인 과제의 최종 종료 시기와 관계없이 신청하고, 선정되면 해당 사업으로 전환할 수 있다고 안내합니다. 다만 교육부 소관 과제의 예외는 뒤의 FAQ에서 별도로 설명합니다. 집단 연구는 신규 과제 개시 후 10개월 이내에 기존 과제가 최종 종료되는 경우 신규 신청이 가능합니다. NRL 2.0 등의 구체적인 예외 요건은 12월 별도 공고를 참고해 주시기 바랍니다.", "source_blocks": [87, 88, 89, 90, 91, 92, 93], "bullets": ["개인 연구는 연구책임자로 1인 1과제 수행이 원칙입니다. 기존 개인 연구 과제를 수행 중인 연구책임자는 원칙적으로 신규 신청을 할 수 없습니다. 집단 연구도 연구책임자 또는 참여 연구원(공동)으로 1인 1과제 수행이 원칙이므로, 해당 역할로 과제를 수행 중이면 신규 신청이 제한됩니다.", "신진 연구자 인프라 지원 사업, 기존 핵심 연구 도전형 수행 과제, 글로벌 매칭형은 예외적으로 중복 수행이 가능합니다. 신진 연구자 인프라 지원 사업은 개인·집단 과제를 수행하고 있어도 추가로 수행할 수 있습니다.", "개인 기초연구는 수행 중인 과제가 2027년 12월 말까지 최종 종료되는 경우 신규 신청이 가능합니다. 리더 연구는 개시일인 2027년 6월 1일부터 10개월 이내에 기존 과제가 최종 종료되는 경우 신청할 수 있습니다.", "한우물 파기는 수행 중인 과제의 최종 종료 시기와 관계없이 신청하고, 선정되면 해당 사업으로 전환할 수 있다고 안내합니다. 다만 교육부 소관 과제의 예외는 뒤의 FAQ에서 별도로 설명합니다.", "집단 연구는 신규 과제 개시 후 10개월 이내에 기존 과제가 최종 종료되는 경우 신규 신청이 가능합니다. NRL 2.0 등의 구체적인 예외 요건은 12월 별도 공고를 참고해 주시기 바랍니다."]}, {"id": "Z04-P04", "title": "리더 연구·세종과학 펠로우십의 별도 조건", "start": 1931, "end": 2053, "text": "리더 연구책임자는 다른 국가연구개발사업을 포함하여 연구책임자로 한 개 과제만 추가 수행할 수 있습니다. 집단 연구사업의 연구책임자 신청에는 별도 제한이 있으므로 사업별 기준을 확인해 주시기 바랍니다. 세종 국내 트랙은 3월 1일에 개시하며, 개시 후 6개월 이내에 주관 연구기관을 확정하고 연구재단 심의를 받아야 합니다. 자막에 언급된 구체적인 마감 날짜는 공식 신청 요강에서 확인해야 합니다. 세종 복귀·유치 트랙은 9월 1일 개시 전에 주관기관을 확정해야 합니다. 이직으로 과제를 중단하는 경우, 개시 후 6개월이 지난 시점에 국내 기관으로 이직할 때만 정당한 사유로 인정된다고 안내합니다. 정해진 기한에 주관기관을 확정하지 못하면 선정이 취소될 수 있습니다. 국가연구소·선도연구센터·기초연구실 등 집단 연구의 세부 사항은 12월 공고에서 확인해 주시기 바랍니다.", "source_blocks": [94, 95], "bullets": ["리더 연구책임자는 다른 국가연구개발사업을 포함하여 연구책임자로 한 개 과제만 추가 수행할 수 있습니다. 집단 연구사업의 연구책임자 신청에는 별도 제한이 있으므로 사업별 기준을 확인해 주시기 바랍니다.", "세종 국내 트랙은 3월 1일에 개시하며, 개시 후 6개월 이내에 주관 연구기관을 확정하고 연구재단 심의를 받아야 합니다. 자막에 언급된 구체적인 마감 날짜는 공식 신청 요강에서 확인해야 합니다.", "세종 복귀·유치 트랙은 9월 1일 개시 전에 주관기관을 확정해야 합니다. 이직으로 과제를 중단하는 경우, 개시 후 6개월이 지난 시점에 국내 기관으로 이직할 때만 정당한 사유로 인정된다고 안내합니다.", "정해진 기한에 주관기관을 확정하지 못하면 선정이 취소될 수 있습니다. 국가연구소·선도연구센터·기초연구실 등 집단 연구의 세부 사항은 12월 공고에서 확인해 주시기 바랍니다."]}, {"id": "Z04-P05", "title": "정부 R&D 공통 제한", "start": 2053, "end": 2087, "text": "제재 처분을 받은 연구자는 접수 마감일 전일까지 처분이 종료되는 경우에 한하여 신규 신청할 수 있습니다. 마감일 당일이 아니라 전일을 기준으로 한다는 점에 유의해 주시기 바랍니다. 국가연구개발 과제는 최대 5개까지 동시에 수행할 수 있으며, 그중 연구책임자로 수행할 수 있는 과제는 최대 3개입니다.", "source_blocks": [96, 97, 98], "bullets": ["제재 처분을 받은 연구자는 접수 마감일 전일까지 처분이 종료되는 경우에 한하여 신규 신청할 수 있습니다. 마감일 당일이 아니라 전일을 기준으로 한다는 점에 유의해 주시기 바랍니다.", "국가연구개발 과제는 최대 5개까지 동시에 수행할 수 있으며, 그중 연구책임자로 수행할 수 있는 과제는 최대 3개입니다."]}, {"id": "Z04-P06", "title": "우대와 감점 기준", "start": 2091, "end": 2238, "text": "여성 연구자를 대상으로 개인 기초연구 핵심 유형 B에 20% 선정 목표제를 적용할 예정입니다. 지역 연구자 우대를 위해 기본 연구 A·B는 연구비 비율 기준 40% 이상을 배정할 예정이며, 집단 연구 중 기초연구실 심화형은 30% 수준을 지역 대학에 할당할 계획입니다. 성과 우수자에 대한 추가 선정 우대도 안내합니다. 해당 핵심 연구 유형은 자막에 ‘AP’로 기록되어 정확한 유형 확인이 필요합니다. 세종 국내 트랙 수행 중 전임 교원으로 신분이 바뀐 연구책임자가 5년간 연구를 정상 수행하고 종료하는 해에 신진 연구 유형 B에 신청하면 우대하여 선정할 예정입니다. 생애 첫 연구 및 경력단절 연구자는 핵심 연구 A에서 가점을 부여할 예정입니다. 신진 연구자 인프라 지원 사업에서는 연구시설·장비 통합관리 지정 기관에 가점을 부여합니다. 접수 마감일 기준 최근 3년 이내에 제재 처분을 받았거나 정당한 사유 없이 과제 수행을 포기한 연구자는 감점 대상이 될 수 있습니다. IRIS 신청에 앞서 연구자는 NRI 가입, 연구자 전환 동의, 정보 등록·갱신 등의 사전 절차를 완료해야 합니다.", "source_blocks": [99, 100, 101, 102, 103, 104, 105], "bullets": ["여성 연구자를 대상으로 개인 기초연구 핵심 유형 B에 20% 선정 목표제를 적용할 예정입니다. 지역 연구자 우대를 위해 기본 연구 A·B는 연구비 비율 기준 40% 이상을 배정할 예정이며, 집단 연구 중 기초연구실 심화형은 30% 수준을 지역 대학에 할당할 계획입니다.", "성과 우수자에 대한 추가 선정 우대도 안내합니다. 해당 핵심 연구 유형은 자막에 ‘AP’로 기록되어 정확한 유형 확인이 필요합니다. 세종 국내 트랙 수행 중 전임 교원으로 신분이 바뀐 연구책임자가 5년간 연구를 정상 수행하고 종료하는 해에 신진 연구 유형 B에 신청하면 우대하여 선정할 예정입니다.", "생애 첫 연구 및 경력단절 연구자는 핵심 연구 A에서 가점을 부여할 예정입니다. 신진 연구자 인프라 지원 사업에서는 연구시설·장비 통합관리 지정 기관에 가점을 부여합니다.", "접수 마감일 기준 최근 3년 이내에 제재 처분을 받았거나 정당한 사유 없이 과제 수행을 포기한 연구자는 감점 대상이 될 수 있습니다.", "IRIS 신청에 앞서 연구자는 NRI 가입, 연구자 전환 동의, 정보 등록·갱신 등의 사전 절차를 완료해야 합니다."]}, {"id": "Z04-P07", "title": "IRIS 등록과 기관 승인", "start": 2238, "end": 2278, "text": "주관 연구기관은 접수 전에 IRIS 기관 등록과 기관 담당자 권한 부여를 완료해야 합니다. 사전 절차를 마친 후 연구책임자는 온라인 정보를 입력하고 연구계획서를 업로드합니다. 주관 연구기관이 입력 정보와 제출 자료를 검토하여 승인하면 최종 접수가 완료됩니다.", "source_blocks": [106], "bullets": ["주관 연구기관은 접수 전에 IRIS 기관 등록과 기관 담당자 권한 부여를 완료해야 합니다.", "사전 절차를 마친 후 연구책임자는 온라인 정보를 입력하고 연구계획서를 업로드합니다. 주관 연구기관이 입력 정보와 제출 자료를 검토하여 승인하면 최종 접수가 완료됩니다."]}, {"id": "Z04-P08", "title": "사업별 접수 마감일", "start": 2278, "end": 2359, "text": "접수 마감일에 신청이 몰리는 것을 방지하기 위해 사업별 마감일을 구분했습니다. 핵심 연구 유형 C·B·A와 도약형은 연구자 접수를 12월 7일에 마감하며, 주관기관 승인 마감일은 12월 9일입니다. 그 밖의 1차 공고 사업은 연구자 접수를 12월 8일에 마감하며, 주관기관 승인 마감일은 12월 10일입니다. 마감일에는 접속자가 몰려 시스템이 느려질 수 있으므로 2~3일 전에 여유 있게 작업을 완료해 주시기 바랍니다. 신진 연구자 인프라 지원 등 추후 공고되는 사업의 일정은 해당 공고에서 다시 확인해야 합니다.", "source_blocks": [107, 108, 109], "bullets": ["접수 마감일에 신청이 몰리는 것을 방지하기 위해 사업별 마감일을 구분했습니다. 핵심 연구 유형 C·B·A와 도약형은 연구자 접수를 12월 7일에 마감하며, 주관기관 승인 마감일은 12월 9일입니다.", "그 밖의 1차 공고 사업은 연구자 접수를 12월 8일에 마감하며, 주관기관 승인 마감일은 12월 10일입니다.", "마감일에는 접속자가 몰려 시스템이 느려질 수 있으므로 2~3일 전에 여유 있게 작업을 완료해 주시기 바랍니다. 신진 연구자 인프라 지원 등 추후 공고되는 사업의 일정은 해당 공고에서 다시 확인해야 합니다."]}, {"id": "Z04-P09", "title": "신청 전·중·후 체크리스트", "start": 2359, "end": 2419, "text": "과제 신청 전 체크리스트는 11월 16일에 공지하는 신청 요강에 포함될 예정입니다. 해당 항목을 읽고 스스로 점검해 주시기 바랍니다. 이어지는 슬라이드에는 신청 중과 신청 후의 체크리스트를 제시했습니다. 대표 항목 외에도 각자 확인해야 할 사항을 충분히 점검하시기 바랍니다. 체크리스트는 필수 사항을 놓쳐 요건 탈락 등의 불이익을 받는 일을 예방하기 위한 자료입니다.", "source_blocks": [110, 111], "bullets": ["과제 신청 전 체크리스트는 11월 16일에 공지하는 신청 요강에 포함될 예정입니다. 해당 항목을 읽고 스스로 점검해 주시기 바랍니다.", "이어지는 슬라이드에는 신청 중과 신청 후의 체크리스트를 제시했습니다. 대표 항목 외에도 각자 확인해야 할 사항을 충분히 점검하시기 바랍니다. 체크리스트는 필수 사항을 놓쳐 요건 탈락 등의 불이익을 받는 일을 예방하기 위한 자료입니다."]}, {"id": "Z04-P10", "title": "직접비·간접비와 수행 포기 유의 사항", "start": 2419, "end": 2543, "text": "직접비와 간접비는 분리하여 안내합니다. 연구자는 공고문과 신청 요강에 제시된 연간 총 연구비의 80% 수준을 직접비로 신청하면 됩니다. 선정 후 담당 팀에서 간접비를 별도로 산정하여 협약 시 총 연구비와 함께 안내합니다. 계상 예시는 표를 참고해 주시기 바랍니다. 과제 선정 후 표에 제시된 정당한 사유 이외의 이유로 수행을 포기하면 참여 제한 등의 제재 처분이 따를 수 있습니다. 특히 신진 지역 장기 연구는 수행 기간 중 지역 외 기관으로 이직하면 제재 대상이 될 수 있습니다. 이 점까지 고려하여 신중하게 신청해 주시기 바랍니다. 이상으로 개인 기초연구 안내와 신청 유의 사항 설명을 마치겠습니다.", "source_blocks": [112, 113, 114], "bullets": ["직접비와 간접비는 분리하여 안내합니다. 연구자는 공고문과 신청 요강에 제시된 연간 총 연구비의 80% 수준을 직접비로 신청하면 됩니다. 선정 후 담당 팀에서 간접비를 별도로 산정하여 협약 시 총 연구비와 함께 안내합니다. 계상 예시는 표를 참고해 주시기 바랍니다.", "과제 선정 후 표에 제시된 정당한 사유 이외의 이유로 수행을 포기하면 참여 제한 등의 제재 처분이 따를 수 있습니다.", "특히 신진 지역 장기 연구는 수행 기간 중 지역 외 기관으로 이직하면 제재 대상이 될 수 있습니다. 이 점까지 고려하여 신중하게 신청해 주시기 바랍니다. 이상으로 개인 기초연구 안내와 신청 유의 사항 설명을 마치겠습니다."]}], "summary": ["기존 과제 수행 여부에 따른 신규 신청 제한, 1인 1과제 원칙과 예외, 사업별 별도 조건을 설명합니다.", "우대·감점 항목을 확인하고, IRIS 사전 등록부터 연구자 제출과 주관기관 승인까지 완료해야 합니다.", "사업별 마감일이 다르므로 여유 있게 접수하고, 직접비·간접비 신청 방식과 수행 포기·이직에 따른 제재 가능성도 확인해야 합니다."]}, {"id": "Z05", "title": "집단 연구 지원 사업", "start": 2543, "end": 3096, "paragraphs": [{"id": "Z05-P01", "title": "공고 일정과 국가연구소", "start": 2543, "end": 2702, "text": "한국연구재단 집단연구지원팀에서 집단 연구지원사업을 안내합니다. 현재 공고 전이며, 2027년도 사업 개편에 따라 12월 14일이 포함된 주간을 전후하여 별도로 공고할 예정입니다. 국가연구소는 대학 강점 분야의 우수 인력과 인프라를 활용하여 세계 최초·최고 수준의 혁신적 연구를 선도하는 연구소를 육성하는 사업입니다. 2027년 신규 과제는 총 3개이며, 대학별 최대 2개까지 신청하고 1개만 선정할 예정입니다. 신규 대학의 진입 기회를 확대하기 위해 2025~2026년에 선정된 8개 대학은 신청할 수 없습니다. 해당 대학 목록은 신청 요강을 참고해 주시기 바랍니다. 지역 대학 연구자가 안정적으로 연구를 지속하고 산학연 협력 등 지역 혁신의 핵심 주체로 성장하도록 지원합니다. 올해는 전국·지역 대학 유형을 구분했으나, 2027년 지원 규모와 방식은 국회 예산 심의 결과에 따라 조정될 수 있습니다. 지원 기간은 총 10년이며 3단계로 구성됩니다. 지원 규모는 연 100억 원이고, 2027년에는 추진 일정을 고려하여 7월 1일부터 12월 31일까지 6개월간 50억 원을 지원합니다. 지원 대상은 고등교육법 제2조에 따른 대학 소속의 KCI 등록 대학 부설 연구소로 안내합니다. 상세 자격과 요건은 별도 설명회와 추후 신청 요강에서 확인해 주시기 바랍니다.", "source_blocks": [115, 116, 117, 118, 119, 120, 121, 122, 123, 124], "bullets": ["한국연구재단 집단연구지원팀에서 집단 연구지원사업을 안내합니다. 현재 공고 전이며, 2027년도 사업 개편에 따라 12월 14일이 포함된 주간을 전후하여 별도로 공고할 예정입니다.", "국가연구소는 대학 강점 분야의 우수 인력과 인프라를 활용하여 세계 최초·최고 수준의 혁신적 연구를 선도하는 연구소를 육성하는 사업입니다. 2027년 신규 과제는 총 3개이며, 대학별 최대 2개까지 신청하고 1개만 선정할 예정입니다.", "신규 대학의 진입 기회를 확대하기 위해 2025~2026년에 선정된 8개 대학은 신청할 수 없습니다. 해당 대학 목록은 신청 요강을 참고해 주시기 바랍니다.", "지역 대학 연구자가 안정적으로 연구를 지속하고 산학연 협력 등 지역 혁신의 핵심 주체로 성장하도록 지원합니다. 올해는 전국·지역 대학 유형을 구분했으나, 2027년 지원 규모와 방식은 국회 예산 심의 결과에 따라 조정될 수 있습니다.", "지원 기간은 총 10년이며 3단계로 구성됩니다. 지원 규모는 연 100억 원이고, 2027년에는 추진 일정을 고려하여 7월 1일부터 12월 31일까지 6개월간 50억 원을 지원합니다.", "지원 대상은 고등교육법 제2조에 따른 대학 소속의 KCI 등록 대학 부설 연구소로 안내합니다. 상세 자격과 요건은 별도 설명회와 추후 신청 요강에서 확인해 주시기 바랍니다."]}, {"id": "Z05-P02", "title": "미래연구센터 개편·유형·지원 요건", "start": 2702, "end": 2894, "text": "집단 연구의 혁신성과 연구 분야의 다양성을 높이기 위해 2027년부터 기존 선도연구센터를 미래연구센터 체계로 전환합니다. 대학의 우수 연구 그룹이 국가·사회적 수요에 대응하는 혁신적 연구를 수행하고 지속 가능한 역량을 확보하도록 지원합니다. 미래연구센터는 미래연구·기초의과학·지역혁신의 3개 트랙, 5개 유형으로 구성됩니다. 미래연구 트랙에는 목표지향형 FRC-X, 탐구형 FRC-S, 혁신형 FRC-E가 있습니다. 모든 트랙과 유형의 연구 기간은 5년과 2년, 총 7년입니다. 연구비는 목표지향형 15억 원 이내, 탐구형 18억 원 이내, 혁신형 22억 원 이내입니다. 기초의과학과 지역혁신 트랙은 각각 15억 원 이내로 지원할 예정입니다. 대학 연구 그룹을 대상으로 하며, 기초의과학 트랙은 해당 분야 대학원이 설치된 대학, 지역혁신 트랙은 이공계 대학원이 설치된 지역 대학이 대상입니다. 나머지 유형의 대학원 설치 요건은 원문 자막이 불명확하므로 신청 요강을 확인해야 합니다. 목표지향형은 참여 연구자 수에 제한 없이 연구진을 구성할 수 있습니다. 그 밖의 유형은 원칙적으로 8명 이상이며, 지역혁신 트랙은 8명 이내로 구성해야 합니다. 후속 과제를 제외한 신규 선정 규모는 총 17개 내외입니다. 미래연구 트랙은 목표지향형 4개, 탐구형·혁신형 각 2개 내외입니다. 탐구형과 혁신형은 기존 종료 센터를 대상으로 별도의 후속 연구를 지원하며, 해당 센터는 3월 개시 일정을 확인해야 합니다. 기초의과학 트랙은 4개 내외, 지역혁신 트랙은 5개 내외를 신규 선정합니다. 지역혁신 트랙은 2026년에는 신규 지원이 없었습니다. FRC-X의 구체적인 지원 분야와 방향은 논의 중이며, 확정 후 신청 요강에서 안내합니다.", "source_blocks": [125, 126, 127, 128, 129, 130, 131, 132, 133], "bullets": ["집단 연구의 혁신성과 연구 분야의 다양성을 높이기 위해 2027년부터 기존 선도연구센터를 미래연구센터 체계로 전환합니다. 대학의 우수 연구 그룹이 국가·사회적 수요에 대응하는 혁신적 연구를 수행하고 지속 가능한 역량을 확보하도록 지원합니다.", "미래연구센터는 미래연구·기초의과학·지역혁신의 3개 트랙, 5개 유형으로 구성됩니다. 미래연구 트랙에는 목표지향형 FRC-X, 탐구형 FRC-S, 혁신형 FRC-E가 있습니다.", "모든 트랙과 유형의 연구 기간은 5년과 2년, 총 7년입니다. 연구비는 목표지향형 15억 원 이내, 탐구형 18억 원 이내, 혁신형 22억 원 이내입니다. 기초의과학과 지역혁신 트랙은 각각 15억 원 이내로 지원할 예정입니다.", "대학 연구 그룹을 대상으로 하며, 기초의과학 트랙은 해당 분야 대학원이 설치된 대학, 지역혁신 트랙은 이공계 대학원이 설치된 지역 대학이 대상입니다. 나머지 유형의 대학원 설치 요건은 원문 자막이 불명확하므로 신청 요강을 확인해야 합니다.", "목표지향형은 참여 연구자 수에 제한 없이 연구진을 구성할 수 있습니다. 그 밖의 유형은 원칙적으로 8명 이상이며, 지역혁신 트랙은 8명 이내로 구성해야 합니다.", "후속 과제를 제외한 신규 선정 규모는 총 17개 내외입니다. 미래연구 트랙은 목표지향형 4개, 탐구형·혁신형 각 2개 내외입니다. 탐구형과 혁신형은 기존 종료 센터를 대상으로 별도의 후속 연구를 지원하며, 해당 센터는 3월 개시 일정을 확인해야 합니다.", "기초의과학 트랙은 4개 내외, 지역혁신 트랙은 5개 내외를 신규 선정합니다. 지역혁신 트랙은 2026년에는 신규 지원이 없었습니다. FRC-X의 구체적인 지원 분야와 방향은 논의 중이며, 확정 후 신청 요강에서 안내합니다."]}, {"id": "Z05-P03", "title": "기초연구실 구성과 지원 요건", "start": 2894, "end": 2976, "text": "기초연구실은 특정 주제의 소규모 연구 그룹을 지원하여 국가 기초연구 역량을 강화하는 사업입니다. 유형은 심화형과 혁신형으로 구분됩니다. 창의적·도전적 연구 집단 육성을 위해 기존 개척형을 2027년부터 혁신형으로 개편합니다. 두 유형 모두 지원 기간은 3년, 연구비는 연 5억 원 이내입니다. 연구진은 연구책임자를 포함하여 3~4명으로 구성해야 합니다. 신진 연구 인력은 심화형에 1명 이상, 혁신형에 2명 이상 포함되어야 합니다. 또한 박사후연구원 1명 이상을 반드시 포함해야 합니다. 구성 요건을 충족하지 못하면 요건 심사에서 탈락할 수 있으므로 신청 전에 확인해 주시기 바랍니다. 이 구간의 자동 자막에는 신규 지원 규모가 심화형 84개, 혁신형 37개 내외로 기록되어 있으나, 뒤의 종합 안내에서는 혁신형 36개로 제시됩니다. 정확한 수치는 최종 공고 확인이 필요합니다. 혁신형에는 AI를 활용한 과학 난제 해결 연구 지원이 포함되며, 구체적인 내용은 추후 공고합니다.", "source_blocks": [134, 135, 136, 137, 138, 139], "bullets": ["기초연구실은 특정 주제의 소규모 연구 그룹을 지원하여 국가 기초연구 역량을 강화하는 사업입니다. 유형은 심화형과 혁신형으로 구분됩니다. 창의적·도전적 연구 집단 육성을 위해 기존 개척형을 2027년부터 혁신형으로 개편합니다.", "두 유형 모두 지원 기간은 3년, 연구비는 연 5억 원 이내입니다. 연구진은 연구책임자를 포함하여 3~4명으로 구성해야 합니다.", "신진 연구 인력은 심화형에 1명 이상, 혁신형에 2명 이상 포함되어야 합니다. 또한 박사후연구원 1명 이상을 반드시 포함해야 합니다. 구성 요건을 충족하지 못하면 요건 심사에서 탈락할 수 있으므로 신청 전에 확인해 주시기 바랍니다.", "이 구간의 자동 자막에는 신규 지원 규모가 심화형 84개, 혁신형 37개 내외로 기록되어 있으나, 뒤의 종합 안내에서는 혁신형 36개로 제시됩니다. 정확한 수치는 최종 공고 확인이 필요합니다. 혁신형에는 AI를 활용한 과학 난제 해결 연구 지원이 포함되며, 구체적인 내용은 추후 공고합니다."]}, {"id": "Z05-P04", "title": "신규 지원 규모와 추진 일정", "start": 2976, "end": 3096, "text": "신규 지원 규모를 종합하면 국가연구소는 3개 내외입니다. 최종 규모는 2027년 정부 예산 확정에 따라 변경될 수 있습니다. 미래연구 트랙은 총 10개 내외로, 목표지향형 4개, 탐구형·혁신형 각 3개 내외입니다. 탐구형과 혁신형에는 후속 과제가 각각 1개 포함됩니다. 기초의과학 트랙은 4개, 지역혁신 트랙은 5개 내외입니다. 기초연구실은 심화형 84개, 혁신형 36개 등 총 120개 내외입니다. 앞선 세부 설명의 혁신형 수치와 차이가 있으므로 공고문을 확인해야 합니다. 전체 집단 연구지원사업 신규 과제는 총 142개 내외입니다. 12월 공고 후 2월 접수와 선정 평가를 거쳐 연구를 개시합니다. 국가연구소의 1차년도는 2027년 7~12월의 6개월이며, 미래연구센터와 기초연구실은 2027년 8월부터 2028년 7월까지 12개월간 지원합니다. 올해는 모든 사업이 7월 1일에 개시했으나, 2027년에는 기초연구실 평가가 2단계로 확대되는 점 등을 고려하여 해당 사업의 개시일을 8월 1일로 조정했습니다. 후속 신규 과제는 2027년 3월 1일 개시 예정이므로 대상 사업단은 별도 일정을 참고해 주시기 바랍니다.", "source_blocks": [140, 141, 142, 143, 144, 145, 146, 147, 148, 149], "bullets": ["신규 지원 규모를 종합하면 국가연구소는 3개 내외입니다. 최종 규모는 2027년 정부 예산 확정에 따라 변경될 수 있습니다.", "미래연구 트랙은 총 10개 내외로, 목표지향형 4개, 탐구형·혁신형 각 3개 내외입니다. 탐구형과 혁신형에는 후속 과제가 각각 1개 포함됩니다. 기초의과학 트랙은 4개, 지역혁신 트랙은 5개 내외입니다.", "기초연구실은 심화형 84개, 혁신형 36개 등 총 120개 내외입니다. 앞선 세부 설명의 혁신형 수치와 차이가 있으므로 공고문을 확인해야 합니다. 전체 집단 연구지원사업 신규 과제는 총 142개 내외입니다.", "12월 공고 후 2월 접수와 선정 평가를 거쳐 연구를 개시합니다. 국가연구소의 1차년도는 2027년 7~12월의 6개월이며, 미래연구센터와 기초연구실은 2027년 8월부터 2028년 7월까지 12개월간 지원합니다.", "올해는 모든 사업이 7월 1일에 개시했으나, 2027년에는 기초연구실 평가가 2단계로 확대되는 점 등을 고려하여 해당 사업의 개시일을 8월 1일로 조정했습니다. 후속 신규 과제는 2027년 3월 1일 개시 예정이므로 대상 사업단은 별도 일정을 참고해 주시기 바랍니다."]}], "summary": ["국가연구소, 미래연구센터, 기초연구실의 목적·지원 규모·연구진 구성 요건을 안내합니다.", "미래연구센터는 유형별 지원 목적과 구성 요건이 다르고, 기초연구실은 신진 연구 인력 등 필수 구성 요건을 충족해야 합니다.", "집단 연구의 세부 사항은 별도 공고 예정이며 사업별 연구 개시일도 구분됩니다."]}, {"id": "Z06", "title": "교육부 사업 추진 방향", "start": 3096, "end": 3390, "paragraphs": [{"id": "Z06-P01", "title": "사업 체계 개편", "start": 3096, "end": 3150, "text": "이어서 교육부 이공분야 학술연구지원사업을 안내합니다. 교육부 학술연구정책과에서 추진 방향을 설명합니다. 과기정통부 사업과 유사한 내용뿐 아니라 차이가 있는 사업도 있으므로 확인해 주시기 바랍니다. 내년도에는 학술연구 기반 구축 사업을 학술연구 인재 육성, 대학 연구 기반 구축, 지역 중심 혁신 지원, 통합 기초 지원의 네 영역으로 개편합니다. 각 영역을 차례로 설명드리겠습니다.", "source_blocks": [150, 151, 152], "bullets": ["이어서 교육부 이공분야 학술연구지원사업을 안내합니다. 교육부 학술연구정책과에서 추진 방향을 설명합니다. 과기정통부 사업과 유사한 내용뿐 아니라 차이가 있는 사업도 있으므로 확인해 주시기 바랍니다.", "내년도에는 학술연구 기반 구축 사업을 학술연구 인재 육성, 대학 연구 기반 구축, 지역 중심 혁신 지원, 통합 기초 지원의 네 영역으로 개편합니다. 각 영역을 차례로 설명드리겠습니다."]}, {"id": "Z06-P02", "title": "학술연구 인재 육성", "start": 3150, "end": 3206, "text": "학술연구 인재 육성은 석사과정부터 전임 교원까지 연구자의 성장 단계에 걸쳐 지원하는 사업입니다. 이 구간의 예산은 자동 자막에서 금액 단위가 누락되어 발표자료 확인이 필요합니다. 대학원생 연구장려금은 석사·박사과정생의 학위논문 연구를 지원합니다. 박사후 성장 지원은 박사후연구원에게 국내·국외 연수 기회를 제공합니다. 기본 연구 포용형은 대학 비전임 교원과 박사후연구원을 지원합니다. 미래도전 연구 지원은 기초과학 분야 대학 연구자의 다학제 융합 연구를 지원하며, 보호 연구는 국가 차원의 보호와 진흥이 필요한 분야를 지원합니다. 다음은 대학 연구 기반 구축입니다. 이 영역에는 총 2,817억 원이 편성되었습니다.", "source_blocks": [153, 154], "bullets": ["학술연구 인재 육성은 석사과정부터 전임 교원까지 연구자의 성장 단계에 걸쳐 지원하는 사업입니다. 이 구간의 예산은 자동 자막에서 금액 단위가 누락되어 발표자료 확인이 필요합니다.", "대학원생 연구장려금은 석사·박사과정생의 학위논문 연구를 지원합니다. 박사후 성장 지원은 박사후연구원에게 국내·국외 연수 기회를 제공합니다.", "기본 연구 포용형은 대학 비전임 교원과 박사후연구원을 지원합니다. 미래도전 연구 지원은 기초과학 분야 대학 연구자의 다학제 융합 연구를 지원하며, 보호 연구는 국가 차원의 보호와 진흥이 필요한 분야를 지원합니다.", "다음은 대학 연구 기반 구축입니다. 이 영역에는 총 2,817억 원이 편성되었습니다."]}, {"id": "Z06-P03", "title": "대학 연구 기반과 지역 혁신 지원", "start": 3206, "end": 3291, "text": "기초연구소 지원에는 대학중점연구소와 대학 기초연구소를 지원하는 G-LAMP 사업이 포함됩니다. 기초 인프라 지원에서는 대학 내 장비·시설의 거버넌스를 개편하고 통합 관리 체계를 구축하는 사업을 신설합니다. 발표에서 ‘셰어’로 소개한 사업의 세부 내용은 내년 초 핵심연구지원센터 사업과 함께 별도 설명회에서 안내할 예정입니다. 핵심연구지원센터는 분야별 공동 활용 인프라와 첨단 R&D 장비 구축을 통해 장비 전문 인력을 육성하고 연구를 지원합니다. 대학 연구 기반 구축 영역에서는 국가연구소 사업도 과기정통부와 함께 추진합니다. 지역 중심 혁신 지원에는 총 171억 원을 편성했다고 안내합니다. 글로컬랩은 지역 산업에 기반한 대학 연구소의 역량을 강화하여 지역 발전을 선도하도록 지원합니다. 글로컬 R&D는 비수도권 대학 연구자를 중심으로 기초연구와 국제 협업을 지원합니다. 통합 기초 지원에는 661억 원이 편성되었으며, 현재는 일몰에 따라 계속 사업만 지원하고 있습니다.", "source_blocks": [155, 156, 157], "bullets": ["기초연구소 지원에는 대학중점연구소와 대학 기초연구소를 지원하는 G-LAMP 사업이 포함됩니다.", "기초 인프라 지원에서는 대학 내 장비·시설의 거버넌스를 개편하고 통합 관리 체계를 구축하는 사업을 신설합니다. 발표에서 ‘셰어’로 소개한 사업의 세부 내용은 내년 초 핵심연구지원센터 사업과 함께 별도 설명회에서 안내할 예정입니다.", "핵심연구지원센터는 분야별 공동 활용 인프라와 첨단 R&D 장비 구축을 통해 장비 전문 인력을 육성하고 연구를 지원합니다. 대학 연구 기반 구축 영역에서는 국가연구소 사업도 과기정통부와 함께 추진합니다.", "지역 중심 혁신 지원에는 총 171억 원을 편성했다고 안내합니다. 글로컬랩은 지역 산업에 기반한 대학 연구소의 역량을 강화하여 지역 발전을 선도하도록 지원합니다. 글로컬 R&D는 비수도권 대학 연구자를 중심으로 기초연구와 국제 협업을 지원합니다.", "통합 기초 지원에는 661억 원이 편성되었으며, 현재는 일몰에 따라 계속 사업만 지원하고 있습니다."]}, {"id": "Z06-P04", "title": "예산과 신규 지원 계획", "start": 3291, "end": 3390, "text": "교육부의 내년도 예산은 정부안 기준 6,469억 원입니다. 국회 논의를 거쳐 최종 확정하며, 자세한 내용은 내년 초 사업 시행 계획 공고에서 안내합니다. 학술연구 인재 육성에서는 기본 연구와 미래도전 연구 지원을 확대할 계획입니다. 대학 연구 기반 구축 중 대학중점연구소는 일몰되어 계속 과제만 지원합니다. G-LAMP의 신규 선정 규모는 자막이 불명확하여 발표자료 확인이 필요합니다. 핵심연구지원센터는 신규·후속을 합쳐 15개, ‘셰어’ 사업은 3개를 지원할 계획입니다. 국가연구소는 과기정통부와 함께 3개를 지원하도록 준비하고 있습니다. 글로컬랩은 계속 과제 24개에 더해 신규 5개를 선정할 계획이며, 현재 거점형 3개와 컨소시엄형 2개로 준비하고 있습니다. 글로컬 R&D는 신규 112개 과제를 계획하고 있습니다. 이어서 한국연구재단 이공학술지원팀에서 세부 사업과 신청 유의 사항을 설명합니다.", "source_blocks": [158, 159, 160], "bullets": ["교육부의 내년도 예산은 정부안 기준 6,469억 원입니다. 국회 논의를 거쳐 최종 확정하며, 자세한 내용은 내년 초 사업 시행 계획 공고에서 안내합니다.", "학술연구 인재 육성에서는 기본 연구와 미래도전 연구 지원을 확대할 계획입니다. 대학 연구 기반 구축 중 대학중점연구소는 일몰되어 계속 과제만 지원합니다. G-LAMP의 신규 선정 규모는 자막이 불명확하여 발표자료 확인이 필요합니다.", "핵심연구지원센터는 신규·후속을 합쳐 15개, ‘셰어’ 사업은 3개를 지원할 계획입니다. 국가연구소는 과기정통부와 함께 3개를 지원하도록 준비하고 있습니다.", "글로컬랩은 계속 과제 24개에 더해 신규 5개를 선정할 계획이며, 현재 거점형 3개와 컨소시엄형 2개로 준비하고 있습니다. 글로컬 R&D는 신규 112개 과제를 계획하고 있습니다. 이어서 한국연구재단 이공학술지원팀에서 세부 사업과 신청 유의 사항을 설명합니다."]}], "summary": ["교육부 사업을 학술연구 인재 육성, 대학 연구 기반 구축, 지역 중심 혁신 지원, 통합 기초 지원으로 설명합니다.", "대학원생·박사후연구원 지원과 대학 연구소·공동 활용 장비 기반 확충, 지역 혁신 사업을 함께 추진합니다.", "예산과 신규 선정 계획은 정부안 기준이며, 최종 내용은 추후 시행 계획과 공고에서 확인해야 합니다."]}, {"id": "Z07", "title": "교육부 사업별 지원 내용과 신청", "start": 3391, "end": 3873, "paragraphs": [{"id": "Z07-P01", "title": "대학원생 연구장려금", "start": 3391, "end": 3505, "text": "한국연구재단 이공학술지원팀에서 교육부 사업 내용과 신규 과제 신청 유의 사항을 설명합니다. 안내 내용은 2027년 시행 계획 수립 과정에서 변경될 수 있으며, 자세한 사항은 사업별 공고문에서 확인해야 합니다. 학문후속세대 지원은 대학원생부터 박사후연구원과 신진 연구자까지 성장 단계에 맞춰 연구 활동을 지원하는 사업입니다. 대학원생 연구장려금은 석사·박사과정생의 학위논문 연구비를 지원합니다. 석사과정 지원은 국내 대학원에 전일제로 재학 중인 학생을 대상으로 합니다. 석사·석박사통합과정의 학기 요건은 자동 자막에서 과정명이 중복되어 정확한 구분을 신청 요강에서 확인해야 합니다. 연구 기간은 1년, 연구비는 연 1,200만 원이며 연구수당은 계상할 수 없습니다. 신규 1,044개 과제에 125억 2,800만 원을 지원하고 9월 1일에 개시합니다. 박사과정 지원은 국내 대학원 전일제 박사과정생 등을 대상으로 하며, 통합과정·수료생의 세부 포함 범위는 신청 요강을 확인해야 합니다. 연구 기간은 1~2년, 연구비는 연 2,500만 원이고 인건비 1천만 원 이상을 반드시 계상해야 합니다. 신규 782개 과제를 선정하여 9월 1일에 개시합니다. 총예산은 자동 자막의 숫자가 불명확하므로 발표자료 확인이 필요합니다.", "source_blocks": [161, 162, 163, 164, 165, 166], "bullets": ["한국연구재단 이공학술지원팀에서 교육부 사업 내용과 신규 과제 신청 유의 사항을 설명합니다. 안내 내용은 2027년 시행 계획 수립 과정에서 변경될 수 있으며, 자세한 사항은 사업별 공고문에서 확인해야 합니다.", "학문후속세대 지원은 대학원생부터 박사후연구원과 신진 연구자까지 성장 단계에 맞춰 연구 활동을 지원하는 사업입니다. 대학원생 연구장려금은 석사·박사과정생의 학위논문 연구비를 지원합니다.", "석사과정 지원은 국내 대학원에 전일제로 재학 중인 학생을 대상으로 합니다. 석사·석박사통합과정의 학기 요건은 자동 자막에서 과정명이 중복되어 정확한 구분을 신청 요강에서 확인해야 합니다. 연구 기간은 1년, 연구비는 연 1,200만 원이며 연구수당은 계상할 수 없습니다. 신규 1,044개 과제에 125억 2,800만 원을 지원하고 9월 1일에 개시합니다.", "박사과정 지원은 국내 대학원 전일제 박사과정생 등을 대상으로 하며, 통합과정·수료생의 세부 포함 범위는 신청 요강을 확인해야 합니다. 연구 기간은 1~2년, 연구비는 연 2,500만 원이고 인건비 1천만 원 이상을 반드시 계상해야 합니다. 신규 782개 과제를 선정하여 9월 1일에 개시합니다. 총예산은 자동 자막의 숫자가 불명확하므로 발표자료 확인이 필요합니다."]}, {"id": "Z07-P02", "title": "박사후 성장 지원", "start": 3505, "end": 3551, "text": "박사후 성장 지원은 박사학위 취득 후 연구 역량을 높이고 독립적인 연구자로 성장하도록 돕는 사업입니다. 박사후 국내 연수는 국내 대학 박사학위 취득 후 5년 이내인 연구자를 대상으로 합니다. 연구 기간은 1~3년, 연구비는 연 6천만 원이며, 신규 70개 과제에 총 21억 원을 지원하고 9월 1일에 개시합니다. 박사후 국외 연수는 국내외 대학 박사학위 취득 후 5년 이내인 연구자를 대상으로 합니다. 연구 기간은 1년, 연구비는 6천만 원으로 안내하며, 신규 80개 과제에 총 48억 원을 지원하고 9월 1일에 개시합니다.", "source_blocks": [167], "bullets": ["박사후 성장 지원은 박사학위 취득 후 연구 역량을 높이고 독립적인 연구자로 성장하도록 돕는 사업입니다.", "박사후 국내 연수는 국내 대학 박사학위 취득 후 5년 이내인 연구자를 대상으로 합니다. 연구 기간은 1~3년, 연구비는 연 6천만 원이며, 신규 70개 과제에 총 21억 원을 지원하고 9월 1일에 개시합니다.", "박사후 국외 연수는 국내외 대학 박사학위 취득 후 5년 이내인 연구자를 대상으로 합니다. 연구 기간은 1년, 연구비는 6천만 원으로 안내하며, 신규 80개 과제에 총 48억 원을 지원하고 9월 1일에 개시합니다."]}, {"id": "Z07-P03", "title": "기본 연구·미래도전·보호 연구", "start": 3551, "end": 3651, "text": "학술 생태계 조성 지원은 안정적인 연구 기회와 다양한 경험을 보장하기 위해 기본 연구 포용형, 미래도전 연구 지원, 보호 연구 등 연구자 맞춤형 지원을 제공합니다. 기본 연구 포용형은 대학 소속 비전임 교원과 박사후연구원의 조기 정착을 돕기 위해 연구 경험과 기회를 제공합니다. 단독 연구를 지원하며 연구 기간은 3년입니다. 신규 800개 과제에 총 240억 원을 지원하고 9월 1일에 개시합니다. 과제당 연간 연구비는 자막이 불명확하여 발표자료 확인이 필요합니다. 미래도전 연구 지원은 새로운 영역을 개척하고 패러다임의 변화를 가져올 수 있는 잠재력 높은 다학제 협력 연구를 지원합니다. 대학 소속 연구자의 공동 연구를 대상으로 하며, 연구 기간은 5년, 연구비는 연 1억 6천만 원입니다. 신규 35개 과제에 총 28억 원을 지원하고 9월 1일에 개시합니다. 보호 연구는 국가 차원의 보호·육성이 필요한 분야를 지원하여 학문의 균형 발전을 도모합니다. 대학 소속 연구자의 공동 또는 단독 연구를 지원하며 연구 기간은 5년입니다. 단독 연구비는 1억 원으로 안내하고, 공동 연구비는 자막의 ‘2억 8’만으로는 정확한 금액을 확인할 수 없습니다. 신규 35개 과제에 총 21억 원을 지원하고 9월 1일에 개시합니다.", "source_blocks": [168, 169, 170, 171], "bullets": ["학술 생태계 조성 지원은 안정적인 연구 기회와 다양한 경험을 보장하기 위해 기본 연구 포용형, 미래도전 연구 지원, 보호 연구 등 연구자 맞춤형 지원을 제공합니다.", "기본 연구 포용형은 대학 소속 비전임 교원과 박사후연구원의 조기 정착을 돕기 위해 연구 경험과 기회를 제공합니다. 단독 연구를 지원하며 연구 기간은 3년입니다. 신규 800개 과제에 총 240억 원을 지원하고 9월 1일에 개시합니다. 과제당 연간 연구비는 자막이 불명확하여 발표자료 확인이 필요합니다.", "미래도전 연구 지원은 새로운 영역을 개척하고 패러다임의 변화를 가져올 수 있는 잠재력 높은 다학제 협력 연구를 지원합니다. 대학 소속 연구자의 공동 연구를 대상으로 하며, 연구 기간은 5년, 연구비는 연 1억 6천만 원입니다. 신규 35개 과제에 총 28억 원을 지원하고 9월 1일에 개시합니다.", "보호 연구는 국가 차원의 보호·육성이 필요한 분야를 지원하여 학문의 균형 발전을 도모합니다. 대학 소속 연구자의 공동 또는 단독 연구를 지원하며 연구 기간은 5년입니다. 단독 연구비는 1억 원으로 안내하고, 공동 연구비는 자막의 ‘2억 8’만으로는 정확한 금액을 확인할 수 없습니다. 신규 35개 과제에 총 21억 원을 지원하고 9월 1일에 개시합니다."]}, {"id": "Z07-P04", "title": "대학 연구 기반·지역 혁신 지원", "start": 3651, "end": 3761, "text": "대학 연구 기반 구축과 인프라 지원은 대학의 기초연구 육성·운영 체계를 확충하여 안정적인 연구 환경을 조성하는 사업입니다. 주요 사업으로 핵심연구지원센터 조성·운영과 대학 연구지원 기반 구축을 안내합니다. 연구시설·장비의 공동 활용을 활성화하고 대학 내 지원 기반을 체계적으로 구축하는 것이 목적입니다. 담당 기관에서 자세한 내용을 별도로 안내할 예정입니다. G-LAMP도 차년도 계획을 수립하여 안내하며, 국가연구소는 앞선 과기정통부 설명과 같습니다. 지역 중심 혁신 지원에는 글로컬랩과 글로컬 R&D가 있습니다. 지역 수요와 대학의 강점을 연결하고 대학·연구기관 간 협업을 통해 지속 가능한 연구 기반을 마련하는 데 중점을 둡니다. 글로컬랩은 대학 부설 연구소를 대상으로 거점형과 컨소시엄형을 구분하여 선정합니다. 연구 기간은 9년이며, 컨소시엄형 연구비는 연 24억 원입니다. 거점형 연구비는 자동 자막에서 누락되어 확인이 필요합니다. 신규 5개 내외에 42억 5천만 원을 지원하고 9월 1일에 개시할 예정입니다. 유형별 선정 수는 변동될 수 있습니다.", "source_blocks": [172, 173, 174, 175, 176, 177], "bullets": ["대학 연구 기반 구축과 인프라 지원은 대학의 기초연구 육성·운영 체계를 확충하여 안정적인 연구 환경을 조성하는 사업입니다. 주요 사업으로 핵심연구지원센터 조성·운영과 대학 연구지원 기반 구축을 안내합니다.", "연구시설·장비의 공동 활용을 활성화하고 대학 내 지원 기반을 체계적으로 구축하는 것이 목적입니다. 담당 기관에서 자세한 내용을 별도로 안내할 예정입니다. G-LAMP도 차년도 계획을 수립하여 안내하며, 국가연구소는 앞선 과기정통부 설명과 같습니다.", "지역 중심 혁신 지원에는 글로컬랩과 글로컬 R&D가 있습니다. 지역 수요와 대학의 강점을 연결하고 대학·연구기관 간 협업을 통해 지속 가능한 연구 기반을 마련하는 데 중점을 둡니다.", "글로컬랩은 대학 부설 연구소를 대상으로 거점형과 컨소시엄형을 구분하여 선정합니다. 연구 기간은 9년이며, 컨소시엄형 연구비는 연 24억 원입니다. 거점형 연구비는 자동 자막에서 누락되어 확인이 필요합니다. 신규 5개 내외에 42억 5천만 원을 지원하고 9월 1일에 개시할 예정입니다. 유형별 선정 수는 변동될 수 있습니다."]}, {"id": "Z07-P05", "title": "신청 자격·수행 제한·유의 사항", "start": 3761, "end": 3873, "text": "사업마다 학위 취득 시점, 연구 경력, 소속 기관, 참여 자격이 다를 수 있으므로 공고문과 신청 요강을 확인해야 합니다. 개별 사업 내에서는 한 개 과제만 신청·수행할 수 있으며, 집단 사업에서도 연구책임자 또는 공동연구자로 한 개 과제만 신청·수행할 수 있습니다. 수행 중인 과제가 신청 과제 개시일로부터 10개월 이내에 종료되는 경우에는 예외를 인정합니다. 기초 인프라 지원 사업은 다른 집단 과제와의 중복 수행이 허용됩니다. 정부 R&D 공통 사항인 동시 수행 과제 수와 연구책임자 수행 과제 수 제한, 신청 절차는 앞선 과기정통부 설명과 같습니다. 2027년 과기정통부·교육부 신청 연구계획서를 대상으로 차별성 검토를 실시하며, 차별성이 없는 것으로 판정되면 불이익을 받을 수 있습니다. 신청 요강을 준수하지 않으면 요건 심사에서 탈락할 수 있으므로 연구 단계와 목표에 적합한 사업을 선택하고 자격·계획·일정을 충분히 검토해 주시기 바랍니다.", "source_blocks": [178, 179, 180, 181, 182, 183], "bullets": ["사업마다 학위 취득 시점, 연구 경력, 소속 기관, 참여 자격이 다를 수 있으므로 공고문과 신청 요강을 확인해야 합니다.", "개별 사업 내에서는 한 개 과제만 신청·수행할 수 있으며, 집단 사업에서도 연구책임자 또는 공동연구자로 한 개 과제만 신청·수행할 수 있습니다. 수행 중인 과제가 신청 과제 개시일로부터 10개월 이내에 종료되는 경우에는 예외를 인정합니다. 기초 인프라 지원 사업은 다른 집단 과제와의 중복 수행이 허용됩니다.", "정부 R&D 공통 사항인 동시 수행 과제 수와 연구책임자 수행 과제 수 제한, 신청 절차는 앞선 과기정통부 설명과 같습니다.", "2027년 과기정통부·교육부 신청 연구계획서를 대상으로 차별성 검토를 실시하며, 차별성이 없는 것으로 판정되면 불이익을 받을 수 있습니다. 신청 요강을 준수하지 않으면 요건 심사에서 탈락할 수 있으므로 연구 단계와 목표에 적합한 사업을 선택하고 자격·계획·일정을 충분히 검토해 주시기 바랍니다."]}], "summary": ["대학원생 연구장려금, 박사후 성장 지원, 기본·미래도전·보호 연구 등 연구 단계별 지원 내용을 안내합니다.", "대학 연구 인프라와 글로컬 사업의 지원 방향도 설명합니다.", "학위 취득 시점·소속·참여 자격과 중복 수행 제한을 확인하고, 신청 과제의 차별성과 제출 절차를 점검해야 합니다."]}, {"id": "Z08", "title": "선정 평가 방식과 기준", "start": 3873, "end": 4439, "paragraphs": [{"id": "Z08-P01", "title": "평가 유형: 서면·토론·발표·심층", "start": 3873, "end": 3991, "text": "한국연구재단 자연과학단에서 기초연구사업 평가제도를 설명합니다. 신청하려는 사업이 어떤 방법과 기준으로 평가되는지 안내하겠습니다. 평가 유형은 온라인 서면, 토론, 발표 평가로 구분되며 일부 사업에는 해외 서면과 심층 평가를 적용합니다. 온라인 서면 평가는 신청 연구계획서를 개별적으로 평가하는 방식입니다. RB 분야 또는 유사 세부 분야를 기준으로 평가 대상 과제를 구성하고, 평가위원 3~5명이 각각 점수를 부여합니다. 평가 분과당 과제 규모는 자막의 단위가 불명확하므로 발표자료를 참고해 주시기 바랍니다. 해외 서면 평가는 리더 연구에 적용하며, 해외 석학이 평가위원으로 참여하는 온라인 서면 평가입니다. 토론 평가는 평가위원들이 직접 모여 신청 계획서를 검토하고 토론하여 우수 과제를 추천하는 방식입니다. 발표 평가는 계획서 검토에 연구책임자의 발표·질의응답과 평가위원 토론을 더합니다. 심층 평가는 분야별 최고 수준의 전문가로 위원회를 구성하고 충분한 시간을 두고 토론, 연구책임자 발표, 질의응답을 진행합니다. 리더 연구·미래연구센터·국가연구소 선정 평가에 적용됩니다.", "source_blocks": [184, 185, 186, 187, 188, 189, 190, 191, 192, 193], "bullets": ["한국연구재단 자연과학단에서 기초연구사업 평가제도를 설명합니다. 신청하려는 사업이 어떤 방법과 기준으로 평가되는지 안내하겠습니다. 평가 유형은 온라인 서면, 토론, 발표 평가로 구분되며 일부 사업에는 해외 서면과 심층 평가를 적용합니다.", "온라인 서면 평가는 신청 연구계획서를 개별적으로 평가하는 방식입니다. RB 분야 또는 유사 세부 분야를 기준으로 평가 대상 과제를 구성하고, 평가위원 3~5명이 각각 점수를 부여합니다. 평가 분과당 과제 규모는 자막의 단위가 불명확하므로 발표자료를 참고해 주시기 바랍니다.", "해외 서면 평가는 리더 연구에 적용하며, 해외 석학이 평가위원으로 참여하는 온라인 서면 평가입니다.", "토론 평가는 평가위원들이 직접 모여 신청 계획서를 검토하고 토론하여 우수 과제를 추천하는 방식입니다. 발표 평가는 계획서 검토에 연구책임자의 발표·질의응답과 평가위원 토론을 더합니다.", "심층 평가는 분야별 최고 수준의 전문가로 위원회를 구성하고 충분한 시간을 두고 토론, 연구책임자 발표, 질의응답을 진행합니다. 리더 연구·미래연구센터·국가연구소 선정 평가에 적용됩니다."]}, {"id": "Z08-P02", "title": "과기정통부 사업별 평가 절차", "start": 3992, "end": 4080, "text": "리더 연구 유형 A·B는 1차 예비 평가를 토론 방식으로 진행합니다. 2차 본평가는 해외 서면과 발표 평가로 진행하며 심층 평가를 적용합니다. 핵심 연구 유형 C는 토론, 유형 B·A는 온라인 서면 평가로 진행합니다. 한우물 파기 기초연구는 토론 평가를 실시합니다. 글로벌 매칭형은 1차 온라인 서면 또는 토론 평가, 2차 양국 공동 패널 토론 평가를 진행합니다. 하반기에 개시하는 전략형과 기본 연구 B·A는 온라인 서면 평가를 실시합니다. 신진 연구 유형 B·A는 온라인 서면 평가, 신진 연구자 인프라 지원은 1차 토론·2차 발표 평가, 신진 지역 장기 연구는 토론 평가를 실시합니다. 세종과학 펠로우십 국내·복귀 유치 트랙은 모두 온라인 서면 평가입니다. 국가연구소는 1차 서면·토론, 2차 발표 평가로 진행하며 심층 평가를 적용합니다. 미래연구센터도 1차 토론·2차 발표 및 심층 평가를 적용합니다. 기초연구실은 2027년부터 1차 토론·2차 발표 평가를 실시할 예정입니다.", "source_blocks": [194, 195, 196, 197, 198, 199, 200, 201], "bullets": ["리더 연구 유형 A·B는 1차 예비 평가를 토론 방식으로 진행합니다. 2차 본평가는 해외 서면과 발표 평가로 진행하며 심층 평가를 적용합니다.", "핵심 연구 유형 C는 토론, 유형 B·A는 온라인 서면 평가로 진행합니다. 한우물 파기 기초연구는 토론 평가를 실시합니다.", "글로벌 매칭형은 1차 온라인 서면 또는 토론 평가, 2차 양국 공동 패널 토론 평가를 진행합니다. 하반기에 개시하는 전략형과 기본 연구 B·A는 온라인 서면 평가를 실시합니다.", "신진 연구 유형 B·A는 온라인 서면 평가, 신진 연구자 인프라 지원은 1차 토론·2차 발표 평가, 신진 지역 장기 연구는 토론 평가를 실시합니다. 세종과학 펠로우십 국내·복귀 유치 트랙은 모두 온라인 서면 평가입니다.", "국가연구소는 1차 서면·토론, 2차 발표 평가로 진행하며 심층 평가를 적용합니다. 미래연구센터도 1차 토론·2차 발표 및 심층 평가를 적용합니다. 기초연구실은 2027년부터 1차 토론·2차 발표 평가를 실시할 예정입니다."]}, {"id": "Z08-P03", "title": "개인 연구 평가 항목과 가중치", "start": 4081, "end": 4223, "text": "2027년부터 도전적·혁신적 연구를 촉진하기 위해 혁신성을 중심으로 선정 평가를 진행합니다. 창의성·도전성 항목을 평가할 때 목표의 도전성과 혁신성을 함께 고려할 예정입니다. 사업의 목적·특성과 평가 방식에 따라 배점 또는 가중치를 다르게 적용합니다. 리더 연구의 1차 예비 평가 배점은 창의성·원천성·도전성 50점, 연구자의 우수성 40점, 성과 활용 및 기대 효과 10점입니다. 2차 본평가는 창의성·원천성·도전성 35점, 연구책임자 역량 45점, 목표의 타당성·달성 가능성 10점, 유치기관 지원 의지 10점입니다. 핵심 연구 유형 C는 토론 합의 평가로, 4개 항목에 각각 40%·30%·20%·10%의 가중치를 적용합니다. 유형 B·A는 온라인 서면 평가에서 같은 가중치를 적용하여 총 100점을 부여합니다. 기본 연구 B·A는 온라인 서면 평가로 진행하며 4개 항목에 각각 50%·30%·10%·10%를 적용하여 총 100점을 부여합니다. 도약형은 CRB를 중심으로 구성한 전문 평가단의 1차 토론 평가에서 2개 항목에 70%·30%의 가중치를 적용합니다. 표에서 퍼센트는 가중치, 점 단위는 부여 점수를 뜻합니다. 신진 연구 유형 B·A와 세종과학 펠로우십의 세부 항목은 화면 자료를 참고해 주시기 바랍니다. 특히 세종 국내 트랙과 복귀·유치 트랙은 항목과 가중치가 다르므로 신청 유형별 기준을 확인해야 합니다.", "source_blocks": [202, 203, 204, 205, 206, 207], "bullets": ["2027년부터 도전적·혁신적 연구를 촉진하기 위해 혁신성을 중심으로 선정 평가를 진행합니다. 창의성·도전성 항목을 평가할 때 목표의 도전성과 혁신성을 함께 고려할 예정입니다. 사업의 목적·특성과 평가 방식에 따라 배점 또는 가중치를 다르게 적용합니다.", "리더 연구의 1차 예비 평가 배점은 창의성·원천성·도전성 50점, 연구자의 우수성 40점, 성과 활용 및 기대 효과 10점입니다. 2차 본평가는 창의성·원천성·도전성 35점, 연구책임자 역량 45점, 목표의 타당성·달성 가능성 10점, 유치기관 지원 의지 10점입니다.", "핵심 연구 유형 C는 토론 합의 평가로, 4개 항목에 각각 40%·30%·20%·10%의 가중치를 적용합니다. 유형 B·A는 온라인 서면 평가에서 같은 가중치를 적용하여 총 100점을 부여합니다.", "기본 연구 B·A는 온라인 서면 평가로 진행하며 4개 항목에 각각 50%·30%·10%·10%를 적용하여 총 100점을 부여합니다.", "도약형은 CRB를 중심으로 구성한 전문 평가단의 1차 토론 평가에서 2개 항목에 70%·30%의 가중치를 적용합니다. 표에서 퍼센트는 가중치, 점 단위는 부여 점수를 뜻합니다.", "신진 연구 유형 B·A와 세종과학 펠로우십의 세부 항목은 화면 자료를 참고해 주시기 바랍니다. 특히 세종 국내 트랙과 복귀·유치 트랙은 항목과 가중치가 다르므로 신청 유형별 기준을 확인해야 합니다."]}, {"id": "Z08-P04", "title": "평가 방식 변경 사항", "start": 4225, "end": 4271, "text": "한우물 파기 기초연구, 신진 연구자 인프라 지원, 핵심 연구 전략형의 평가 항목은 자료를 참고해 주시기 바랍니다. 변경된 평가 방식을 추가로 안내합니다. 한우물 파기는 기존 1차 토론·2차 발표 방식에서 2027년부터 토론 평가만 실시하는 방식으로 변경합니다. 전략형은 2026년 예비 계획서 평가 후 본계획서를 제출받는 2단계 방식이었으나, 2027년에는 계획서를 한 차례 접수하여 온라인 서면 평가를 실시합니다. 글로벌 매칭형의 평가 항목도 화면 자료를 참고해 주시기 바랍니다.", "source_blocks": [208, 209, 210], "bullets": ["한우물 파기 기초연구, 신진 연구자 인프라 지원, 핵심 연구 전략형의 평가 항목은 자료를 참고해 주시기 바랍니다. 변경된 평가 방식을 추가로 안내합니다.", "한우물 파기는 기존 1차 토론·2차 발표 방식에서 2027년부터 토론 평가만 실시하는 방식으로 변경합니다.", "전략형은 2026년 예비 계획서 평가 후 본계획서를 제출받는 2단계 방식이었으나, 2027년에는 계획서를 한 차례 접수하여 온라인 서면 평가를 실시합니다. 글로벌 매칭형의 평가 항목도 화면 자료를 참고해 주시기 바랍니다."]}, {"id": "Z08-P05", "title": "집단 연구 평가 기준", "start": 4272, "end": 4360, "text": "기초연구실은 2027년부터 1차 토론·2차 발표 평가를 실시합니다. 1차는 항목별 가중치에 따른 합의 방식, 2차는 개별 점수 부여 방식입니다. 세부 평가 항목과 가중치는 자료를 참고해 주시기 바랍니다. 미래연구센터는 분야와 목적에 따라 유형별 평가 항목이 다르지만 공통적으로 1차 토론·2차 발표 평가를 진행합니다. FRC-X의 최종 평가 항목은 신규 공고에서 확인해야 합니다. 국가연구소는 연구개발, 연구소 운영, 지원 의지의 세 영역으로 평가한다고 안내합니다. 지원 의지 항목의 정확한 명칭과 배점은 발표자료를 참고해 주시기 바랍니다. 향후 세부 평가 계획에 따라 변경될 수 있습니다. 각 사업의 평가 항목은 신청 요강에서도 확인할 수 있습니다.", "source_blocks": [211, 212, 213, 214, 215, 216, 217], "bullets": ["기초연구실은 2027년부터 1차 토론·2차 발표 평가를 실시합니다. 1차는 항목별 가중치에 따른 합의 방식, 2차는 개별 점수 부여 방식입니다. 세부 평가 항목과 가중치는 자료를 참고해 주시기 바랍니다.", "미래연구센터는 분야와 목적에 따라 유형별 평가 항목이 다르지만 공통적으로 1차 토론·2차 발표 평가를 진행합니다. FRC-X의 최종 평가 항목은 신규 공고에서 확인해야 합니다.", "국가연구소는 연구개발, 연구소 운영, 지원 의지의 세 영역으로 평가한다고 안내합니다. 지원 의지 항목의 정확한 명칭과 배점은 발표자료를 참고해 주시기 바랍니다. 향후 세부 평가 계획에 따라 변경될 수 있습니다.", "각 사업의 평가 항목은 신청 요강에서도 확인할 수 있습니다."]}, {"id": "Z08-P06", "title": "교육부 사업 평가와 확인 사항", "start": 4361, "end": 4439, "text": "교육부 학술연구 인재 육성 중 석사과정 연구장려금은 전문 평가단의 토론 평가, 박사과정 연구장려금과 박사후 국내·국외 연수는 온라인 평가로 진행할 계획입니다. 기본 연구 포용형은 온라인 평가, 미래도전 연구 지원과 보호 연구는 토론 평가를 진행할 예정입니다. 글로컬랩은 1차 토론·2차 발표, 글로컬 R&D는 온라인 평가를 실시합니다. 교육부 사업 종합 계획은 아직 확정되지 않았으므로 평가 방식·항목·배점은 사업 공고 시 변경될 수 있습니다. 신청하려는 사업의 최종 평가 기준을 신청 요강에서 반드시 확인해 주시기 바랍니다. 이상으로 평가제도 설명을 마치겠습니다.", "source_blocks": [218, 219, 220, 221, 222], "bullets": ["교육부 학술연구 인재 육성 중 석사과정 연구장려금은 전문 평가단의 토론 평가, 박사과정 연구장려금과 박사후 국내·국외 연수는 온라인 평가로 진행할 계획입니다.", "기본 연구 포용형은 온라인 평가, 미래도전 연구 지원과 보호 연구는 토론 평가를 진행할 예정입니다. 글로컬랩은 1차 토론·2차 발표, 글로컬 R&D는 온라인 평가를 실시합니다.", "교육부 사업 종합 계획은 아직 확정되지 않았으므로 평가 방식·항목·배점은 사업 공고 시 변경될 수 있습니다. 신청하려는 사업의 최종 평가 기준을 신청 요강에서 반드시 확인해 주시기 바랍니다. 이상으로 평가제도 설명을 마치겠습니다."]}], "summary": ["온라인 서면·토론·발표·심층 평가의 차이와 사업별 평가 절차를 설명합니다.", "평가 항목과 가중치는 사업 유형마다 다르며, 혁신성과 도전성을 고려하는 방향을 안내합니다.", "한우물 파기·전략형·기초연구실 등의 평가 방식 변경을 설명합니다. 최종 기준은 해당 사업 신청 요강에서 확인해야 합니다."]}, {"id": "Z09", "title": "개인 연구 FAQ", "start": 4439, "end": 5505, "paragraphs": [{"id": "Z09-P01", "title": "출연연 소속 연구자 제한과 리더 연구 신청", "start": 4439, "end": 4611, "text": "개인 연구지원사업의 주요 질문에 답변드리겠습니다. 먼저 PBS가 폐지된 출연연 소속 연구자의 신규 신청과, 과제 수행 중 해당 출연연으로 이직할 때의 처리 기준입니다. 해당 출연연 소속 연구자는 원칙적으로 신규 신청을 할 수 없습니다. 2026년 2차 신규 과제에 선정되어 수행 중인 연구자가 해당 출연연으로 이직하면 과제를 중단해야 하며, 정당한 사유에 따른 중단으로 처리할 예정입니다. 그보다 앞서 선정된 과제는 계속 수행할 수 있다고 안내합니다. 정확한 적용 시점은 신청 요강을 확인해야 합니다. 예외적으로 개인 기초연구 2차 공고의 핵심 연구 전략형에는 PBS가 폐지된 출연연 연구자도 신청할 수 있습니다. 기존 개인 기초연구를 수행 중인 연구자는 해당 과제가 리더 연구 개시일인 2027년 6월 1일부터 10개월 이내에 최종 종료되는 경우 리더 연구에 신규 신청할 수 있습니다. 리더 연구 유형 B에는 2027년 3단계 진입 예정인 기존 리더 연구자도 신청할 수 있습니다. 신규 선정 시 기존 과제는 정당한 사유에 따른 중단으로 처리할 예정입니다.", "source_blocks": [223, 224, 225, 226, 227], "bullets": ["개인 연구지원사업의 주요 질문에 답변드리겠습니다. 먼저 PBS가 폐지된 출연연 소속 연구자의 신규 신청과, 과제 수행 중 해당 출연연으로 이직할 때의 처리 기준입니다.", "해당 출연연 소속 연구자는 원칙적으로 신규 신청을 할 수 없습니다. 2026년 2차 신규 과제에 선정되어 수행 중인 연구자가 해당 출연연으로 이직하면 과제를 중단해야 하며, 정당한 사유에 따른 중단으로 처리할 예정입니다. 그보다 앞서 선정된 과제는 계속 수행할 수 있다고 안내합니다. 정확한 적용 시점은 신청 요강을 확인해야 합니다.", "예외적으로 개인 기초연구 2차 공고의 핵심 연구 전략형에는 PBS가 폐지된 출연연 연구자도 신청할 수 있습니다.", "기존 개인 기초연구를 수행 중인 연구자는 해당 과제가 리더 연구 개시일인 2027년 6월 1일부터 10개월 이내에 최종 종료되는 경우 리더 연구에 신규 신청할 수 있습니다.", "리더 연구 유형 B에는 2027년 3단계 진입 예정인 기존 리더 연구자도 신청할 수 있습니다. 신규 선정 시 기존 과제는 정당한 사유에 따른 중단으로 처리할 예정입니다."]}, {"id": "Z09-P02", "title": "보직 수행·핵심 연구 중복 신청·도약형", "start": 4611, "end": 4828, "text": "학내 보직을 맡고 있는 연구자가 리더 연구에 선정되면 연구 개시 후 2개월 이내에 전문기관의 보직 수행 승인을 받아야 합니다. 상반기 1차 핵심 연구에 신청했더라도 선정되지 않았다면 하반기 2차 공고의 기본 연구 B·A와 전략형에 신청할 수 있습니다. 리더 연구와 핵심 연구 유형 C·B·A 또는 도약형 중 한 개 과제는 예외적으로 중복 신청할 수 있습니다. 다만 동시 수행이 허용되는 것은 아닙니다. 핵심 연구가 먼저 선정되더라도 리더 연구 결과를 기다린 뒤, 리더 연구에도 선정되면 리더 연구를 수행합니다. 도약형은 내년부터 단일 유형으로 통합하며, 간접비를 포함한 연구비는 연 최대 2.5억 원, 연구 기간은 3년으로 고정합니다. 2026년에 지원 대상 과제가 종료된 연구자는 2027년 도약형에 신청할 수 없습니다. 도약형은 신청 연도에 과제가 종료될 예정인 연구자에게 해당 연도 한 차례의 신청 기회를 제공합니다. 핵심 연구 유형 B·C와 신진 연구 유형 B 이외의 연구책임자는 도약형에 신청할 수 없습니다. 기존 중견 연구와 우수신진 연구의 후속 지원을 도약형으로 개편한 취지에 따라 지원 대상의 일관성을 유지하기 위한 기준입니다.", "source_blocks": [228, 229, 230, 231, 232], "bullets": ["학내 보직을 맡고 있는 연구자가 리더 연구에 선정되면 연구 개시 후 2개월 이내에 전문기관의 보직 수행 승인을 받아야 합니다.", "상반기 1차 핵심 연구에 신청했더라도 선정되지 않았다면 하반기 2차 공고의 기본 연구 B·A와 전략형에 신청할 수 있습니다.", "리더 연구와 핵심 연구 유형 C·B·A 또는 도약형 중 한 개 과제는 예외적으로 중복 신청할 수 있습니다. 다만 동시 수행이 허용되는 것은 아닙니다. 핵심 연구가 먼저 선정되더라도 리더 연구 결과를 기다린 뒤, 리더 연구에도 선정되면 리더 연구를 수행합니다.", "도약형은 내년부터 단일 유형으로 통합하며, 간접비를 포함한 연구비는 연 최대 2.5억 원, 연구 기간은 3년으로 고정합니다.", "2026년에 지원 대상 과제가 종료된 연구자는 2027년 도약형에 신청할 수 없습니다. 도약형은 신청 연도에 과제가 종료될 예정인 연구자에게 해당 연도 한 차례의 신청 기회를 제공합니다.", "핵심 연구 유형 B·C와 신진 연구 유형 B 이외의 연구책임자는 도약형에 신청할 수 없습니다. 기존 중견 연구와 우수신진 연구의 후속 지원을 도약형으로 개편한 취지에 따라 지원 대상의 일관성을 유지하기 위한 기준입니다."]}, {"id": "Z09-P03", "title": "한우물 파기 신청 자격과 기존 과제", "start": 4828, "end": 4945, "text": "한우물 파기에는 대학 소속 비정규직 연구원도 신청할 수 있습니다. 산학협력단·대학 부설 연구소의 비정규직 연구원과 박사후연구원 등이 포함됩니다. 다만 박사학위 취득 후 15년 이내여야 하며, 2012년 1월 1일 이후 학위 취득자로 안내합니다. 기존 과제의 최종 종료 시기와 관계없이 신청할 수 있다는 설명은 과기정통부 소관 개인 기초연구에 해당합니다. 교육부 소관 개인 기초연구를 수행 중이면 2027년 말까지 최종 종료되는 과제에 한하여 신청할 수 있다고 안내합니다. 이 구간의 자막에는 ‘12월 30일 이전’과 ‘12월 말일’이 함께 기록되어 있으므로 정확한 기준일은 신청 요강을 확인해야 합니다.", "source_blocks": [233, 234, 235], "bullets": ["한우물 파기에는 대학 소속 비정규직 연구원도 신청할 수 있습니다. 산학협력단·대학 부설 연구소의 비정규직 연구원과 박사후연구원 등이 포함됩니다. 다만 박사학위 취득 후 15년 이내여야 하며, 2012년 1월 1일 이후 학위 취득자로 안내합니다.", "기존 과제의 최종 종료 시기와 관계없이 신청할 수 있다는 설명은 과기정통부 소관 개인 기초연구에 해당합니다.", "교육부 소관 개인 기초연구를 수행 중이면 2027년 말까지 최종 종료되는 과제에 한하여 신청할 수 있다고 안내합니다. 이 구간의 자막에는 ‘12월 30일 이전’과 ‘12월 말일’이 함께 기록되어 있으므로 정확한 기준일은 신청 요강을 확인해야 합니다."]}, {"id": "Z09-P04", "title": "전략형과 기본 연구의 신청 자격", "start": 4945, "end": 5050, "text": "핵심 연구 전략형은 국가전략기술과 미래 유망 분야 등 국가·사회적 수요에 대응하도록 기획한 유형입니다. 따라서 PBS가 폐지된 출연연 소속 연구자도 예외적으로 신청·수행할 수 있습니다. 연구 개시는 하반기인 9월 1일 예정입니다. 기본 연구 B·A는 9월 1일 개시 유형이며 3월경 공고할 예정입니다. 지역 연구자의 범위를 설명하면, 서울·인천·경기 소재 기관과 4대 과학기술원, 포항공대는 지역 기관에서 제외된다고 안내합니다. 법령상 분교 중 수도권 밖에 소재한 기관은 지역 대학·연구기관에 해당할 수 있습니다. 한양대 ERICA는 분교이지만 소재지가 수도권이므로 지역 기관에 해당하지 않는다는 예시를 제시합니다. 관련 법 조항과 세부 적용 범위는 공고문에서 확인해야 합니다.", "source_blocks": [236, 237, 238], "bullets": ["핵심 연구 전략형은 국가전략기술과 미래 유망 분야 등 국가·사회적 수요에 대응하도록 기획한 유형입니다. 따라서 PBS가 폐지된 출연연 소속 연구자도 예외적으로 신청·수행할 수 있습니다. 연구 개시는 하반기인 9월 1일 예정입니다.", "기본 연구 B·A는 9월 1일 개시 유형이며 3월경 공고할 예정입니다. 지역 연구자의 범위를 설명하면, 서울·인천·경기 소재 기관과 4대 과학기술원, 포항공대는 지역 기관에서 제외된다고 안내합니다.", "법령상 분교 중 수도권 밖에 소재한 기관은 지역 대학·연구기관에 해당할 수 있습니다. 한양대 ERICA는 분교이지만 소재지가 수도권이므로 지역 기관에 해당하지 않는다는 예시를 제시합니다. 관련 법 조항과 세부 적용 범위는 공고문에서 확인해야 합니다."]}, {"id": "Z09-P05", "title": "대학병원·신진 연구 자격과 우대", "start": 5050, "end": 5198, "text": "대학병원 소속 연구자도 병원이 대학과 별도 법인으로 설립되어 있고 연구비 중앙 관리가 가능하다면 하반기 기본 연구 B·A에 신청할 수 있다고 안내합니다. 신진 연구의 최초 임용 경력은 특정 정년·비정년 트랙에 한정하지 않고 주관 연구기관 규정상 최초 조교수 이상 직위로 임용된 시점을 기준으로 판단합니다. 신청 자격에 해당하는지는 기존 임용 이력을 포함하여 확인해야 합니다. 세종 국내 트랙 수행 중 전임 교원이 된 연구책임자가 중단 없이 5년간 과제를 수행하고 정상 종료하는 해에 신진 연구 유형 B에 신청하면 우대하여 선정할 예정입니다. 출산·육아휴직 기간에 따른 자격 인정 사항을 증빙할 때 반드시 공문을 제출할 필요는 없습니다. 신청서 서식에 포함된 확인서와 증빙자료를 주관기관 승인 마감일까지 IRIS로 제출하면 됩니다. 구체적인 인정 기준과 서식은 신청 요강을 확인해 주시기 바랍니다.", "source_blocks": [239, 240], "bullets": ["대학병원 소속 연구자도 병원이 대학과 별도 법인으로 설립되어 있고 연구비 중앙 관리가 가능하다면 하반기 기본 연구 B·A에 신청할 수 있다고 안내합니다.", "신진 연구의 최초 임용 경력은 특정 정년·비정년 트랙에 한정하지 않고 주관 연구기관 규정상 최초 조교수 이상 직위로 임용된 시점을 기준으로 판단합니다. 신청 자격에 해당하는지는 기존 임용 이력을 포함하여 확인해야 합니다.", "세종 국내 트랙 수행 중 전임 교원이 된 연구책임자가 중단 없이 5년간 과제를 수행하고 정상 종료하는 해에 신진 연구 유형 B에 신청하면 우대하여 선정할 예정입니다.", "출산·육아휴직 기간에 따른 자격 인정 사항을 증빙할 때 반드시 공문을 제출할 필요는 없습니다. 신청서 서식에 포함된 확인서와 증빙자료를 주관기관 승인 마감일까지 IRIS로 제출하면 됩니다. 구체적인 인정 기준과 서식은 신청 요강을 확인해 주시기 바랍니다."]}, {"id": "Z09-P06", "title": "지역 장기 연구의 장비 구축과 이직", "start": 5198, "end": 5314, "text": "신진 지역 장기 연구는 연구 초기인 1~2차년도에 연구시설·장비를 구축하고 이를 기반으로 안정적인 연구를 지원하는 사업입니다. 장비 구축 계획이 없으면 신청할 수 없습니다. 연구책임자는 1~2차년도에 연구시설·장비비 총 3억 원 이상을 의무적으로 계상해야 하며, 계상한 3억 원은 2차년도 종료일까지 반드시 집행해야 합니다. 과제 수행 중 이직할 경우 국내 지역 대학으로 옮길 때만 계속 수행할 수 있습니다. 지역 연구소는 이 조건에 포함되지 않습니다. 국내 지역 대학 이외의 기관으로 이직하면 정당한 사유에 해당하지 않는 수행 포기로 간주하여 참여 제한 등의 제재를 받을 수 있습니다.", "source_blocks": [241, 242, 243], "bullets": ["신진 지역 장기 연구는 연구 초기인 1~2차년도에 연구시설·장비를 구축하고 이를 기반으로 안정적인 연구를 지원하는 사업입니다. 장비 구축 계획이 없으면 신청할 수 없습니다.", "연구책임자는 1~2차년도에 연구시설·장비비 총 3억 원 이상을 의무적으로 계상해야 하며, 계상한 3억 원은 2차년도 종료일까지 반드시 집행해야 합니다.", "과제 수행 중 이직할 경우 국내 지역 대학으로 옮길 때만 계속 수행할 수 있습니다. 지역 연구소는 이 조건에 포함되지 않습니다. 국내 지역 대학 이외의 기관으로 이직하면 정당한 사유에 해당하지 않는 수행 포기로 간주하여 참여 제한 등의 제재를 받을 수 있습니다."]}, {"id": "Z09-P07", "title": "세종과학 펠로우십: 체류·개시·소속 기관", "start": 5314, "end": 5505, "text": "세종과학 펠로우십 수행 중 국외 파견·체류는 국내 및 복귀·유치 트랙 모두 최대 1년으로 제한한다고 안내합니다. 출입국사실증명서의 출국일과 입국일을 기준으로 산정합니다. 복귀·유치 트랙은 연구개발계획서에 1년 이상 파견 계획이 명시되어 있고 필요성을 인정받은 경우 예외가 가능하다고 설명하며, 구체적인 승인 기준은 신청 요강을 확인해야 합니다. 복귀·유치 트랙은 연구책임자의 입국 준비 기간을 고려하여 상반기에 선정을 마치더라도 9월 1일에 연구를 개시합니다. 신청 당시 소속이 없어도 연구 개시일 기준 소속 예정 기관이 확정되어 있다면 해당 기관을 주관 연구기관으로 신청하면 됩니다. 소속 예정 기관이 없거나 현재 소속 기관을 통한 신청이 불가능한 경우에는 한국연구재단을 주관기관으로 지정하여 신청할 수 있습니다. 이 방식으로 신청한 경우 국내 트랙은 3월 1일 개시 후 6개월 이내에, 복귀·유치 트랙은 9월 1일 개시 전에 주관 연구기관을 확정하고 한국연구재단 심의를 받아야 합니다. 기한 내 이행하지 않으면 선정이 취소됩니다. 이상으로 개인 연구 FAQ를 마치겠습니다.", "source_blocks": [244, 245, 246, 247], "bullets": ["세종과학 펠로우십 수행 중 국외 파견·체류는 국내 및 복귀·유치 트랙 모두 최대 1년으로 제한한다고 안내합니다. 출입국사실증명서의 출국일과 입국일을 기준으로 산정합니다. 복귀·유치 트랙은 연구개발계획서에 1년 이상 파견 계획이 명시되어 있고 필요성을 인정받은 경우 예외가 가능하다고 설명하며, 구체적인 승인 기준은 신청 요강을 확인해야 합니다.", "복귀·유치 트랙은 연구책임자의 입국 준비 기간을 고려하여 상반기에 선정을 마치더라도 9월 1일에 연구를 개시합니다.", "신청 당시 소속이 없어도 연구 개시일 기준 소속 예정 기관이 확정되어 있다면 해당 기관을 주관 연구기관으로 신청하면 됩니다. 소속 예정 기관이 없거나 현재 소속 기관을 통한 신청이 불가능한 경우에는 한국연구재단을 주관기관으로 지정하여 신청할 수 있습니다.", "이 방식으로 신청한 경우 국내 트랙은 3월 1일 개시 후 6개월 이내에, 복귀·유치 트랙은 9월 1일 개시 전에 주관 연구기관을 확정하고 한국연구재단 심의를 받아야 합니다. 기한 내 이행하지 않으면 선정이 취소됩니다. 이상으로 개인 연구 FAQ를 마치겠습니다."]}], "summary": ["출연연 소속 연구자의 신청 제한, 리더 연구와 핵심 연구의 중복 신청, 도약형 신청 자격을 질문·답변으로 설명합니다.", "한우물 파기·기본 연구·신진 연구의 자격과 우대, 지역 장기 연구의 장비 구축 및 이직 조건을 다룹니다.", "세종과학 펠로우십은 체류 기준·연구 개시 시점·소속 기관 확정 기한을 확인해야 하며, 소속이 없는 경우의 신청 방법도 안내합니다."]}, {"id": "Z10", "title": "집단 연구 FAQ", "start": 5506, "end": 5841, "paragraphs": [{"id": "Z10-P01", "title": "공동 연구진과 참여 연구원 자격", "start": 5506, "end": 5594, "text": "집단 연구의 공동 연구진과 참여 연구원(공동)의 차이를 설명합니다. 국가연구개발사업 연구개발비 사용 기준에 따른 참여 연구자는 연구책임자와 학생연구자를 포함하여 과제에 참여하는 모든 연구자를 의미합니다. 집단 연구에서는 사업의 특성을 고려하여 공동 연구진과 참여 연구원(공동)을 구분합니다. 공동 연구진은 연구책임자와 참여 연구원(공동)으로 구성되며, 참여 연구원(공동)에게는 사업별 자격, 신청 과제 수 제한, 성과목표관리제에 따른 수행 기간 유지 등의 기준이 적용됩니다. 미래연구센터의 참여 연구원(공동)은 국내외 대학의 전임·비전임 교원 또는 국내외 공공·민간 연구소의 선임연구원 이상으로 안내합니다. 기초연구실의 자격은 자막에 ‘전임·비전임 연구원’으로 기록되어 정확한 직위 범위를 신청 요강에서 확인해야 합니다. 사업별 공동 연구진 수는 표를 참고해 주시기 바랍니다. 공동 연구진 중 연구책임자를 제외한 인원이 참여 연구원(공동)에 해당합니다.", "source_blocks": [248, 249, 250, 251, 252, 253, 254, 255], "bullets": ["집단 연구의 공동 연구진과 참여 연구원(공동)의 차이를 설명합니다. 국가연구개발사업 연구개발비 사용 기준에 따른 참여 연구자는 연구책임자와 학생연구자를 포함하여 과제에 참여하는 모든 연구자를 의미합니다.", "집단 연구에서는 사업의 특성을 고려하여 공동 연구진과 참여 연구원(공동)을 구분합니다. 공동 연구진은 연구책임자와 참여 연구원(공동)으로 구성되며, 참여 연구원(공동)에게는 사업별 자격, 신청 과제 수 제한, 성과목표관리제에 따른 수행 기간 유지 등의 기준이 적용됩니다.", "미래연구센터의 참여 연구원(공동)은 국내외 대학의 전임·비전임 교원 또는 국내외 공공·민간 연구소의 선임연구원 이상으로 안내합니다. 기초연구실의 자격은 자막에 ‘전임·비전임 연구원’으로 기록되어 정확한 직위 범위를 신청 요강에서 확인해야 합니다.", "사업별 공동 연구진 수는 표를 참고해 주시기 바랍니다. 공동 연구진 중 연구책임자를 제외한 인원이 참여 연구원(공동)에 해당합니다."]}, {"id": "Z10-P02", "title": "연구진 변경과 개인·집단 과제 병행", "start": 5594, "end": 5671, "text": "미래연구센터와 기초연구실에서 신규 선정 후 1차년도 연구 기간 중 참여 연구원(공동)을 변경하면 차년도 연구비의 20%가 삭감된다고 안내합니다. 해당 인력은 성과목표관리제 등의 적용 대상입니다. 개인 기초연구의 연구책임자는 집단 과제의 연구책임자 또는 참여 연구원(공동)으로 한 개 과제를 추가 수행할 수 있습니다. 다만 리더 연구책임자는 기존 과제가 집단 과제 개시 후 10개월 이내에 최종 종료되는 경우에만 연구책임자로 신청할 수 있다고 안내합니다. 제시된 종료 기준일은 2028년 5월 31일이며, 최종 공고를 확인해야 합니다. 다음 질문은 미래연구센터 공동 연구진으로 과제를 수행 중인 경우 국가연구소 연구책임자로 신청할 수 있는지입니다. 이어서 예외 기준을 설명합니다.", "source_blocks": [256, 257, 258], "bullets": ["미래연구센터와 기초연구실에서 신규 선정 후 1차년도 연구 기간 중 참여 연구원(공동)을 변경하면 차년도 연구비의 20%가 삭감된다고 안내합니다. 해당 인력은 성과목표관리제 등의 적용 대상입니다.", "개인 기초연구의 연구책임자는 집단 과제의 연구책임자 또는 참여 연구원(공동)으로 한 개 과제를 추가 수행할 수 있습니다. 다만 리더 연구책임자는 기존 과제가 집단 과제 개시 후 10개월 이내에 최종 종료되는 경우에만 연구책임자로 신청할 수 있다고 안내합니다. 제시된 종료 기준일은 2028년 5월 31일이며, 최종 공고를 확인해야 합니다.", "다음 질문은 미래연구센터 공동 연구진으로 과제를 수행 중인 경우 국가연구소 연구책임자로 신청할 수 있는지입니다. 이어서 예외 기준을 설명합니다."]}, {"id": "Z10-P03", "title": "국가연구소·미래연구센터 신청 예외", "start": 5671, "end": 5755, "text": "집단 연구 과제를 수행 중인 연구책임자와 참여 연구원(공동)은 원칙적으로 신규 신청이 불가능합니다. 다만 국가연구소 연구책임자로 신청할 때는 제한적으로 예외를 허용합니다. 미래·선도연구센터의 연구책임자는 단계 종료를 고려하여 2028년에 후속 단계가 개시되는 과제에 한하여 신청할 수 있다고 안내합니다. 해당 센터의 참여 연구원(공동)은 신청할 수 있습니다. 기초연구실은 단계 구분이 없으므로 연구책임자와 참여 연구원(공동) 모두 신청할 수 있다고 설명합니다. 국가연구소 과제를 수행 중인 연구책임자와 참여 연구원(공동)은 미래연구센터 신규 과제에 신청할 수 없습니다. 미래연구센터는 이 경우에 별도의 예외를 두지 않고 집단 연구의 과제 수 제한을 적용합니다.", "source_blocks": [259, 260, 261, 262], "bullets": ["집단 연구 과제를 수행 중인 연구책임자와 참여 연구원(공동)은 원칙적으로 신규 신청이 불가능합니다. 다만 국가연구소 연구책임자로 신청할 때는 제한적으로 예외를 허용합니다.", "미래·선도연구센터의 연구책임자는 단계 종료를 고려하여 2028년에 후속 단계가 개시되는 과제에 한하여 신청할 수 있다고 안내합니다. 해당 센터의 참여 연구원(공동)은 신청할 수 있습니다. 기초연구실은 단계 구분이 없으므로 연구책임자와 참여 연구원(공동) 모두 신청할 수 있다고 설명합니다.", "국가연구소 과제를 수행 중인 연구책임자와 참여 연구원(공동)은 미래연구센터 신규 과제에 신청할 수 없습니다. 미래연구센터는 이 경우에 별도의 예외를 두지 않고 집단 연구의 과제 수 제한을 적용합니다."]}, {"id": "Z10-P04", "title": "신진 연구 인력과 동시 수행 제한", "start": 5755, "end": 5841, "text": "집단 연구에서 신진 연구 인력은 박사학위 취득 후 7년 이내, 만 39세 이하, 또는 최초 조교수 이상 직위로 임용된 지 5년 이내인 연구자를 의미합니다. 상세 자격은 자료를 확인해 주시기 바랍니다. 기초연구실에서는 신진 연구 인력이 필수 구성원이므로 접수 시점에 포함되지 않으면 요건 심사에서 탈락합니다. 심화형에는 1명 이상, 혁신형에는 2명 이상을 포함해야 합니다. 다른 국가연구개발사업의 연구책임자로 두 개 과제를 수행 중이면 미래연구센터 연구책임자로 신청할 수 없습니다. 미래연구센터에 선정된 경우 다른 국가연구개발사업의 연구책임자로는 한 개 과제까지만 수행할 수 있습니다. 다만 기존 과제가 신규 연구 개시일부터 10개월 이내에 최종 종료되는 경우에는 예외적으로 신청할 수 있다고 안내합니다. 이 구간 자막의 개시 연도는 앞선 일정 안내와 일치하지 않으므로 정확한 날짜는 최종 공고 확인이 필요합니다. 이상으로 집단 연구 FAQ를 마치겠습니다.", "source_blocks": [263, 264, 265, 266, 267], "bullets": ["집단 연구에서 신진 연구 인력은 박사학위 취득 후 7년 이내, 만 39세 이하, 또는 최초 조교수 이상 직위로 임용된 지 5년 이내인 연구자를 의미합니다. 상세 자격은 자료를 확인해 주시기 바랍니다.", "기초연구실에서는 신진 연구 인력이 필수 구성원이므로 접수 시점에 포함되지 않으면 요건 심사에서 탈락합니다. 심화형에는 1명 이상, 혁신형에는 2명 이상을 포함해야 합니다.", "다른 국가연구개발사업의 연구책임자로 두 개 과제를 수행 중이면 미래연구센터 연구책임자로 신청할 수 없습니다. 미래연구센터에 선정된 경우 다른 국가연구개발사업의 연구책임자로는 한 개 과제까지만 수행할 수 있습니다.", "다만 기존 과제가 신규 연구 개시일부터 10개월 이내에 최종 종료되는 경우에는 예외적으로 신청할 수 있다고 안내합니다. 이 구간 자막의 개시 연도는 앞선 일정 안내와 일치하지 않으므로 정확한 날짜는 최종 공고 확인이 필요합니다. 이상으로 집단 연구 FAQ를 마치겠습니다."]}], "summary": ["공동 연구진과 참여 연구원의 범위·자격, 연구진 변경 시 불이익을 설명합니다.", "개인·집단 과제 병행과 국가연구소·미래연구센터 신청의 원칙 및 예외를 다룹니다.", "신진 연구 인력의 필수 구성 요건과 다른 국가 R&D 과제의 동시 수행 제한을 확인해야 합니다."]}, {"id": "Z11", "title": "후속 문의와 폐회", "start": 5841, "end": 5891, "paragraphs": [{"id": "Z11-P01", "title": "문의·다시 보기·자료 다운로드 안내", "start": 5841, "end": 5891, "text": "설명회 이후 추가 질문은 화면에 안내한 사업별 담당자 연락처 또는 재단 홈페이지를 통해 문의해 주시기 바랍니다. 전용 사이트에서의 다시 보기는 11월 30일 월요일 오후 6시까지 가능하며, 재단 YouTube 채널에서는 설명회 영상을 계속 시청할 수 있습니다. 발표자료 파일은 재단 홈페이지의 기초연구사업 게시판에서 내려받을 수 있습니다. 접수된 질문에는 개별 이메일로 답변할 예정입니다. 구체적인 답변 기한은 자동 자막만으로 확정하기 어려워 별도 안내를 확인해야 합니다. 이상으로 2027년도 기초연구사업 설명회를 마칩니다. 시청해 주신 연구자 여러분께 감사드립니다.", "source_blocks": [268, 269], "bullets": ["설명회 이후 추가 질문은 화면에 안내한 사업별 담당자 연락처 또는 재단 홈페이지를 통해 문의해 주시기 바랍니다.", "전용 사이트에서의 다시 보기는 11월 30일 월요일 오후 6시까지 가능하며, 재단 YouTube 채널에서는 설명회 영상을 계속 시청할 수 있습니다. 발표자료 파일은 재단 홈페이지의 기초연구사업 게시판에서 내려받을 수 있습니다.", "접수된 질문에는 개별 이메일로 답변할 예정입니다. 구체적인 답변 기한은 자동 자막만으로 확정하기 어려워 별도 안내를 확인해야 합니다. 이상으로 2027년도 기초연구사업 설명회를 마칩니다. 시청해 주신 연구자 여러분께 감사드립니다."]}], "summary": ["추가 문의는 사업별 담당자와 재단 홈페이지를 통해 접수할 수 있습니다.", "다시 보기와 발표자료 다운로드 경로, 접수된 질문의 개별 답변 계획을 안내하고 설명회를 마칩니다."]}], "blocks": [{"start": 6, "end": 10, "text": "지금부터 2027년도 기초연구사업 설명회를 시작하겠습니다. 사회를 맡은 한국연구재단 기초연구 총괄실장입니다."}, {"start": 10, "end": 55, "text": "바쁘신 가운데 온라인 설명회에 함께해 주신 연구자 여러분께 진심으로 감사드립니다. 오늘 설명회에서는 2027년도 기초연구사업의 주요 추진 방향과 세부 지원 내용을 안내합니다. 개인 기초연구사업은 11월 5일에 공고되었으며, 집단 연구사업은 추후 별도로 공고될 예정입니다. 설명회가 끝날 때까지 전용 플랫폼에서 질문을 접수합니다. 궁금한 사항을 게시판에 남겨 주시면 검토 후 이메일로 답변드리겠습니다."}, {"start": 55, "end": 74, "text": "만족도 조사에 보내 주신 의견도 향후 사업 운영에 참고하겠습니다. 발표에 앞서 과학기술정보통신부 기초연구진흥과장의 인사말이 있겠습니다."}, {"start": 75, "end": 82, "text": "안녕하십니까? 과학기술정보통신부 기초연구진흥과장입니다."}, {"start": 82, "end": 88, "text": "2027년 과학기술 분야 기초연구사업 설명회를 시작하겠습니다."}, {"start": 89, "end": 100, "text": "발표 순서는 과학기술정보통신부 기초연구사업 안내, 교육부 이공분야 학술연구지원사업 안내, 기초연구사업 평가제도, FAQ입니다."}, {"start": 100, "end": 110, "text": "먼저 과학기술정보통신부 기초연구사업의 추진 방향을 설명드리겠습니다."}, {"start": 110, "end": 116, "text": ""}, {"start": 118, "end": 122, "text": ""}, {"start": 122, "end": 189, "text": "2027년 기초연구는 투자 회복을 넘어, AI와 과학기술의 대도약을 준비하는 대한민국 기초연구 생태계 혁신에 중점을 두고 있습니다. 기본 방향은 장기적이고 안정적인 지원, 창의적이고 도전적인 연구 투자 강화, 연구 성과의 책임성을 높이는 지원 시스템 혁신입니다. 중점 추진 과제는 기초연구 저변 확대와 견고한 연구 안전망 구축, 청년 연구자 성장 지원, 지역 연구 역량 강화, 세계 최상위 리더급 연구자와 연구 그룹 육성, 집단 연구의 혁신성과 도전성 강화, AI를 활용한 과학 난제 해결 지원입니다. 아울러 질적 성과 중심의 관리, 지원 체계의 전주기 글로벌화, AI 시대의 연구 관리 혁신과 책임성 강화, 평가제도 개선을 추진합니다."}, {"start": 189, "end": 196, "text": "장기적이고 안정적인 지원을 통해 기초연구 저변을 확대하고 견고한 연구 안전망을 구축하겠습니다."}, {"start": 196, "end": 202, "text": ""}, {"start": 202, "end": 237, "text": "내년도 기초연구 예산은 역대 최대인 2.91조 원 규모이며, 약 1.8만 개 과제를 지원할 예정입니다."}, {"start": 237, "end": 252, "text": ""}, {"start": 252, "end": 258, "text": "이를 바탕으로 지원받는 연구자 수를 지속적으로 확대하겠습니다. 2026년에 복원된 기본 연구의 신규 과제 규모를 유지하고, 연구 기반이 취약한 연구자에 대한 우대를 지속하겠습니다. 청년 연구자 성장을 지원하기 위해 세종과학 펠로우십을 국내 및 복귀·유치 지원 중심으로 개편합니다. 성장 잠재력이 큰 박사후연구원의 연구 기회를 지원하고 신진 연구자 지원 규모도 확대하겠습니다."}, {"start": 258, "end": 289, "text": "신진 연구자 인프라 지원 사업은 평가와 성과 활용 관련 부담을 줄이고, 수행 포기의 정당한 사유를 추가하는 방향으로 개선합니다. 구매 예정 장비의 가격이 대외적 여건으로 20% 이상 상승한 경우를 정당한 사유로 명시하여 제재 부담을 완화하고자 합니다."}, {"start": 289, "end": 310, "text": "우수한 연구가 단절 없이 이어지도록 한우물 파기 과제를 현재 31개에서 내년도 40개로 확대합니다. 우수 성과자가 최대 11년까지 연구를 지속할 수 있도록 후속 과제인 도약형의 지원 기준도 정비했습니다."}, {"start": 310, "end": 327, "text": "젊고 유망한 연구자가 지역에 유입·정착하여 지역 혁신 역량의 중추로 성장할 수 있도록 지역 장기 연구를 신설합니다."}, {"start": 327, "end": 346, "text": "총 10년간 지원하며, 초기에는 연구 장비를 구축하고 이후에는 이를 활용한 장기 연구를 수행합니다."}, {"start": 346, "end": 362, "text": "뒤의 세부 사업 안내에서는 1차년도 3억 원 내외, 2차년도부터 연 1.5억 원 내외로 설명합니다."}, {"start": 362, "end": 371, "text": "총 100개 과제를 선정할 계획입니다. 지역 장기 연구에 선정되지 않은 연구자가 신진 연구자 인프라 지원 사업에 도전할 수 있도록 해당 사업의 지원 시기를 상반기에서 하반기로 조정합니다. 지역 연구거점 육성을 위해 지역 혁신 미래연구센터 5개를 신규 선정할 계획입니다."}, {"start": 372, "end": 402, "text": "세계적 수준의 성과를 창출하고 세계 선도 연구자를 육성하기 위해 리더 연구를 지속적으로 지원합니다. 탑티어급 과제는 내년도에 3개, 유형 A는 10개를 선정할 계획입니다."}, {"start": 402, "end": 423, "text": "국가연구소는 세계 최고 수준의 연구소 육성을 위해 집단 기초연구 중 가장 큰 규모로 지원하는 사업입니다. 효과적인 운영을 위해 현장 컨설팅의 실효성을 높이고 신규 연구소 지원을 지속적으로 확대하겠습니다."}, {"start": 423, "end": 428, "text": ""}, {"start": 428, "end": 467, "text": ""}, {"start": 467, "end": 480, "text": "집단 기초연구 주제의 혁신성을 높이고 국가·사회적 의제와의 연계성을 강화하기 위해 미래연구센터 체계를 구축합니다."}, {"start": 480, "end": 489, "text": "기존 이학·공학·기초의과학·지역혁신 연구센터를 미래연구센터 체계로 전환하고, FRC-X 유형을 신설할 계획입니다. 유형별 명칭과 구성은 뒤의 집단 연구 안내에서 설명합니다. FRC-X는 학문 분야의 구분을 넘어 연구 주제의 도전성과 국가·사회적 난제와의 연관성을 중심으로 연구팀을 선발하며, 내년도에 4개를 선정할 계획입니다. 집단 연구의 세부 내용은 추가 의견 수렴을 거쳐 다음 달에 공고하겠습니다."}, {"start": 489, "end": 527, "text": "AI를 활용하여 과학적 난제를 해결하고 새로운 연구 영역과 방법론을 개척하는 도전적 연구를 지원합니다. 핵심 연구 전략형과 기초연구실 사업에서 AI 활용 기초연구, AI가 제시한 가설·데이터·증명 등의 검증, AI의 발견을 과학적 원리와 이론으로 발전시키는 연구 등을 선정할 계획입니다. 구체적인 선정 규모는 추후 공고합니다."}, {"start": 528, "end": 533, "text": "연구지원 시스템을 혁신하고 질적 성과 중심의 관리를 강화합니다."}, {"start": 533, "end": 562, "text": "단계·최종 보고서 등에서 논문·특허와 같은 양적 실적 제출을 전면 금지하고 질적 성과 중심으로 평가할 계획입니다. 연구팀의 자율성에 기반한 성과 관리를 강화하며, 단계·최종 평가와 컨설팅, 성과 분석에서 자립 역량과 지속 가능성에 중점을 두도록 관리 체계를 개선하겠습니다."}, {"start": 562, "end": 584, "text": ""}, {"start": 584, "end": 599, "text": ""}, {"start": 601, "end": 605, "text": ""}, {"start": 605, "end": 613, "text": "연구과제 지원의 전주기 글로벌화를 추진합니다."}, {"start": 613, "end": 632, "text": "국내 연구 생태계에 참여하는 해외 학위 취득자와 우수 외국인 연구자의 편의성을 높이고 참여 기회를 확대하기 위해 영문 공고문과 글로벌 표준 양식 등을 도입합니다. 외국인 지원자가 많거나 해외 평가위원의 참여 필요성이 높은 사업에서는 영문 연구계획서 등 영문 양식의 도입을 확대하겠습니다. AI 시대의 연구 관리 혁신과 책임성 강화를 추진합니다. 연구지원 방식 자체를 과학적으로 분석·검증하여 지원 체계를 고도화하고자 합니다. 생성형 AI 활용이 확산되는 상황에서 연구자가 책임성과 투명성을 바탕으로 AI를 활용할 수 있도록, 연구계획서 등의 AI 활용 경향을 시범적으로 파악하겠습니다."}, {"start": 632, "end": 636, "text": ""}, {"start": 636, "end": 645, "text": "기초연구실 선정 평가와 리더 연구·선도연구센터 최종 평가를 발표 평가로 운영할 계획입니다."}, {"start": 647, "end": 658, "text": "연구자가 실패에 대한 부담 없이 도전하도록 단계·최종 평가 등급을 폐지하고, 성실한 수행에 따른 연구 완료 여부를 평가할 계획입니다."}, {"start": 658, "end": 686, "text": "출연연 PBS 폐지에 따라 해당 출연연 소속 연구자의 기초연구 과제 신청을 제한하고 대학 교원 중심으로 지원을 확대할 계획입니다. 과제 협약 시점부터 우수 성과의 대국민 홍보를 관리합니다. 주요 저널 게재 성과는 과기정통부 브리핑과 언론 인터뷰 등에 연계하여 홍보 효과를 높이겠습니다."}, {"start": 692, "end": 698, "text": ""}, {"start": 700, "end": 715, "text": "2027년도 기초연구사업 예산은 과학기술정보통신부 2조 9,102억 원과 교육부 6,469억 원을 합쳐 총 3조 5,571억 원입니다."}, {"start": 717, "end": 737, "text": "과기정통부 예산은 2026년 2조 7,362억 원 대비 약 1,739억 원 증가했습니다. 현재 국회 심의 중이므로 최종 규모는 변동될 수 있습니다."}, {"start": 738, "end": 773, "text": ""}, {"start": 773, "end": 779, "text": ""}, {"start": 779, "end": 783, "text": "개인 연구 예산은 총 2조 4,421억 원입니다."}, {"start": 783, "end": 794, "text": ""}, {"start": 794, "end": 798, "text": "지원 과제 수는 자동 자막에 ‘18,11개’로 기록되어 있어 발표자료 확인이 필요합니다. 리더·핵심·신진 연구와 세종과학 펠로우십의 지원 규모 및 과제 수는 표를 참고해 주시기 바랍니다. 집단 연구에는 4,681억 원을 투입하여 총 505개 과제를 지원합니다. 사업별 세부 예산과 과제 수는 표를 참고해 주시기 바랍니다. 트랙별 신규 선정 계획은 이어지는 사업 설명에서 자세히 안내하겠습니다."}, {"start": 799, "end": 814, "text": ""}, {"start": 814, "end": 819, "text": ""}, {"start": 819, "end": 830, "text": "한국연구재단 개인연구지원팀에서 2027년도 개인 연구지원사업의 세부 사업과 신규 과제 신청 유의 사항을 설명드리겠습니다. 먼저 리더 연구입니다."}, {"start": 830, "end": 851, "text": "연구 기간은 유형 A·B 모두 9년이며, 5년과 4년의 단계로 구성됩니다. 유형 A의 연구비는 연 8억 원 내외입니다."}, {"start": 851, "end": 878, "text": ""}, {"start": 878, "end": 888, "text": "유형 B의 연구비는 자동 자막에서 누락되어 발표자료 확인이 필요합니다. 선정 규모는 유형 B 3개 내외, 유형 A는 후속 과제 2개 내외를 포함하여 총 10개 내외입니다. 지원 대상은 대학 이공분야 전임·비전임 교원과 국공립·민간 연구소 연구원입니다. PBS가 폐지된 출연연 소속 연구자는 신청할 수 없습니다. 유형 B에는 2027년 3단계 진입 예정인 기존 리더 연구자도 신청할 수 있습니다. 리더 연구는 이번 1차 공고에 포함되지만 연구 개시는 6월이며, 1차년도 연구 기간은 9개월입니다."}, {"start": 888, "end": 902, "text": "핵심 연구 유형 C·B·A는 모두 3월 1일에 개시합니다. 연구 기간은 1~5년 범위에서 연구자가 자율적으로 설정하며, 연구비는 각각 연 3억 원, 2억 원, 1억 원 내외입니다. 선정 규모는 유형 C 100개 내외, 유형 A 825개 내외입니다. 유형 B의 선정 규모는 자동 자막에 ‘60, 670개’로 기록되어 정확한 수치를 확인해야 합니다. 지원 대상은 리더 연구와 같습니다."}, {"start": 902, "end": 960, "text": "슬라이드의 지원 대상에서 ‘교원’은 전임·비전임 교원을 모두 포함합니다. ‘연구원’도 별도 제한이 명시되지 않았다면 정규직·비정규직 연구원 모두 신청할 수 있다는 의미입니다."}, {"start": 960, "end": 989, "text": ""}, {"start": 989, "end": 996, "text": ""}, {"start": 996, "end": 1011, "text": "도약형은 후속 연구 성격의 사업으로, 연구 기간은 3년이고 연구비는 연 2.5억 원 내외입니다. 핵심 연구 유형 B·C, 신진 연구 유형 B, 구 중견 후속 및 중견 연계 신진 후속 과제 등에서 2027년 종료 예정인 연구책임자를 대상으로 합니다."}, {"start": 1011, "end": 1048, "text": "PBS가 폐지된 출연연 소속 연구자는 신청할 수 없습니다. 한우물 파기 기초연구는 5년과 5년, 총 10년간 지원하며 연구비는 연 2억 원 내외입니다. 선정 규모는 40개 내외입니다. 한우물 파기의 지원 대상은 박사학위 취득 후 15년 이내인 대학 이공분야 전임·비전임 교원과 국공립·민간 연구소 연구원입니다. 이 사업도 PBS가 폐지된 출연연 소속 연구자는 신청할 수 없습니다. 다음으로 글로벌 매칭형, 전략형, 기본 연구 B·A를 설명드리겠습니다."}, {"start": 1048, "end": 1089, "text": ""}, {"start": 1089, "end": 1100, "text": "글로벌 매칭형, 전략형, 기본 연구 B·A는 3월 1일 개시 사업이 아닙니다. 글로벌 매칭형은 12월에 개시하며, 3년간 연 1.5억 원 내외를 지원하고 20개 내외를 선정할 예정입니다. 전략형은 9월 1일에 개시하며 연구 기간은 1~3년, 연구비는 연 2억 원 내외입니다. 선정 규모는 50개 내외입니다."}, {"start": 1100, "end": 1121, "text": "다른 유형과 달리 PBS가 폐지된 출연연 소속 연구자도 신청할 수 있습니다. 기본 연구 B·A는 모두 1~5년간 지원합니다. 유형 A의 연구비는 연 5천만 원 내외이고 선정 규모는 750개 과제 내외입니다. 유형 B의 연구비와 선정 규모는 자동 자막이 불명확하므로 발표자료 확인이 필요합니다. 대학 소속 신청자는 두 유형 모두 전임 교원이어야 합니다."}, {"start": 1123, "end": 1142, "text": ""}, {"start": 1142, "end": 1150, "text": "신진 연구는 3월에 개시합니다. 유형 B는 1~5년간 연 1.5억 원 내외를 지원하며, 2027년 선정 규모는 460개 내외입니다. 유형 A는 1~3년간 연 1억 원 내외를 지원하고 600개 내외를 선정합니다."}, {"start": 1150, "end": 1182, "text": "두 유형의 지원 대상은 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내 대학 이공분야 전임 교원과 국공립·민간 연구소의 정규직 연구원입니다. 앞서 설명한 일부 사업과 달리 전임 교원과 정규직 연구원을 대상으로 합니다."}, {"start": 1182, "end": 1214, "text": "신진 연구자 인프라 지원 사업은 올해까지 3월 1일에 개시했으나, 내년부터는 신진 지역 장기 연구에 선정되지 않은 연구자도 지원할 수 있도록 개시일을 9월 1일로 변경했습니다. 담당 기관의 별도 신청 요강을 확인해 주시기 바랍니다. 내년 선정 규모는 70개 내외로 예상됩니다."}, {"start": 1214, "end": 1230, "text": ""}, {"start": 1230, "end": 1240, "text": ""}, {"start": 1240, "end": 1257, "text": "신진 지역 장기 연구는 내년에 새로 추진하는 사업입니다. 연구 기간은 5년과 5년, 총 10년입니다. 연구비는 1차년도 3억 원 내외, 2차년도부터 연 1.5억 원 내외입니다. 지원 대상은 박사학위 취득 후 7년 이내 또는 만 39세 이하인 국내 지역 대학 이공분야 전임 교원입니다. 지역 대학의 전임 교원을 대상으로 한다는 점에서 신진 연구 유형 A·B와 차이가 있습니다."}, {"start": 1257, "end": 1281, "text": "PBS가 폐지된 출연연은 신청할 수 없습니다. 신진 지역 장기 연구는 반드시 장비 구축 계획이 있어야 신청할 수 있습니다. 다음으로 세종과학 펠로우십을 설명드리겠습니다."}, {"start": 1281, "end": 1309, "text": "세종과학 펠로우십은 내년부터 국내 트랙과 복귀·유치 트랙으로 운영하며 연구 기간은 5년입니다. 연간 연구비는 자동 자막에 ‘1.4 1.3억 원’으로 기록되어 트랙별 정확한 금액을 발표자료에서 확인해야 합니다. 선정 규모는 국내 트랙 170개 내외, 복귀·유치 트랙 200개 내외입니다. 국내 트랙은 3월 1일, 복귀·유치 트랙은 9월 1일에 개시합니다."}, {"start": 1309, "end": 1351, "text": "국내 트랙은 국내 대학에서 박사학위를 취득한 연구자, 복귀·유치 트랙은 해외 대학에서 박사학위를 취득한 연구자를 대상으로 합니다. 두 트랙 모두 박사학위 취득 후 7년 이내이거나 만 39세 이하인 연구자 중 국내 대학의 전임 교원이 아닌 사람 또는 국공립·민간 연구소 등의 비정규직 연구자가 대상입니다."}, {"start": 1351, "end": 1356, "text": "PBS가 폐지된 출연연은 신청할 수 없습니다."}, {"start": 1356, "end": 1461, "text": "신진 연구와 달리 비전임 교원과 비정규직 연구자를 대상으로 한다는 점을 확인해 주시기 바랍니다. 2026년 개인 연구지원 실적은 계속 과제를 포함해 약 15,700개, 예산은 약 2.3조 원입니다. 2027년 신규 선정 계획은 리더 연구 13개 내외·약 96억 원, 핵심 연구 3,705개 내외, 신진 연구 1,230개 내외·약 1,800억 원, 세종과학 펠로우십 370개 내외·약 455억 원입니다. 핵심 연구 예산은 자막의 ‘4,10억 원’만으로는 확정할 수 없어 발표자료 확인이 필요합니다. 전체 신규 지원 규모는 약 5,300개 과제, 약 6,367억 원입니다. 정부안 기준이므로 국회 심의 과정에서 변경될 수 있습니다."}, {"start": 1461, "end": 1467, "text": ""}, {"start": 1467, "end": 1477, "text": "리더 연구는 12월 초까지 접수하고 3~4월 선정 평가를 거쳐 6월에 개시할 예정입니다. 핵심 연구 유형 C·B·A, 도약형, 한우물 파기는 12월 초까지 접수하고 1~2월 평가를 거쳐 3월에 개시합니다. 글로벌 매칭형은 내년 1월경 공고하고 12월에 개시할 예정입니다. 전략형과 기본 연구 B·A는 내년 3월에 신청 요강을 안내하고 4월에 접수한 뒤, 8월까지 선정 절차를 거쳐 9월에 개시합니다."}, {"start": 1477, "end": 1523, "text": ""}, {"start": 1523, "end": 1533, "text": "하반기 개시 과제의 자세한 내용은 내년 3월경 재단 홈페이지에서 안내하겠습니다."}, {"start": 1533, "end": 1563, "text": "신진 연구 유형 B·A와 신진 지역 장기 연구는 12월 초까지 접수하고 1~2월 평가를 거쳐 3월에 개시합니다. 신진 연구자 인프라 지원 사업은 내년부터 9월에 개시합니다. 세종과학 펠로우십 국내 트랙은 12월 초까지 접수하고 평가를 거쳐 3월에 개시합니다. 복귀·유치 트랙은 3월까지 선정을 마친 뒤 복귀 준비 기간을 고려하여 9월에 개시합니다. 복귀·유치 트랙도 이번 개인 연구 1차 공고에 포함됩니다. 신청 요강과 서식은 11월 16일 월요일에 재단 홈페이지에서 안내할 예정입니다. 다음으로 개인 기초연구와 일부 집단 연구에 공통으로 적용되는 신규 과제 신청 유의 사항을 설명드리겠습니다."}, {"start": 1563, "end": 1628, "text": ""}, {"start": 1630, "end": 1654, "text": "리더 연구, 핵심 연구, 신진 연구, 세종과학 펠로우십은 12월 초까지 신청하면 됩니다. 연구 개시는 리더 연구가 6월, 세종 복귀·유치 트랙이 9월이며, 나머지 해당 사업은 3월입니다."}, {"start": 1654, "end": 1681, "text": "정확한 접수 마감일은 11월 5일에 공지한 공고문을 확인해 주시기 바랍니다. 신청 요강과 연구계획서 서식은 11월 16일에 공지합니다. 9월 개시 과제에 해당하는 개인 연구 2차 공고는 내년 3월 중에 안내할 예정입니다."}, {"start": 1681, "end": 1693, "text": "집단 연구는 12월 공고, 2월 접수를 거쳐 7~8월에 개시할 예정입니다."}, {"start": 1693, "end": 1701, "text": "자세한 내용은 다음 달 공고문을 확인해 주시기 바랍니다."}, {"start": 1705, "end": 1743, "text": "개인 기초연구 중 1인 1과제 원칙의 예외 사업을 안내합니다. 글로벌 매칭형은 연구재단 국제협력본부에서 추진하며, 내년 1월 공고 후 평가를 거쳐 12월에 개시할 예정입니다. 신진 연구자 인프라 지원 사업은 담당 기관에서 내년 3월에 별도로 공고하고 9월에 개시할 예정입니다."}, {"start": 1743, "end": 1772, "text": "두 사업은 신청 요강을 별도로 공고하므로 각 사업의 요강을 확인해 주시기 바랍니다. 이어서 신청 및 수행 제한을 설명합니다. 요건 심사에서 탈락할 수 있는 사항이므로 신청 전에 충분히 확인해 주시기 바랍니다."}, {"start": 1773, "end": 1780, "text": "개인 연구는 연구책임자로 1인 1과제 수행이 원칙입니다."}, {"start": 1780, "end": 1809, "text": ""}, {"start": 1809, "end": 1824, "text": ""}, {"start": 1824, "end": 1836, "text": "기존 개인 연구 과제를 수행 중인 연구책임자는 원칙적으로 신규 신청을 할 수 없습니다."}, {"start": 1836, "end": 1856, "text": "집단 연구도 연구책임자 또는 참여 연구원(공동)으로 1인 1과제 수행이 원칙이므로, 해당 역할로 과제를 수행 중이면 신규 신청이 제한됩니다. 신진 연구자 인프라 지원 사업, 기존 핵심 연구 도전형 수행 과제, 글로벌 매칭형은 예외적으로 중복 수행이 가능합니다. 신진 연구자 인프라 지원 사업은 개인·집단 과제를 수행하고 있어도 추가로 수행할 수 있습니다."}, {"start": 1856, "end": 1896, "text": "개인 기초연구는 수행 중인 과제가 2027년 12월 말까지 최종 종료되는 경우 신규 신청이 가능합니다."}, {"start": 1896, "end": 1931, "text": "리더 연구는 개시일인 2027년 6월 1일부터 10개월 이내에 기존 과제가 최종 종료되는 경우 신청할 수 있습니다. 한우물 파기는 수행 중인 과제의 최종 종료 시기와 관계없이 신청하고, 선정되면 해당 사업으로 전환할 수 있다고 안내합니다. 다만 교육부 소관 과제의 예외는 뒤의 FAQ에서 별도로 설명합니다. 집단 연구는 신규 과제 개시 후 10개월 이내에 기존 과제가 최종 종료되는 경우 신규 신청이 가능합니다. NRL 2.0 등의 구체적인 예외 요건은 12월 별도 공고를 참고해 주시기 바랍니다."}, {"start": 1931, "end": 2037, "text": ""}, {"start": 2037, "end": 2053, "text": "리더 연구책임자는 다른 국가연구개발사업을 포함하여 연구책임자로 한 개 과제만 추가 수행할 수 있습니다. 집단 연구사업의 연구책임자 신청에는 별도 제한이 있으므로 사업별 기준을 확인해 주시기 바랍니다. 세종 국내 트랙은 3월 1일에 개시하며, 개시 후 6개월 이내에 주관 연구기관을 확정하고 연구재단 심의를 받아야 합니다. 자막에 언급된 구체적인 마감 날짜는 공식 신청 요강에서 확인해야 합니다. 세종 복귀·유치 트랙은 9월 1일 개시 전에 주관기관을 확정해야 합니다. 이직으로 과제를 중단하는 경우, 개시 후 6개월이 지난 시점에 국내 기관으로 이직할 때만 정당한 사유로 인정된다고 안내합니다. 정해진 기한에 주관기관을 확정하지 못하면 선정이 취소될 수 있습니다. 국가연구소·선도연구센터·기초연구실 등 집단 연구의 세부 사항은 12월 공고에서 확인해 주시기 바랍니다."}, {"start": 2053, "end": 2060, "text": ""}, {"start": 2060, "end": 2073, "text": "제재 처분을 받은 연구자는 접수 마감일 전일까지 처분이 종료되는 경우에 한하여 신규 신청할 수 있습니다. 마감일 당일이 아니라 전일을 기준으로 한다는 점에 유의해 주시기 바랍니다."}, {"start": 2073, "end": 2087, "text": "국가연구개발 과제는 최대 5개까지 동시에 수행할 수 있으며, 그중 연구책임자로 수행할 수 있는 과제는 최대 3개입니다."}, {"start": 2091, "end": 2096, "text": ""}, {"start": 2096, "end": 2123, "text": "여성 연구자를 대상으로 개인 기초연구 핵심 유형 B에 20% 선정 목표제를 적용할 예정입니다."}, {"start": 2123, "end": 2136, "text": "지역 연구자 우대를 위해 기본 연구 A·B는 연구비 비율 기준 40% 이상을 배정할 예정이며, 집단 연구 중 기초연구실 심화형은 30% 수준을 지역 대학에 할당할 계획입니다."}, {"start": 2136, "end": 2176, "text": ""}, {"start": 2176, "end": 2190, "text": "성과 우수자에 대한 추가 선정 우대도 안내합니다."}, {"start": 2190, "end": 2200, "text": "해당 핵심 연구 유형은 자막에 ‘AP’로 기록되어 정확한 유형 확인이 필요합니다. 세종 국내 트랙 수행 중 전임 교원으로 신분이 바뀐 연구책임자가 5년간 연구를 정상 수행하고 종료하는 해에 신진 연구 유형 B에 신청하면 우대하여 선정할 예정입니다. 생애 첫 연구 및 경력단절 연구자는 핵심 연구 A에서 가점을 부여할 예정입니다. 신진 연구자 인프라 지원 사업에서는 연구시설·장비 통합관리 지정 기관에 가점을 부여합니다."}, {"start": 2200, "end": 2238, "text": "접수 마감일 기준 최근 3년 이내에 제재 처분을 받았거나 정당한 사유 없이 과제 수행을 포기한 연구자는 감점 대상이 될 수 있습니다. IRIS 신청에 앞서 연구자는 NRI 가입, 연구자 전환 동의, 정보 등록·갱신 등의 사전 절차를 완료해야 합니다."}, {"start": 2238, "end": 2278, "text": "주관 연구기관은 접수 전에 IRIS 기관 등록과 기관 담당자 권한 부여를 완료해야 합니다. 사전 절차를 마친 후 연구책임자는 온라인 정보를 입력하고 연구계획서를 업로드합니다. 주관 연구기관이 입력 정보와 제출 자료를 검토하여 승인하면 최종 접수가 완료됩니다."}, {"start": 2278, "end": 2291, "text": ""}, {"start": 2291, "end": 2333, "text": "접수 마감일에 신청이 몰리는 것을 방지하기 위해 사업별 마감일을 구분했습니다. 핵심 연구 유형 C·B·A와 도약형은 연구자 접수를 12월 7일에 마감하며, 주관기관 승인 마감일은 12월 9일입니다. 그 밖의 1차 공고 사업은 연구자 접수를 12월 8일에 마감하며, 주관기관 승인 마감일은 12월 10일입니다."}, {"start": 2333, "end": 2359, "text": "마감일에는 접속자가 몰려 시스템이 느려질 수 있으므로 2~3일 전에 여유 있게 작업을 완료해 주시기 바랍니다. 신진 연구자 인프라 지원 등 추후 공고되는 사업의 일정은 해당 공고에서 다시 확인해야 합니다."}, {"start": 2359, "end": 2405, "text": "과제 신청 전 체크리스트는 11월 16일에 공지하는 신청 요강에 포함될 예정입니다. 해당 항목을 읽고 스스로 점검해 주시기 바랍니다. 이어지는 슬라이드에는 신청 중과 신청 후의 체크리스트를 제시했습니다. 대표 항목 외에도 각자 확인해야 할 사항을 충분히 점검하시기 바랍니다."}, {"start": 2405, "end": 2419, "text": "체크리스트는 필수 사항을 놓쳐 요건 탈락 등의 불이익을 받는 일을 예방하기 위한 자료입니다."}, {"start": 2419, "end": 2533, "text": ""}, {"start": 2533, "end": 2541, "text": ""}, {"start": 2541, "end": 2543, "text": "직접비와 간접비는 분리하여 안내합니다. 연구자는 공고문과 신청 요강에 제시된 연간 총 연구비의 80% 수준을 직접비로 신청하면 됩니다. 선정 후 담당 팀에서 간접비를 별도로 산정하여 협약 시 총 연구비와 함께 안내합니다. 계상 예시는 표를 참고해 주시기 바랍니다. 과제 선정 후 표에 제시된 정당한 사유 이외의 이유로 수행을 포기하면 참여 제한 등의 제재 처분이 따를 수 있습니다. 특히 신진 지역 장기 연구는 수행 기간 중 지역 외 기관으로 이직하면 제재 대상이 될 수 있습니다. 이 점까지 고려하여 신중하게 신청해 주시기 바랍니다. 이상으로 개인 기초연구 안내와 신청 유의 사항 설명을 마치겠습니다."}, {"start": 2543, "end": 2555, "text": ""}, {"start": 2555, "end": 2559, "text": ""}, {"start": 2559, "end": 2564, "text": ""}, {"start": 2564, "end": 2570, "text": ""}, {"start": 2570, "end": 2574, "text": "한국연구재단 집단연구지원팀에서 집단 연구지원사업을 안내합니다."}, {"start": 2574, "end": 2615, "text": "현재 공고 전이며, 2027년도 사업 개편에 따라 12월 14일이 포함된 주간을 전후하여 별도로 공고할 예정입니다. 국가연구소는 대학 강점 분야의 우수 인력과 인프라를 활용하여 세계 최초·최고 수준의 혁신적 연구를 선도하는 연구소를 육성하는 사업입니다."}, {"start": 2615, "end": 2624, "text": "2027년 신규 과제는 총 3개이며, 대학별 최대 2개까지 신청하고 1개만 선정할 예정입니다. 신규 대학의 진입 기회를 확대하기 위해 2025~2026년에 선정된 8개 대학은 신청할 수 없습니다."}, {"start": 2624, "end": 2636, "text": "해당 대학 목록은 신청 요강을 참고해 주시기 바랍니다."}, {"start": 2636, "end": 2688, "text": "지역 대학 연구자가 안정적으로 연구를 지속하고 산학연 협력 등 지역 혁신의 핵심 주체로 성장하도록 지원합니다. 올해는 전국·지역 대학 유형을 구분했으나, 2027년 지원 규모와 방식은 국회 예산 심의 결과에 따라 조정될 수 있습니다. 지원 기간은 총 10년이며 3단계로 구성됩니다. 지원 규모는 연 100억 원이고, 2027년에는 추진 일정을 고려하여 7월 1일부터 12월 31일까지 6개월간 50억 원을 지원합니다. 지원 대상은 고등교육법 제2조에 따른 대학 소속의 KCI 등록 대학 부설 연구소로 안내합니다."}, {"start": 2688, "end": 2702, "text": "상세 자격과 요건은 별도 설명회와 추후 신청 요강에서 확인해 주시기 바랍니다."}, {"start": 2702, "end": 2704, "text": ""}, {"start": 2704, "end": 2715, "text": "집단 연구의 혁신성과 연구 분야의 다양성을 높이기 위해 2027년부터 기존 선도연구센터를 미래연구센터 체계로 전환합니다."}, {"start": 2715, "end": 2747, "text": "대학의 우수 연구 그룹이 국가·사회적 수요에 대응하는 혁신적 연구를 수행하고 지속 가능한 역량을 확보하도록 지원합니다."}, {"start": 2747, "end": 2780, "text": ""}, {"start": 2780, "end": 2809, "text": ""}, {"start": 2809, "end": 2843, "text": ""}, {"start": 2843, "end": 2863, "text": ""}, {"start": 2863, "end": 2875, "text": "미래연구센터는 미래연구·기초의과학·지역혁신의 3개 트랙, 5개 유형으로 구성됩니다."}, {"start": 2875, "end": 2894, "text": "미래연구 트랙에는 목표지향형 FRC-X, 탐구형 FRC-S, 혁신형 FRC-E가 있습니다. 모든 트랙과 유형의 연구 기간은 5년과 2년, 총 7년입니다. 연구비는 목표지향형 15억 원 이내, 탐구형 18억 원 이내, 혁신형 22억 원 이내입니다. 기초의과학과 지역혁신 트랙은 각각 15억 원 이내로 지원할 예정입니다. 대학 연구 그룹을 대상으로 하며, 기초의과학 트랙은 해당 분야 대학원이 설치된 대학, 지역혁신 트랙은 이공계 대학원이 설치된 지역 대학이 대상입니다. 나머지 유형의 대학원 설치 요건은 원문 자막이 불명확하므로 신청 요강을 확인해야 합니다. 목표지향형은 참여 연구자 수에 제한 없이 연구진을 구성할 수 있습니다. 그 밖의 유형은 원칙적으로 8명 이상이며, 지역혁신 트랙은 8명 이내로 구성해야 합니다. 후속 과제를 제외한 신규 선정 규모는 총 17개 내외입니다. 미래연구 트랙은 목표지향형 4개, 탐구형·혁신형 각 2개 내외입니다. 탐구형과 혁신형은 기존 종료 센터를 대상으로 별도의 후속 연구를 지원하며, 해당 센터는 3월 개시 일정을 확인해야 합니다. 기초의과학 트랙은 4개 내외, 지역혁신 트랙은 5개 내외를 신규 선정합니다. 지역혁신 트랙은 2026년에는 신규 지원이 없었습니다. FRC-X의 구체적인 지원 분야와 방향은 논의 중이며, 확정 후 신청 요강에서 안내합니다."}, {"start": 2894, "end": 2913, "text": "기초연구실은 특정 주제의 소규모 연구 그룹을 지원하여 국가 기초연구 역량을 강화하는 사업입니다. 유형은 심화형과 혁신형으로 구분됩니다."}, {"start": 2913, "end": 2918, "text": "창의적·도전적 연구 집단 육성을 위해 기존 개척형을 2027년부터 혁신형으로 개편합니다."}, {"start": 2918, "end": 2925, "text": "두 유형 모두 지원 기간은 3년, 연구비는 연 5억 원 이내입니다."}, {"start": 2925, "end": 2930, "text": "연구진은 연구책임자를 포함하여 3~4명으로 구성해야 합니다."}, {"start": 2930, "end": 2952, "text": "신진 연구 인력은 심화형에 1명 이상, 혁신형에 2명 이상 포함되어야 합니다. 또한 박사후연구원 1명 이상을 반드시 포함해야 합니다. 구성 요건을 충족하지 못하면 요건 심사에서 탈락할 수 있으므로 신청 전에 확인해 주시기 바랍니다."}, {"start": 2952, "end": 2976, "text": "이 구간의 자동 자막에는 신규 지원 규모가 심화형 84개, 혁신형 37개 내외로 기록되어 있으나, 뒤의 종합 안내에서는 혁신형 36개로 제시됩니다. 정확한 수치는 최종 공고 확인이 필요합니다. 혁신형에는 AI를 활용한 과학 난제 해결 연구 지원이 포함되며, 구체적인 내용은 추후 공고합니다."}, {"start": 2976, "end": 2997, "text": ""}, {"start": 2997, "end": 3014, "text": ""}, {"start": 3014, "end": 3022, "text": ""}, {"start": 3022, "end": 3031, "t
