ext": "신규 지원 규모를 종합하면 국가연구소는 3개 내외입니다."}, {"start": 3031, "end": 3035, "text": ""}, {"start": 3035, "end": 3060, "text": ""}, {"start": 3060, "end": 3064, "text": "최종 규모는 2027년 정부 예산 확정에 따라 변경될 수 있습니다. 미래연구 트랙은 총 10개 내외로, 목표지향형 4개, 탐구형·혁신형 각 3개 내외입니다. 탐구형과 혁신형에는 후속 과제가 각각 1개 포함됩니다."}, {"start": 3064, "end": 3075, "text": "기초의과학 트랙은 4개, 지역혁신 트랙은 5개 내외입니다. 기초연구실은 심화형 84개, 혁신형 36개 등 총 120개 내외입니다."}, {"start": 3075, "end": 3093, "text": ""}, {"start": 3093, "end": 3096, "text": "앞선 세부 설명의 혁신형 수치와 차이가 있으므로 공고문을 확인해야 합니다. 전체 집단 연구지원사업 신규 과제는 총 142개 내외입니다. 12월 공고 후 2월 접수와 선정 평가를 거쳐 연구를 개시합니다. 국가연구소의 1차년도는 2027년 7~12월의 6개월이며, 미래연구센터와 기초연구실은 2027년 8월부터 2028년 7월까지 12개월간 지원합니다. 올해는 모든 사업이 7월 1일에 개시했으나, 2027년에는 기초연구실 평가가 2단계로 확대되는 점 등을 고려하여 해당 사업의 개시일을 8월 1일로 조정했습니다. 후속 신규 과제는 2027년 3월 1일 개시 예정이므로 대상 사업단은 별도 일정을 참고해 주시기 바랍니다."}, {"start": 3096, "end": 3114, "text": "이어서 교육부 이공분야 학술연구지원사업을 안내합니다. 교육부 학술연구정책과에서 추진 방향을 설명합니다."}, {"start": 3114, "end": 3132, "text": "과기정통부 사업과 유사한 내용뿐 아니라 차이가 있는 사업도 있으므로 확인해 주시기 바랍니다."}, {"start": 3132, "end": 3150, "text": "내년도에는 학술연구 기반 구축 사업을 학술연구 인재 육성, 대학 연구 기반 구축, 지역 중심 혁신 지원, 통합 기초 지원의 네 영역으로 개편합니다. 각 영역을 차례로 설명드리겠습니다."}, {"start": 3150, "end": 3152, "text": "학술연구 인재 육성은 석사과정부터 전임 교원까지 연구자의 성장 단계에 걸쳐 지원하는 사업입니다. 이 구간의 예산은 자동 자막에서 금액 단위가 누락되어 발표자료 확인이 필요합니다. 대학원생 연구장려금은 석사·박사과정생의 학위논문 연구를 지원합니다. 박사후 성장 지원은 박사후연구원에게 국내·국외 연수 기회를 제공합니다. 기본 연구 포용형은 대학 비전임 교원과 박사후연구원을 지원합니다."}, {"start": 3152, "end": 3206, "text": "미래도전 연구 지원은 기초과학 분야 대학 연구자의 다학제 융합 연구를 지원하며, 보호 연구는 국가 차원의 보호와 진흥이 필요한 분야를 지원합니다. 다음은 대학 연구 기반 구축입니다. 이 영역에는 총 2,817억 원이 편성되었습니다."}, {"start": 3206, "end": 3240, "text": "기초연구소 지원에는 대학중점연구소와 대학 기초연구소를 지원하는 G-LAMP 사업이 포함됩니다. 기초 인프라 지원에서는 대학 내 장비·시설의 거버넌스를 개편하고 통합 관리 체계를 구축하는 사업을 신설합니다. 발표에서 ‘셰어’로 소개한 사업의 세부 내용은 내년 초 핵심연구지원센터 사업과 함께 별도 설명회에서 안내할 예정입니다."}, {"start": 3240, "end": 3282, "text": "핵심연구지원센터는 분야별 공동 활용 인프라와 첨단 R&D 장비 구축을 통해 장비 전문 인력을 육성하고 연구를 지원합니다. 대학 연구 기반 구축 영역에서는 국가연구소 사업도 과기정통부와 함께 추진합니다."}, {"start": 3282, "end": 3291, "text": "지역 중심 혁신 지원에는 총 171억 원을 편성했다고 안내합니다. 글로컬랩은 지역 산업에 기반한 대학 연구소의 역량을 강화하여 지역 발전을 선도하도록 지원합니다. 글로컬 R&D는 비수도권 대학 연구자를 중심으로 기초연구와 국제 협업을 지원합니다. 통합 기초 지원에는 661억 원이 편성되었으며, 현재는 일몰에 따라 계속 사업만 지원하고 있습니다."}, {"start": 3291, "end": 3294, "text": "교육부의 내년도 예산은 정부안 기준 6,469억 원입니다. 국회 논의를 거쳐 최종 확정하며, 자세한 내용은 내년 초 사업 시행 계획 공고에서 안내합니다. 학술연구 인재 육성에서는 기본 연구와 미래도전 연구 지원을 확대할 계획입니다. 대학 연구 기반 구축 중 대학중점연구소는 일몰되어 계속 과제만 지원합니다. G-LAMP의 신규 선정 규모는 자막이 불명확하여 발표자료 확인이 필요합니다."}, {"start": 3294, "end": 3352, "text": "핵심연구지원센터는 신규·후속을 합쳐 15개, ‘셰어’ 사업은 3개를 지원할 계획입니다. 국가연구소는 과기정통부와 함께 3개를 지원하도록 준비하고 있습니다."}, {"start": 3352, "end": 3390, "text": "글로컬랩은 계속 과제 24개에 더해 신규 5개를 선정할 계획이며, 현재 거점형 3개와 컨소시엄형 2개로 준비하고 있습니다. 글로컬 R&D는 신규 112개 과제를 계획하고 있습니다. 이어서 한국연구재단 이공학술지원팀에서 세부 사업과 신청 유의 사항을 설명합니다."}, {"start": 3391, "end": 3404, "text": "한국연구재단 이공학술지원팀에서 교육부 사업 내용과 신규 과제 신청 유의 사항을 설명합니다."}, {"start": 3405, "end": 3415, "text": "안내 내용은 2027년 시행 계획 수립 과정에서 변경될 수 있으며, 자세한 사항은 사업별 공고문에서 확인해야 합니다."}, {"start": 3415, "end": 3430, "text": "학문후속세대 지원은 대학원생부터 박사후연구원과 신진 연구자까지 성장 단계에 맞춰 연구 활동을 지원하는 사업입니다."}, {"start": 3430, "end": 3442, "text": "대학원생 연구장려금은 석사·박사과정생의 학위논문 연구비를 지원합니다."}, {"start": 3442, "end": 3495, "text": ""}, {"start": 3495, "end": 3505, "text": "석사과정 지원은 국내 대학원에 전일제로 재학 중인 학생을 대상으로 합니다. 석사·석박사통합과정의 학기 요건은 자동 자막에서 과정명이 중복되어 정확한 구분을 신청 요강에서 확인해야 합니다. 연구 기간은 1년, 연구비는 연 1,200만 원이며 연구수당은 계상할 수 없습니다. 신규 1,044개 과제에 125억 2,800만 원을 지원하고 9월 1일에 개시합니다. 박사과정 지원은 국내 대학원 전일제 박사과정생 등을 대상으로 하며, 통합과정·수료생의 세부 포함 범위는 신청 요강을 확인해야 합니다. 연구 기간은 1~2년, 연구비는 연 2,500만 원이고 인건비 1천만 원 이상을 반드시 계상해야 합니다. 신규 782개 과제를 선정하여 9월 1일에 개시합니다. 총예산은 자동 자막의 숫자가 불명확하므로 발표자료 확인이 필요합니다."}, {"start": 3505, "end": 3551, "text": "박사후 성장 지원은 박사학위 취득 후 연구 역량을 높이고 독립적인 연구자로 성장하도록 돕는 사업입니다. 박사후 국내 연수는 국내 대학 박사학위 취득 후 5년 이내인 연구자를 대상으로 합니다. 연구 기간은 1~3년, 연구비는 연 6천만 원이며, 신규 70개 과제에 총 21억 원을 지원하고 9월 1일에 개시합니다. 박사후 국외 연수는 국내외 대학 박사학위 취득 후 5년 이내인 연구자를 대상으로 합니다. 연구 기간은 1년, 연구비는 6천만 원으로 안내하며, 신규 80개 과제에 총 48억 원을 지원하고 9월 1일에 개시합니다."}, {"start": 3551, "end": 3594, "text": "학술 생태계 조성 지원은 안정적인 연구 기회와 다양한 경험을 보장하기 위해 기본 연구 포용형, 미래도전 연구 지원, 보호 연구 등 연구자 맞춤형 지원을 제공합니다. 기본 연구 포용형은 대학 소속 비전임 교원과 박사후연구원의 조기 정착을 돕기 위해 연구 경험과 기회를 제공합니다."}, {"start": 3594, "end": 3613, "text": "단독 연구를 지원하며 연구 기간은 3년입니다."}, {"start": 3613, "end": 3621, "text": "신규 800개 과제에 총 240억 원을 지원하고 9월 1일에 개시합니다. 과제당 연간 연구비는 자막이 불명확하여 발표자료 확인이 필요합니다."}, {"start": 3621, "end": 3651, "text": "미래도전 연구 지원은 새로운 영역을 개척하고 패러다임의 변화를 가져올 수 있는 잠재력 높은 다학제 협력 연구를 지원합니다. 대학 소속 연구자의 공동 연구를 대상으로 하며, 연구 기간은 5년, 연구비는 연 1억 6천만 원입니다. 신규 35개 과제에 총 28억 원을 지원하고 9월 1일에 개시합니다. 보호 연구는 국가 차원의 보호·육성이 필요한 분야를 지원하여 학문의 균형 발전을 도모합니다. 대학 소속 연구자의 공동 또는 단독 연구를 지원하며 연구 기간은 5년입니다. 단독 연구비는 1억 원으로 안내하고, 공동 연구비는 자막의 ‘2억 8’만으로는 정확한 금액을 확인할 수 없습니다. 신규 35개 과제에 총 21억 원을 지원하고 9월 1일에 개시합니다."}, {"start": 3651, "end": 3678, "text": "대학 연구 기반 구축과 인프라 지원은 대학의 기초연구 육성·운영 체계를 확충하여 안정적인 연구 환경을 조성하는 사업입니다. 주요 사업으로 핵심연구지원센터 조성·운영과 대학 연구지원 기반 구축을 안내합니다."}, {"start": 3678, "end": 3701, "text": "연구시설·장비의 공동 활용을 활성화하고 대학 내 지원 기반을 체계적으로 구축하는 것이 목적입니다. 담당 기관에서 자세한 내용을 별도로 안내할 예정입니다. G-LAMP도 차년도 계획을 수립하여 안내하며, 국가연구소는 앞선 과기정통부 설명과 같습니다."}, {"start": 3701, "end": 3704, "text": "지역 중심 혁신 지원에는 글로컬랩과 글로컬 R&D가 있습니다."}, {"start": 3704, "end": 3728, "text": "지역 수요와 대학의 강점을 연결하고 대학·연구기관 간 협업을 통해 지속 가능한 연구 기반을 마련하는 데 중점을 둡니다."}, {"start": 3728, "end": 3744, "text": "글로컬랩은 대학 부설 연구소를 대상으로 거점형과 컨소시엄형을 구분하여 선정합니다. 연구 기간은 9년이며, 컨소시엄형 연구비는 연 24억 원입니다. 거점형 연구비는 자동 자막에서 누락되어 확인이 필요합니다."}, {"start": 3744, "end": 3761, "text": "신규 5개 내외에 42억 5천만 원을 지원하고 9월 1일에 개시할 예정입니다. 유형별 선정 수는 변동될 수 있습니다."}, {"start": 3761, "end": 3766, "text": ""}, {"start": 3766, "end": 3773, "text": "사업마다 학위 취득 시점, 연구 경력, 소속 기관, 참여 자격이 다를 수 있으므로 공고문과 신청 요강을 확인해야 합니다."}, {"start": 3773, "end": 3817, "text": ""}, {"start": 3817, "end": 3829, "text": "개별 사업 내에서는 한 개 과제만 신청·수행할 수 있으며, 집단 사업에서도 연구책임자 또는 공동연구자로 한 개 과제만 신청·수행할 수 있습니다. 수행 중인 과제가 신청 과제 개시일로부터 10개월 이내에 종료되는 경우에는 예외를 인정합니다."}, {"start": 3829, "end": 3870, "text": ""}, {"start": 3870, "end": 3873, "text": "기초 인프라 지원 사업은 다른 집단 과제와의 중복 수행이 허용됩니다. 정부 R&D 공통 사항인 동시 수행 과제 수와 연구책임자 수행 과제 수 제한, 신청 절차는 앞선 과기정통부 설명과 같습니다. 2027년 과기정통부·교육부 신청 연구계획서를 대상으로 차별성 검토를 실시하며, 차별성이 없는 것으로 판정되면 불이익을 받을 수 있습니다. 신청 요강을 준수하지 않으면 요건 심사에서 탈락할 수 있으므로 연구 단계와 목표에 적합한 사업을 선택하고 자격·계획·일정을 충분히 검토해 주시기 바랍니다."}, {"start": 3873, "end": 3884, "text": ""}, {"start": 3885, "end": 3892, "text": "한국연구재단 자연과학단에서 기초연구사업 평가제도를 설명합니다."}, {"start": 3892, "end": 3901, "text": "신청하려는 사업이 어떤 방법과 기준으로 평가되는지 안내하겠습니다."}, {"start": 3901, "end": 3915, "text": "평가 유형은 온라인 서면, 토론, 발표 평가로 구분되며 일부 사업에는 해외 서면과 심층 평가를 적용합니다."}, {"start": 3915, "end": 3922, "text": "온라인 서면 평가는 신청 연구계획서를 개별적으로 평가하는 방식입니다."}, {"start": 3922, "end": 3937, "text": "RB 분야 또는 유사 세부 분야를 기준으로 평가 대상 과제를 구성하고, 평가위원 3~5명이 각각 점수를 부여합니다."}, {"start": 3937, "end": 3945, "text": "평가 분과당 과제 규모는 자막의 단위가 불명확하므로 발표자료를 참고해 주시기 바랍니다. 해외 서면 평가는 리더 연구에 적용하며, 해외 석학이 평가위원으로 참여하는 온라인 서면 평가입니다."}, {"start": 3945, "end": 3956, "text": "토론 평가는 평가위원들이 직접 모여 신청 계획서를 검토하고 토론하여 우수 과제를 추천하는 방식입니다."}, {"start": 3956, "end": 3968, "text": "발표 평가는 계획서 검토에 연구책임자의 발표·질의응답과 평가위원 토론을 더합니다."}, {"start": 3968, "end": 3991, "text": "심층 평가는 분야별 최고 수준의 전문가로 위원회를 구성하고 충분한 시간을 두고 토론, 연구책임자 발표, 질의응답을 진행합니다. 리더 연구·미래연구센터·국가연구소 선정 평가에 적용됩니다."}, {"start": 3992, "end": 3996, "text": ""}, {"start": 3996, "end": 4007, "text": "리더 연구 유형 A·B는 1차 예비 평가를 토론 방식으로 진행합니다. 2차 본평가는 해외 서면과 발표 평가로 진행하며 심층 평가를 적용합니다."}, {"start": 4007, "end": 4018, "text": "핵심 연구 유형 C는 토론, 유형 B·A는 온라인 서면 평가로 진행합니다. 한우물 파기 기초연구는 토론 평가를 실시합니다."}, {"start": 4018, "end": 4034, "text": "글로벌 매칭형은 1차 온라인 서면 또는 토론 평가, 2차 양국 공동 패널 토론 평가를 진행합니다. 하반기에 개시하는 전략형과 기본 연구 B·A는 온라인 서면 평가를 실시합니다."}, {"start": 4034, "end": 4048, "text": "신진 연구 유형 B·A는 온라인 서면 평가, 신진 연구자 인프라 지원은 1차 토론·2차 발표 평가, 신진 지역 장기 연구는 토론 평가를 실시합니다."}, {"start": 4048, "end": 4057, "text": "세종과학 펠로우십 국내·복귀 유치 트랙은 모두 온라인 서면 평가입니다."}, {"start": 4057, "end": 4067, "text": "국가연구소는 1차 서면·토론, 2차 발표 평가로 진행하며 심층 평가를 적용합니다."}, {"start": 4067, "end": 4080, "text": "미래연구센터도 1차 토론·2차 발표 및 심층 평가를 적용합니다. 기초연구실은 2027년부터 1차 토론·2차 발표 평가를 실시할 예정입니다."}, {"start": 4081, "end": 4100, "text": "2027년부터 도전적·혁신적 연구를 촉진하기 위해 혁신성을 중심으로 선정 평가를 진행합니다. 창의성·도전성 항목을 평가할 때 목표의 도전성과 혁신성을 함께 고려할 예정입니다."}, {"start": 4100, "end": 4137, "text": ""}, {"start": 4137, "end": 4158, "text": ""}, {"start": 4158, "end": 4174, "text": "사업의 목적·특성과 평가 방식에 따라 배점 또는 가중치를 다르게 적용합니다. 리더 연구의 1차 예비 평가 배점은 창의성·원천성·도전성 50점, 연구자의 우수성 40점, 성과 활용 및 기대 효과 10점입니다. 2차 본평가는 창의성·원천성·도전성 35점, 연구책임자 역량 45점, 목표의 타당성·달성 가능성 10점, 유치기관 지원 의지 10점입니다. 핵심 연구 유형 C는 토론 합의 평가로, 4개 항목에 각각 40%·30%·20%·10%의 가중치를 적용합니다. 유형 B·A는 온라인 서면 평가에서 같은 가중치를 적용하여 총 100점을 부여합니다. 기본 연구 B·A는 온라인 서면 평가로 진행하며 4개 항목에 각각 50%·30%·10%·10%를 적용하여 총 100점을 부여합니다."}, {"start": 4174, "end": 4200, "text": "도약형은 CRB를 중심으로 구성한 전문 평가단의 1차 토론 평가에서 2개 항목에 70%·30%의 가중치를 적용합니다. 표에서 퍼센트는 가중치, 점 단위는 부여 점수를 뜻합니다."}, {"start": 4200, "end": 4223, "text": "신진 연구 유형 B·A와 세종과학 펠로우십의 세부 항목은 화면 자료를 참고해 주시기 바랍니다. 특히 세종 국내 트랙과 복귀·유치 트랙은 항목과 가중치가 다르므로 신청 유형별 기준을 확인해야 합니다."}, {"start": 4225, "end": 4238, "text": "한우물 파기 기초연구, 신진 연구자 인프라 지원, 핵심 연구 전략형의 평가 항목은 자료를 참고해 주시기 바랍니다."}, {"start": 4238, "end": 4265, "text": ""}, {"start": 4265, "end": 4271, "text": "변경된 평가 방식을 추가로 안내합니다. 한우물 파기는 기존 1차 토론·2차 발표 방식에서 2027년부터 토론 평가만 실시하는 방식으로 변경합니다. 전략형은 2026년 예비 계획서 평가 후 본계획서를 제출받는 2단계 방식이었으나, 2027년에는 계획서를 한 차례 접수하여 온라인 서면 평가를 실시합니다. 글로벌 매칭형의 평가 항목도 화면 자료를 참고해 주시기 바랍니다."}, {"start": 4272, "end": 4298, "text": "기초연구실은 2027년부터 1차 토론·2차 발표 평가를 실시합니다. 1차는 항목별 가중치에 따른 합의 방식, 2차는 개별 점수 부여 방식입니다."}, {"start": 4298, "end": 4316, "text": ""}, {"start": 4316, "end": 4329, "text": "세부 평가 항목과 가중치는 자료를 참고해 주시기 바랍니다. 미래연구센터는 분야와 목적에 따라 유형별 평가 항목이 다르지만 공통적으로 1차 토론·2차 발표 평가를 진행합니다. FRC-X의 최종 평가 항목은 신규 공고에서 확인해야 합니다."}, {"start": 4329, "end": 4332, "text": ""}, {"start": 4332, "end": 4343, "text": "국가연구소는 연구개발, 연구소 운영, 지원 의지의 세 영역으로 평가한다고 안내합니다. 지원 의지 항목의 정확한 명칭과 배점은 발표자료를 참고해 주시기 바랍니다."}, {"start": 4343, "end": 4350, "text": "향후 세부 평가 계획에 따라 변경될 수 있습니다."}, {"start": 4350, "end": 4360, "text": "각 사업의 평가 항목은 신청 요강에서도 확인할 수 있습니다."}, {"start": 4361, "end": 4367, "text": ""}, {"start": 4367, "end": 4384, "text": "교육부 학술연구 인재 육성 중 석사과정 연구장려금은 전문 평가단의 토론 평가, 박사과정 연구장려금과 박사후 국내·국외 연수는 온라인 평가로 진행할 계획입니다."}, {"start": 4384, "end": 4395, "text": "기본 연구 포용형은 온라인 평가, 미래도전 연구 지원과 보호 연구는 토론 평가를 진행할 예정입니다."}, {"start": 4395, "end": 4419, "text": "글로컬랩은 1차 토론·2차 발표, 글로컬 R&D는 온라인 평가를 실시합니다. 교육부 사업 종합 계획은 아직 확정되지 않았으므로 평가 방식·항목·배점은 사업 공고 시 변경될 수 있습니다."}, {"start": 4419, "end": 4439, "text": "신청하려는 사업의 최종 평가 기준을 신청 요강에서 반드시 확인해 주시기 바랍니다. 이상으로 평가제도 설명을 마치겠습니다."}, {"start": 4439, "end": 4457, "text": ""}, {"start": 4458, "end": 4465, "text": "개인 연구지원사업의 주요 질문에 답변드리겠습니다."}, {"start": 4465, "end": 4586, "text": ""}, {"start": 4586, "end": 4603, "text": ""}, {"start": 4603, "end": 4611, "text": "먼저 PBS가 폐지된 출연연 소속 연구자의 신규 신청과, 과제 수행 중 해당 출연연으로 이직할 때의 처리 기준입니다. 해당 출연연 소속 연구자는 원칙적으로 신규 신청을 할 수 없습니다. 2026년 2차 신규 과제에 선정되어 수행 중인 연구자가 해당 출연연으로 이직하면 과제를 중단해야 하며, 정당한 사유에 따른 중단으로 처리할 예정입니다. 그보다 앞서 선정된 과제는 계속 수행할 수 있다고 안내합니다. 정확한 적용 시점은 신청 요강을 확인해야 합니다. 예외적으로 개인 기초연구 2차 공고의 핵심 연구 전략형에는 PBS가 폐지된 출연연 연구자도 신청할 수 있습니다. 기존 개인 기초연구를 수행 중인 연구자는 해당 과제가 리더 연구 개시일인 2027년 6월 1일부터 10개월 이내에 최종 종료되는 경우 리더 연구에 신규 신청할 수 있습니다. 리더 연구 유형 B에는 2027년 3단계 진입 예정인 기존 리더 연구자도 신청할 수 있습니다. 신규 선정 시 기존 과제는 정당한 사유에 따른 중단으로 처리할 예정입니다."}, {"start": 4611, "end": 4642, "text": "학내 보직을 맡고 있는 연구자가 리더 연구에 선정되면 연구 개시 후 2개월 이내에 전문기관의 보직 수행 승인을 받아야 합니다."}, {"start": 4642, "end": 4663, "text": "상반기 1차 핵심 연구에 신청했더라도 선정되지 않았다면 하반기 2차 공고의 기본 연구 B·A와 전략형에 신청할 수 있습니다."}, {"start": 4663, "end": 4760, "text": ""}, {"start": 4760, "end": 4784, "text": "리더 연구와 핵심 연구 유형 C·B·A 또는 도약형 중 한 개 과제는 예외적으로 중복 신청할 수 있습니다. 다만 동시 수행이 허용되는 것은 아닙니다. 핵심 연구가 먼저 선정되더라도 리더 연구 결과를 기다린 뒤, 리더 연구에도 선정되면 리더 연구를 수행합니다. 도약형은 내년부터 단일 유형으로 통합하며, 간접비를 포함한 연구비는 연 최대 2.5억 원, 연구 기간은 3년으로 고정합니다."}, {"start": 4784, "end": 4828, "text": "2026년에 지원 대상 과제가 종료된 연구자는 2027년 도약형에 신청할 수 없습니다. 도약형은 신청 연도에 과제가 종료될 예정인 연구자에게 해당 연도 한 차례의 신청 기회를 제공합니다. 핵심 연구 유형 B·C와 신진 연구 유형 B 이외의 연구책임자는 도약형에 신청할 수 없습니다. 기존 중견 연구와 우수신진 연구의 후속 지원을 도약형으로 개편한 취지에 따라 지원 대상의 일관성을 유지하기 위한 기준입니다."}, {"start": 4828, "end": 4859, "text": "한우물 파기에는 대학 소속 비정규직 연구원도 신청할 수 있습니다. 산학협력단·대학 부설 연구소의 비정규직 연구원과 박사후연구원 등이 포함됩니다."}, {"start": 4859, "end": 4936, "text": "다만 박사학위 취득 후 15년 이내여야 하며, 2012년 1월 1일 이후 학위 취득자로 안내합니다."}, {"start": 4936, "end": 4945, "text": "기존 과제의 최종 종료 시기와 관계없이 신청할 수 있다는 설명은 과기정통부 소관 개인 기초연구에 해당합니다. 교육부 소관 개인 기초연구를 수행 중이면 2027년 말까지 최종 종료되는 과제에 한하여 신청할 수 있다고 안내합니다. 이 구간의 자막에는 ‘12월 30일 이전’과 ‘12월 말일’이 함께 기록되어 있으므로 정확한 기준일은 신청 요강을 확인해야 합니다."}, {"start": 4945, "end": 4982, "text": "핵심 연구 전략형은 국가전략기술과 미래 유망 분야 등 국가·사회적 수요에 대응하도록 기획한 유형입니다. 따라서 PBS가 폐지된 출연연 소속 연구자도 예외적으로 신청·수행할 수 있습니다."}, {"start": 4982, "end": 4993, "text": "연구 개시는 하반기인 9월 1일 예정입니다. 기본 연구 B·A는 9월 1일 개시 유형이며 3월경 공고할 예정입니다. 지역 연구자의 범위를 설명하면, 서울·인천·경기 소재 기관과 4대 과학기술원, 포항공대는 지역 기관에서 제외된다고 안내합니다. 법령상 분교 중 수도권 밖에 소재한 기관은 지역 대학·연구기관에 해당할 수 있습니다."}, {"start": 4993, "end": 5050, "text": "한양대 ERICA는 분교이지만 소재지가 수도권이므로 지역 기관에 해당하지 않는다는 예시를 제시합니다. 관련 법 조항과 세부 적용 범위는 공고문에서 확인해야 합니다."}, {"start": 5050, "end": 5113, "text": "대학병원 소속 연구자도 병원이 대학과 별도 법인으로 설립되어 있고 연구비 중앙 관리가 가능하다면 하반기 기본 연구 B·A에 신청할 수 있다고 안내합니다. 신진 연구의 최초 임용 경력은 특정 정년·비정년 트랙에 한정하지 않고 주관 연구기관 규정상 최초 조교수 이상 직위로 임용된 시점을 기준으로 판단합니다. 신청 자격에 해당하는지는 기존 임용 이력을 포함하여 확인해야 합니다."}, {"start": 5113, "end": 5198, "text": "세종 국내 트랙 수행 중 전임 교원이 된 연구책임자가 중단 없이 5년간 과제를 수행하고 정상 종료하는 해에 신진 연구 유형 B에 신청하면 우대하여 선정할 예정입니다. 출산·육아휴직 기간에 따른 자격 인정 사항을 증빙할 때 반드시 공문을 제출할 필요는 없습니다. 신청서 서식에 포함된 확인서와 증빙자료를 주관기관 승인 마감일까지 IRIS로 제출하면 됩니다. 구체적인 인정 기준과 서식은 신청 요강을 확인해 주시기 바랍니다."}, {"start": 5198, "end": 5233, "text": "신진 지역 장기 연구는 연구 초기인 1~2차년도에 연구시설·장비를 구축하고 이를 기반으로 안정적인 연구를 지원하는 사업입니다. 장비 구축 계획이 없으면 신청할 수 없습니다."}, {"start": 5233, "end": 5260, "text": "연구책임자는 1~2차년도에 연구시설·장비비 총 3억 원 이상을 의무적으로 계상해야 하며, 계상한 3억 원은 2차년도 종료일까지 반드시 집행해야 합니다. 과제 수행 중 이직할 경우 국내 지역 대학으로 옮길 때만 계속 수행할 수 있습니다. 지역 연구소는 이 조건에 포함되지 않습니다."}, {"start": 5262, "end": 5314, "text": "국내 지역 대학 이외의 기관으로 이직하면 정당한 사유에 해당하지 않는 수행 포기로 간주하여 참여 제한 등의 제재를 받을 수 있습니다."}, {"start": 5314, "end": 5367, "text": "세종과학 펠로우십 수행 중 국외 파견·체류는 국내 및 복귀·유치 트랙 모두 최대 1년으로 제한한다고 안내합니다."}, {"start": 5367, "end": 5398, "text": ""}, {"start": 5399, "end": 5499, "text": ""}, {"start": 5499, "end": 5505, "text": "출입국사실증명서의 출국일과 입국일을 기준으로 산정합니다. 복귀·유치 트랙은 연구개발계획서에 1년 이상 파견 계획이 명시되어 있고 필요성을 인정받은 경우 예외가 가능하다고 설명하며, 구체적인 승인 기준은 신청 요강을 확인해야 합니다. 복귀·유치 트랙은 연구책임자의 입국 준비 기간을 고려하여 상반기에 선정을 마치더라도 9월 1일에 연구를 개시합니다. 신청 당시 소속이 없어도 연구 개시일 기준 소속 예정 기관이 확정되어 있다면 해당 기관을 주관 연구기관으로 신청하면 됩니다. 소속 예정 기관이 없거나 현재 소속 기관을 통한 신청이 불가능한 경우에는 한국연구재단을 주관기관으로 지정하여 신청할 수 있습니다. 이 방식으로 신청한 경우 국내 트랙은 3월 1일 개시 후 6개월 이내에, 복귀·유치 트랙은 9월 1일 개시 전에 주관 연구기관을 확정하고 한국연구재단 심의를 받아야 합니다. 기한 내 이행하지 않으면 선정이 취소됩니다. 이상으로 개인 연구 FAQ를 마치겠습니다."}, {"start": 5506, "end": 5514, "text": ""}, {"start": 5514, "end": 5518, "text": ""}, {"start": 5518, "end": 5535, "text": ""}, {"start": 5535, "end": 5562, "text": ""}, {"start": 5562, "end": 5574, "text": ""}, {"start": 5574, "end": 5580, "text": ""}, {"start": 5580, "end": 5585, "text": ""}, {"start": 5585, "end": 5594, "text": "집단 연구의 공동 연구진과 참여 연구원(공동)의 차이를 설명합니다. 국가연구개발사업 연구개발비 사용 기준에 따른 참여 연구자는 연구책임자와 학생연구자를 포함하여 과제에 참여하는 모든 연구자를 의미합니다. 집단 연구에서는 사업의 특성을 고려하여 공동 연구진과 참여 연구원(공동)을 구분합니다. 공동 연구진은 연구책임자와 참여 연구원(공동)으로 구성되며, 참여 연구원(공동)에게는 사업별 자격, 신청 과제 수 제한, 성과목표관리제에 따른 수행 기간 유지 등의 기준이 적용됩니다. 미래연구센터의 참여 연구원(공동)은 국내외 대학의 전임·비전임 교원 또는 국내외 공공·민간 연구소의 선임연구원 이상으로 안내합니다. 기초연구실의 자격은 자막에 ‘전임·비전임 연구원’으로 기록되어 정확한 직위 범위를 신청 요강에서 확인해야 합니다. 사업별 공동 연구진 수는 표를 참고해 주시기 바랍니다. 공동 연구진 중 연구책임자를 제외한 인원이 참여 연구원(공동)에 해당합니다."}, {"start": 5594, "end": 5622, "text": "미래연구센터와 기초연구실에서 신규 선정 후 1차년도 연구 기간 중 참여 연구원(공동)을 변경하면 차년도 연구비의 20%가 삭감된다고 안내합니다. 해당 인력은 성과목표관리제 등의 적용 대상입니다."}, {"start": 5622, "end": 5632, "text": "개인 기초연구의 연구책임자는 집단 과제의 연구책임자 또는 참여 연구원(공동)으로 한 개 과제를 추가 수행할 수 있습니다."}, {"start": 5632, "end": 5671, "text": "다만 리더 연구책임자는 기존 과제가 집단 과제 개시 후 10개월 이내에 최종 종료되는 경우에만 연구책임자로 신청할 수 있다고 안내합니다. 제시된 종료 기준일은 2028년 5월 31일이며, 최종 공고를 확인해야 합니다. 다음 질문은 미래연구센터 공동 연구진으로 과제를 수행 중인 경우 국가연구소 연구책임자로 신청할 수 있는지입니다. 이어서 예외 기준을 설명합니다."}, {"start": 5671, "end": 5703, "text": ""}, {"start": 5703, "end": 5714, "text": "집단 연구 과제를 수행 중인 연구책임자와 참여 연구원(공동)은 원칙적으로 신규 신청이 불가능합니다. 다만 국가연구소 연구책임자로 신청할 때는 제한적으로 예외를 허용합니다. 미래·선도연구센터의 연구책임자는 단계 종료를 고려하여 2028년에 후속 단계가 개시되는 과제에 한하여 신청할 수 있다고 안내합니다. 해당 센터의 참여 연구원(공동)은 신청할 수 있습니다. 기초연구실은 단계 구분이 없으므로 연구책임자와 참여 연구원(공동) 모두 신청할 수 있다고 설명합니다."}, {"start": 5714, "end": 5727, "text": "국가연구소 과제를 수행 중인 연구책임자와 참여 연구원(공동)은 미래연구센터 신규 과제에 신청할 수 없습니다. 미래연구센터는 이 경우에 별도의 예외를 두지 않고 집단 연구의 과제 수 제한을 적용합니다."}, {"start": 5727, "end": 5755, "text": ""}, {"start": 5755, "end": 5761, "text": ""}, {"start": 5761, "end": 5786, "text": "집단 연구에서 신진 연구 인력은 박사학위 취득 후 7년 이내, 만 39세 이하, 또는 최초 조교수 이상 직위로 임용된 지 5년 이내인 연구자를 의미합니다. 상세 자격은 자료를 확인해 주시기 바랍니다. 기초연구실에서는 신진 연구 인력이 필수 구성원이므로 접수 시점에 포함되지 않으면 요건 심사에서 탈락합니다."}, {"start": 5786, "end": 5810, "text": "심화형에는 1명 이상, 혁신형에는 2명 이상을 포함해야 합니다. 다른 국가연구개발사업의 연구책임자로 두 개 과제를 수행 중이면 미래연구센터 연구책임자로 신청할 수 없습니다."}, {"start": 5810, "end": 5814, "text": ""}, {"start": 5814, "end": 5841, "text": "미래연구센터에 선정된 경우 다른 국가연구개발사업의 연구책임자로는 한 개 과제까지만 수행할 수 있습니다. 다만 기존 과제가 신규 연구 개시일부터 10개월 이내에 최종 종료되는 경우에는 예외적으로 신청할 수 있다고 안내합니다. 이 구간 자막의 개시 연도는 앞선 일정 안내와 일치하지 않으므로 정확한 날짜는 최종 공고 확인이 필요합니다. 이상으로 집단 연구 FAQ를 마치겠습니다."}, {"start": 5841, "end": 5872, "text": "설명회 이후 추가 질문은 화면에 안내한 사업별 담당자 연락처 또는 재단 홈페이지를 통해 문의해 주시기 바랍니다. 전용 사이트에서의 다시 보기는 11월 30일 월요일 오후 6시까지 가능하며, 재단 YouTube 채널에서는 설명회 영상을 계속 시청할 수 있습니다. 발표자료 파일은 재단 홈페이지의 기초연구사업 게시판에서 내려받을 수 있습니다."}, {"start": 5872, "end": 5891, "text": "접수된 질문에는 개별 이메일로 답변할 예정입니다. 구체적인 답변 기한은 자동 자막만으로 확정하기 어려워 별도 안내를 확인해야 합니다. 이상으로 2027년도 기초연구사업 설명회를 마칩니다. 시청해 주신 연구자 여러분께 감사드립니다."}], "editorial_version": "2026-11-12-v2"}</script><script>
const D=JSON.parse(document.getElementById('data').textContent),content=document.getElementById('content'),search=document.getElementById('search');let active='paragraph';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=s=>[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');
const seekLink=(s,end)=>`<a class="time" href="https://www.youtube.com/watch?v=1whyWHiZp5Q&t=${s}s" data-seek="${s}" title="영상 ${time(s)}로 이동">▶ ${time(s)}${end===undefined?'':'–'+time(end)}</a>`;
const summary=z=>`<div class="summary"><strong>핵심 요약</strong><ul>${z.summary.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
const sentences=[];D.blocks.forEach((b,i)=>{b.text.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean).forEach((text,j)=>sentences.push({id:`S${i+1}-${j+1}`,start:b.start,text}));});
function render(){const q=search.value.trim().toLowerCase();let result='';D.zones.forEach(z=>{let body='';if(active==='sentence'){body=sentences.filter(s=>s.start>=z.start&&s.start<=(z.end)&&s.text.toLowerCase().includes(q)).filter(s=>!D.zones.some(n=>n.start>z.start&&n.start<=s.start)).map(s=>`<div class="sentence" id="${s.id}"><div>${seekLink(s.start)}<br><a class="permalink" href="#sentence/${s.id}" aria-label="문장 고유 링크"># 링크</a></div><p>${esc(s.text)}</p></div>`).join('');}else if(active==='paragraph'){body=z.paragraphs.filter(p=>!q||(p.title+' '+p.text+' '+z.summary.join(' ')).toLowerCase().includes(q)).map(p=>`<section class="paragraph" id="${p.id}"><h3>${esc(p.title)}</h3>${seekLink(p.start,p.end)}<a class="permalink" href="#paragraph/${p.id}"># 문단 링크</a><ul class="semantic-bullets">${p.bullets.map((text,i)=>`<li>${p.bullet_labels?`<strong>${esc(p.bullet_labels[i])}</strong>`:''}<div class="body">${esc(text)}</div></li>`).join('')}</ul></section>`).join('');}else{if(q&&!(z.title+' '+z.summary.join(' ')).toLowerCase().includes(q))return;body=`<a href="#paragraph/${z.id}">이 구간 전체 대본 읽기 →</a>`;}if(!body)return;result+=`<article class="zone" id="${z.id}"><span class="badge">${z.id}</span><h2>${esc(z.title)}</h2>${seekLink(z.start,z.end)}<a class="permalink" href="#${active}/${z.id}"># 구간 링크</a>${active!=='sentence'?summary(z):''}${body}</article>`;});content.innerHTML=result||'<p class="empty">검색 결과가 없습니다.</p>';document.getElementById('note').textContent=active==='sentence'?'전체 문맥 교정본 · 문장별 시간은 대응하는 원문 자막 블록의 시작 시각으로, 편집 후 실제 발화 위치와 차이가 날 수 있습니다.':active==='paragraph'?'11개 주제 구간 · 59개 의미 단위 문단. 전체 문맥 교정본 · 하위 주제별 불릿과 기존 구간 시간을 유지했습니다. 불명확한 수치·자격·날짜는 본문에 확인 필요 사항으로 표시했습니다.':'요약은 대본을 바탕으로 작성한 안내입니다. 신청 자격·금액·일정의 최종 기준은 공식 공고를 확인하세요.';}
function select(tab){active=['sentence','paragraph','summary'].includes(tab)?tab:'paragraph';document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===active));b.tabIndex=b.dataset.tab===active?0:-1});content.setAttribute('aria-labelledby','tab-'+active);render();}
document.getElementById('toc').innerHTML=D.zones.map(z=>`<a href="#paragraph/${z.id}"><b>${z.id}</b> ${esc(z.title)}</a>`).join('');
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){search.value='';location.hash=t.dataset.tab+'/top';return;}const a=e.target.closest('[data-seek]');if(a){e.preventDefault();document.getElementById('video').src='https://www.youtube.com/embed/1whyWHiZp5Q?si=17mnx65TsvmV3ojh&autoplay=1&start='+a.dataset.seek;}});
document.querySelector('[role=tablist]').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const bs=[...document.querySelectorAll('[data-tab]')],i=bs.indexOf(document.activeElement),n=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;bs[n].focus();bs[n].click();});
function route(){const [tab,id]=(location.hash.slice(1)||'paragraph/top').split('/');search.value='';select(tab);requestAnimationFrame(()=>{if(id&&id!=='top')document.getElementById(id)?.scrollIntoView({block:'start'});else window.scrollTo({top:0});});}window.addEventListener('hashchange',route);search.addEventListener('input',render);route();
</script></body></html>
